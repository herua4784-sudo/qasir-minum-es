    function ProduceBatchView({ user, branch }) {
      const [ingredients, setIngredients] = useState([]);
      const [productionRecipes, setProductionRecipes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [outputId, setOutputId] = useState('');
      const [batches, setBatches] = useState(1);
      const [submitting, setSubmitting] = useState(false);
      const notify = useNotification();
      const branchId = branch ? branch.ID : 'BR001';

      const loadData = () => {
        setLoading(true);
        Promise.all([cachedFetch('ingredients_' + branchId, () => runGoogleScript('getIngredients', branchId)), cachedFetch('prodrecipes_' + branchId, () => runGoogleScript('getProductionRecipes', branchId))])
          .then(([ing, rec]) => {
            setIngredients(ing || []);
            setProductionRecipes(rec || []);
            setLoading(false);
            const candidates = (ing || []).filter(i => Number(i.Batch_Yield) > 0);
            setOutputId(prev => prev || (candidates.length > 0 ? candidates[0].ID : ''));
          }).catch(() => setLoading(false));
      };
      useEffect(() => { loadData(); }, [branchId]);

      const outputCandidates = ingredients.filter(i => Number(i.Batch_Yield) > 0);
      const selectedOutput = ingredients.find(i => i.ID === outputId);
      const components = productionRecipes.filter(r => r.Output_Ingredient_ID === outputId);
      const getIngredientName = (id) => { const ing = ingredients.find(i => i.ID === id); return ing ? ing.Name : id; };
      const getIngredientUnit = (id) => { const ing = ingredients.find(i => i.ID === id); return ing ? ing.Unit : ''; };
      const getIngredientStock = (id) => { const ing = ingredients.find(i => i.ID === id); return ing ? Number(ing.Stock) : 0; };

      const batchNum = Number(batches) || 0;
      const totalYield = selectedOutput ? Number(selectedOutput.Batch_Yield || 0) * batchNum : 0;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!outputId || batchNum <= 0) {
          notify.alert("Pilih bahan olahan dan isi jumlah batch dengan benar.", "Data Belum Lengkap", "error");
          return;
        }
        if (components.length === 0) {
          notify.alert("Bahan olahan ini belum punya resep produksi. Atur dulu di tab Resep Produksi (Racikan).", "Resep Belum Ada", "error");
          return;
        }
        const kurangBahan = components.find(c => getIngredientStock(c.Component_Ingredient_ID) < Number(c.Component_Qty) * batchNum);
        const confirmAndSubmit = async () => {
          setSubmitting(true);
          try {
            const res = await runGoogleScript('produceBatch', outputId, batchNum, user && user.name ? user.name : 'Owner', branchId);
            if (res.success) {
              invalidateCache('ingredients_' + branchId);
              notify.alert(`Produksi berhasil! Stok "${selectedOutput.Name}" sekarang: ${res.newStock} ${res.unit}`, "Berhasil Diproduksi", "success");
              setBatches(1);
              loadData();
            } else {
              notify.alert("Gagal produksi: " + res.message, "Gagal", "error");
            }
          } catch (err) {
            notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
          }
          setSubmitting(false);
        };

        if (kurangBahan) {
          notify.confirm(`Stok "${getIngredientName(kurangBahan.Component_Ingredient_ID)}" kemungkinan tidak cukup untuk produksi ini. Tetap lanjutkan?`, confirmAndSubmit);
        } else {
          confirmAndSubmit();
        }
      };

      if (!loading && outputCandidates.length === 0) {
        return (
          <div className="p-6">
            <div className="bg-white rounded-2xl border p-8 text-center text-gray-400 max-w-xl">
              Belum ada bahan olahan/racikan yang bisa diproduksi. Atur dulu di Kelola Produk &gt; Bahan Baku & Resep.
            </div>
          </div>
        );
      }

      return (
        <div className="p-6 h-full overflow-y-auto max-w-xl">
          <div className="mb-6">
            <h2 className="text-2xl font-bold text-gray-800">Produksi Batch (Racikan) <span className="text-sm font-semibold text-indigo-500">Opsional</span></h2>
            <p className="text-indigo-600 text-xs font-bold mt-1">Tidak wajib. Bahan racikan yang resep produksinya sudah diatur akan otomatis memakai bahan mentah setiap kali menu terjual, jadi karyawan tidak perlu membuat batch di aplikasi.</p>
            <p className="text-gray-500 text-sm mt-1">Masak/olah bahan mentah jadi bahan siap pakai, misal Daun Teh + Air jadi Air Teh Ori. Stok bahan mentah otomatis berkurang, stok hasil racikan otomatis bertambah.</p>
          </div>

          <div className="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-1">Bahan Olahan yang Diproduksi</label>
              <select value={outputId} onChange={e => setOutputId(e.target.value)} className="w-full px-3 py-2 border rounded-lg text-sm bg-white font-semibold">
                {outputCandidates.map(ing => <option key={ing.ID} value={ing.ID}>{ing.Name}</option>)}
              </select>
            </div>

            <div>
              <label className="block text-sm font-semibold text-gray-700 mb-1">Berapa Kali Resep (Batch)?</label>
              <div className="flex items-center gap-3">
                <button type="button" onClick={() => setBatches(Math.max(1, batchNum - 1))} className="w-10 h-10 bg-slate-100 border rounded-lg font-bold text-gray-600">-</button>
                <input type="number" min="1" value={batches} onChange={e => setBatches(e.target.value)} className="w-20 text-center px-3 py-2 border rounded-lg text-sm font-bold" />
                <button type="button" onClick={() => setBatches(batchNum + 1)} className="w-10 h-10 bg-slate-100 border rounded-lg font-bold text-gray-600">+</button>
              </div>
            </div>

            {selectedOutput && (
              <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-4">
                <p className="text-xs font-bold text-emerald-700 uppercase tracking-wide mb-1">Hasil yang Akan Didapat</p>
                <p className="text-2xl font-black text-emerald-700">{Number(totalYield || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 })} {selectedOutput.Unit}</p>
                <p className="text-xs text-emerald-600 mt-1">({Number(selectedOutput.Batch_Yield || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 })} {selectedOutput.Unit} x {batchNum} kali masak)</p>
              </div>
            )}

            <div>
              <p className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Bahan Mentah yang Akan Terpakai</p>
              {components.length === 0 ? (
                <p className="text-sm text-gray-400 italic">Belum ada resep produksi untuk bahan ini.</p>
              ) : (
                <div className="space-y-2">
                  {components.map(c => {
                    const needed = Number(c.Component_Qty) * batchNum;
                    const stock = getIngredientStock(c.Component_Ingredient_ID);
                    const notEnough = stock < needed;
                    return (
                      <div key={c.ID} className={`flex justify-between items-center p-3 rounded-lg border ${notEnough ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-100'}`}>
                        <span className="font-semibold text-gray-700 text-sm">{getIngredientName(c.Component_Ingredient_ID)}</span>
                        <div className="text-right">
                          <span className={`font-bold text-sm ${notEnough ? 'text-red-600' : 'text-gray-800'}`}>-{needed.toLocaleString('id-ID', { maximumFractionDigits: 2 })} {getIngredientUnit(c.Component_Ingredient_ID)}</span>
                          <p className="text-[10px] text-gray-400">Stok saat ini: {Number(stock || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 })} {getIngredientUnit(c.Component_Ingredient_ID)}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <button onClick={handleSubmit} disabled={submitting || components.length === 0} className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors">
              {submitting ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Konfirmasi & Proses Produksi'}
            </button>
          </div>
        </div>
      );
    }

    // ==========================================
    // MENU BARANG MASUK UNTUK KASIR: tiga tab dalam satu menu.
    //  1) Catat Barang Masuk   (form yang sudah ada)
    //  2) Riwayat Masuk/Keluar (catatan terbaru, bisa disaring)
    //  3) Stok Outlet          (jumlah stok semua bahan baku di outlet ini)
    // Tab 2 dan 3 hanya untuk dibaca. Keduanya tetap jalan saat offline: data dari
    // simpanan lokal, dan catatan yang masih menunggu sinkron ikut diperhitungkan.
    // ==========================================
    // Stok yang ditampilkan: bahan olahan (racikan) otomatis = stok sendiri + yang bisa dibuat dari bahan mentah (Auto_Stock dari server).
    const isAutoOlahan = (ing) => !!ing && ing.Auto_Stock !== undefined && ing.Auto_Stock !== null && ing.Auto_Stock !== '';
    const effStock = (ing) => isAutoOlahan(ing) ? Number(ing.Auto_Stock) : Number(ing.Stock);
    // Pembulatan penuh (tanpa angka di belakang koma) untuk layar Inventory milik Owner.
    const fmtInt = (n) => Math.round(Number(n || 0)).toLocaleString('id-ID');
    const fmtQty = (n) => Number(n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });

    // Memantau antrian offline: begitu isinya berubah (ada yang masuk, atau selesai
    // tersinkron), panggil onChange supaya layar memuat ulang data terbaru.
    function useQueueWatcher(onChange) {
      const callbackRef = useRef(onChange);
      callbackRef.current = onChange;
      useEffect(() => {
        let alive = true;
        let lastSig = null;
        const check = () => {
          queueGetAllWrites().then(list => {
            if (!alive) return;
            const sig = list.map(i => i.id + (i.failed ? 'f' : 'p')).join(',');
            if (lastSig !== null && lastSig !== sig) callbackRef.current();
            lastSig = sig;
          }).catch(() => {});
        };
        check();
        const timer = setInterval(check, 4000);
        window.addEventListener('online', check);
        return () => { alive = false; clearInterval(timer); window.removeEventListener('online', check); };
      }, []);
    }

    function KasirStockHistoryView({ branch }) {

      const FETCH_LIMIT = 300;
      const [movements, setMovements] = useState([]);
      const [ingredients, setIngredients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(false);
      const [filterType, setFilterType] = useState('Semua');
      const [hideAuto, setHideAuto] = useState(true);
      const [visibleCount, setVisibleCount] = useState(PAGE_SIZE);
      const reqRef = useRef(0);

      const load = (showSpinner) => {
        const myReq = ++reqRef.current; // balasan lama diabaikan kalau filter sudah berganti
        if (showSpinner) setLoading(true);
        setLoadError(false);
        Promise.all([
          runGoogleScript('getRecentStockMovements', branchId, FETCH_LIMIT, filterType, hideAuto),
          runGoogleScript('getIngredients', branchId).catch(() => null)
        ]).then(([mv, ing]) => {
          if (myReq !== reqRef.current) return;
          setMovements(mv || []);
          if (ing) setIngredients(ing);
          setLoading(false);
        }).catch(() => {
          if (myReq !== reqRef.current) return;
          setLoading(false);
          setLoadError(true);
        });
      };

      useEffect(() => { setVisibleCount(PAGE_SIZE); load(true); }, [branchId, filterType, hideAuto]);
      useQueueWatcher(() => load(false));

      const ingById = {};
      ingredients.forEach(i => { ingById[i.ID] = i; });
      const nameOf = (id) => (ingById[id] ? ingById[id].Name : id);
      const unitOf = (id) => (ingById[id] ? ingById[id].Unit : '');

      return (

            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-gray-800">Riwayat Barang Masuk / Keluar</h2>
              <p className="text-gray-500 text-sm mt-1">Catatan stok bahan baku terbaru di outlet ini.</p>
            </div>
            <button onClick={() => load(true)} className="bg-white border rounded-xl px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-50 transition-colors">
              <i className="fa-solid fa-rotate mr-1.5"></i>Muat Ulang
            </button>
          </div>

          <div className="mb-4 flex flex-wrap items-center gap-3 flex-shrink-0">
            <div className="bg-white rounded-xl shadow-sm border p-1 flex">
              {['Semua', 'Masuk', 'Keluar'].map(t => (
                <button key={t} onClick={() => setFilterType(t)} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${filterType === t ? 'bg-indigo-50 text-indigo-700' : 'text-gray-500 hover:bg-gray-100'}`}>{t}</button>
              ))}

            <label className="flex items-center gap-2 text-sm font-semibold text-gray-600 cursor-pointer">

            </label>
          </div>

          {loadError && movements.length > 0 && (
            <div className="mb-3 bg-amber-50 text-amber-700 text-xs font-semibold px-3 py-2 rounded-lg flex-shrink-0">
              <i className="fa-solid fa-triangle-exclamation mr-1.5"></i>Tidak bisa memuat data terbaru, yang tampil adalah data tersimpan terakhir.
            </div>
          )}

          <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 min-h-0 flex flex-col">
            <div className="overflow-auto flex-1">
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="bg-gray-50 border-b sticky top-0 z-10">
                  <tr>
                    <th className="p-4 font-semibold text-gray-600">Waktu</th>
                    <th className="p-4 font-semibold text-gray-600">Bahan Baku</th>
                    <th className="p-4 font-semibold text-gray-600">Tipe</th>
                    <th className="p-4 font-semibold text-gray-600">Jumlah</th>
                    <th className="p-4 font-semibold text-gray-600">Catatan / Referensi</th>

                </thead>
                <tbody>
                  {loading ? (
                    <tr><td colSpan="5" className="p-12 text-center text-gray-400">Memuat...</td></tr>

    function OutletStockReportView({ branch }) {
      const branchId = branch ? branch.ID : 'BR001';
      const [ingredients, setIngredients] = useState([]);
      const [pending, setPending] = useState({ movements: [], salesCount: 0 });
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [loadError, setLoadError] = useState(false);
      const [lastUpdated, setLastUpdated] = useState(null);
      const [search, setSearch] = useState('');
      const [onlyLow, setOnlyLow] = useState(false);
      const reqRef = useRef(0);

      // Catatan di antrian offline yang belum sampai ke server (milik outlet ini).
      const loadPending = () => {
        queueGetAllWrites().then(list => {
          const active = list.filter(i => !i.failed);
          setPending({
            movements: active.filter(i => i.functionName === 'recordStockMovement' && i.args[6] === branchId),
            salesCount: active.filter(i => i.functionName === 'saveTransaction' && i.args[8] === branchId).length
          });
        }).catch(() => {});
      };

      const load = (showSpinner) => {
        const myReq = ++reqRef.current;
        if (showSpinner) setLoading(true);
        setRefreshing(true);
        setLoadError(false);
        loadPending();
        let gotFresh = false;
        // 1) simpanan lokal dulu supaya langsung ada isinya
        runGoogleScript('getIngredients', branchId).then(d => {
          if (myReq !== reqRef.current || gotFresh || !d) return;
          setIngredients(d);
          setLoading(false);
        }).catch(() => {});
        // 2) lalu data terbaru dari server
        runGoogleScriptFresh('getIngredients', branchId).then(d => {
          if (myReq !== reqRef.current) return;
          gotFresh = true;
          setIngredients(d || []);
          setLoading(false);
          setRefreshing(false);
          if (getReadSource('getIngredients', [branchId]) === 'server') setLastUpdated(new Date());
        }).catch(() => {
          if (myReq !== reqRef.current) return;
          setLoading(false);
          setRefreshing(false);
          setLoadError(true);
        });
      };

      useEffect(() => { load(true); }, [branchId]);
      useQueueWatcher(() => load(false));

      // Barang masuk/keluar yang masih antri ikut dihitung, supaya kasir tidak melihat
      // stok "mundur" sesaat setelah mencatat saat offline.
      const deltaMap = {};
      pending.movements.forEach(item => {
        const ing = ingredients.find(i => i.ID === item.args[0]);
        deltaMap[item.args[0]] = (deltaMap[item.args[0]] || 0) + convertPendingMovement(item, ing).signed;
      });
      const rows = ingredients.map(ing => {
        const delta = deltaMap[ing.ID] || 0;
        const stock = Math.round(((effStock(ing) || 0) + delta) * 10000) / 10000;
        const min = Number(ing.Min_Stock) || 0;
        const conv = Number(ing.Purchase_Conversion) || 0;
        return {
          ing, stock, delta, min,
          status: stock <= 0 ? 'habis' : (stock <= min ? 'menipis' : 'aman'),
          purchaseEq: (ing.Purchase_Unit && conv > 0) ? stock / conv : null
        };
      });
      const lowCount = rows.filter(r => r.status !== 'aman').length;
      const q = search.trim().toLowerCase();
      const displayed = rows.filter(r => (!onlyLow || r.status !== 'aman') && (!q || String(r.ing.Name).toLowerCase().includes(q)));

      return (
        <div className="p-4 sm:p-6 h-full flex flex-col">
          <div className="mb-4 flex flex-wrap items-start justify-between gap-3 flex-shrink-0">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-gray-800">Stok Bahan Baku Outlet</h2>
              <p className="text-gray-500 text-sm mt-1">Jumlah stok semua bahan baku di outlet ini.</p>
            </div>
            <div className="flex items-center gap-3">
              <span className="text-xs text-gray-400">
                {refreshing ? 'Memuat...' : (lastUpdated ? 'Diperbarui ' + lastUpdated.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : 'Data tersimpan')}
              </span>
              <button onClick={() => load(false)} disabled={refreshing} className="bg-white border rounded-xl px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-50 disabled:opacity-60 transition-colors">
                <i className={`fa-solid fa-rotate mr-1.5 ${refreshing ? 'fa-spin' : ''}`}></i>Muat Ulang
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-4 flex-shrink-0">
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-l-4 border-l-blue-500">
              <p className="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Jenis Bahan</p>
              <h3 className="text-2xl font-black text-gray-800">{rows.length}</h3>
            </div>
            <div className="bg-white p-4 rounded-2xl shadow-sm border border-l-4 border-l-red-500">
              <p className="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Menipis / Habis</p>
              <h3 className="text-2xl font-black text-red-600">{lowCount}</h3>
            </div>
          </div>

          {pending.movements.length > 0 && (
            <div className="mb-3 bg-amber-50 text-amber-700 text-xs font-semibold px-3 py-2 rounded-lg flex-shrink-0">
              <i className="fa-solid fa-clock-rotate-left mr-1.5"></i>Sudah termasuk {pending.movements.length} catatan barang masuk/keluar yang belum sinkron.
            </div>
          )}
          {pending.salesCount > 0 && (
            <div className="mb-3 bg-amber-50 text-amber-700 text-xs font-semibold px-3 py-2 rounded-lg flex-shrink-0">
              <i className="fa-solid fa-clock-rotate-left mr-1.5"></i>Ada {pending.salesCount} transaksi penjualan yang belum sinkron. Pemakaian bahannya baru mengurangi stok setelah sinkron, jadi angka di bawah bisa sedikit lebih tinggi dari kenyataan.
            </div>
          )}
          {loadError && ingredients.length > 0 && (
            <div className="mb-3 bg-amber-50 text-amber-700 text-xs font-semibold px-3 py-2 rounded-lg flex-shrink-0">
              <i className="fa-solid fa-triangle-exclamation mr-1.5"></i>Tidak bisa memuat data terbaru, yang tampil adalah data tersimpan terakhir.
            </div>
          )}

          <div className="mb-3 flex flex-wrap items-center gap-3 flex-shrink-0">
            <div className="relative flex-1 min-w-[180px] max-w-xs">
              <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
              <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Cari bahan baku..." className="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white" />
            </div>
            <label className="flex items-center gap-2 text-sm font-semibold text-gray-600 cursor-pointer">
              <input type="checkbox" checked={onlyLow} onChange={e => setOnlyLow(e.target.checked)} className="w-4 h-4" />
              Hanya yang menipis / habis
            </label>
          </div>

          <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 min-h-0 flex flex-col">
            <div className="overflow-auto flex-1">
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="bg-gray-50 border-b sticky top-0 z-10">
                  <tr>
                    <th className="p-4 font-semibold text-gray-600">Bahan Baku</th>
                    <th className="p-4 font-semibold text-gray-600">Stok Saat Ini</th>
                    <th className="p-4 font-semibold text-gray-600">Stok Minimum</th>
                    <th className="p-4 font-semibold text-gray-600">Status</th>
                  </tr>
                </thead>
                <tbody>
                  {loading ? (
                    <tr><td colSpan="4" className="p-12 text-center text-gray-400">Memuat...</td></tr>
                  ) : loadError && ingredients.length === 0 ? (
                    <tr><td colSpan="4" className="p-10 text-center">
                      <p className="text-amber-600 font-semibold mb-3"><i className="fa-solid fa-triangle-exclamation mr-1.5"></i>Gagal memuat stok (kemungkinan sedang offline dan belum ada data tersimpan).</p>
                      <button onClick={() => load(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">Coba Lagi</button>
                    </td></tr>
                  ) : displayed.length === 0 ? (
                    <tr><td colSpan="4" className="p-12 text-center text-gray-400">{rows.length === 0 ? 'Belum ada data bahan baku untuk outlet ini.' : 'Tidak ada bahan yang cocok.'}</td></tr>
                  ) : (
                    displayed.map(r => (
                      <tr key={r.ing.ID} className="border-b border-gray-50 hover:bg-slate-50">
                        <td className="p-4 font-bold text-gray-800">{r.ing.Name}{isAutoOlahan(r.ing) && <span className="block text-[11px] font-semibold text-indigo-500">Racikan otomatis dari bahan mentah</span>}</td>
                        <td className="p-4">
                          <span className="font-bold text-gray-800">{fmtQty(r.stock)} {r.ing.Unit}</span>
                          {r.purchaseEq !== null && (
                            <span className="block text-[11px] text-gray-400">≈ {fmtQty(r.purchaseEq)} {r.ing.Purchase_Unit}</span>
                          )}
                          {r.delta !== 0 && (
                            <span className="inline-flex items-center gap-1 bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-full mt-0.5">
                              <i className="fa-solid fa-clock-rotate-left"></i>{r.delta > 0 ? '+' : ''}{fmtQty(r.delta)} belum sinkron
                            </span>
                          )}
                        </td>
                        <td className="p-4 text-gray-500">{fmtQty(r.min)} {r.ing.Unit}</td>
                        <td className="p-4">
                          {r.status === 'habis' ? (
                            <span className="bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-full"><i className="fa-solid fa-circle-xmark mr-1"></i>Habis</span>
                          ) : r.status === 'menipis' ? (
                            <span className="bg-amber-100 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-full"><i className="fa-solid fa-triangle-exclamation mr-1"></i>Menipis</span>
                          ) : (
                            <span className="bg-emerald-100 text-emerald-600 text-xs font-bold px-2.5 py-1 rounded-full"><i className="fa-solid fa-circle-check mr-1"></i>Aman</span>
                          )}
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // BARANG MASUK — versi sederhana untuk kasir & owner mencatat barang yang
    // diambil dari gudang ke outlet. Menggantikan laporan manual di spreadsheet:
    // harga otomatis pakai harga standar bahan itu, kecuali dicentang "beli di
    // luar gudang" baru boleh isi harga khusus untuk transaksi ini saja.
    // ==========================================
    function BarangMasukView({ user, branch }) {
      const [ingredients, setIngredients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(false);
      const [ingredientId, setIngredientId] = useState('');
      const [qty, setQty] = useState('');
      const [customPriceMode, setCustomPriceMode] = useState(false);
      const [customPrice, setCustomPrice] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const notify = useNotification();
      const branchId = branch ? branch.ID : 'BR001';

      const loadData = () => {
        setLoading(true);
        setLoadError(false);
        cachedFetch('ingredients_' + branchId, () => runGoogleScript('getIngredients', branchId)).then(data => {
          setIngredients(data || []);
          setLoading(false);
          setIngredientId(prev => (data && data.length > 0) ? (data.find(d => d.ID === prev) ? prev : data[0].ID) : '');
        }).catch(() => { setLoading(false); setLoadError(true); });
      };
      useEffect(() => { loadData(); }, [branchId]);

      const selectedIngredient = ingredients.find(i => i.ID === ingredientId);

      // Kalau bahan ini sudah diatur "Satuan Beli"-nya oleh Owner (misal 1 Kotak = 1000 ml),
      // kasir cukup input pakai satuan awam itu (Kotak/Kaleng/dus/dll) — tidak perlu tahu
      // satuan presisi resep sama sekali. Konversi ke satuan resep terjadi otomatis di server.
      const hasPurchaseUnit = selectedIngredient && selectedIngredient.Purchase_Unit && Number(selectedIngredient.Purchase_Conversion) > 0;
      const inputUnitLabel = hasPurchaseUnit ? selectedIngredient.Purchase_Unit : (selectedIngredient ? selectedIngredient.Unit : '');
      const previewConverted = hasPurchaseUnit && qty
        ? Number(qty) * Number(selectedIngredient.Purchase_Conversion)
        : null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!ingredientId || !qty || Number(qty) <= 0) {
          notify.alert("Pilih barang dan isi jumlah dengan benar.", "Data Belum Lengkap", "error");
          return;
        }
        if (customPriceMode && (!customPrice || Number(customPrice) <= 0)) {
          notify.alert("Isi harga belinya, atau matikan centang \"Beli di luar gudang\" kalau memang tidak ada harga khusus.", "Data Belum Lengkap", "error");
          return;
        }
        setSubmitting(true);
        try {
          const res = await runGoogleScript(
            'recordStockMovement',
            ingredientId,
            'Masuk',
            Number(qty),
            'Ambil dari Gudang',
            user && user.name ? user.name : 'Kasir',
            hasPurchaseUnit ? 'purchase' : 'base',
            branchId,
            customPriceMode ? Number(customPrice) : ''
          );
          if (res.success) {
            invalidateCache('ingredients_' + branchId);
            if (res.offlineQueued) {
              notify.alert(`Tersimpan offline. Stok "${selectedIngredient ? selectedIngredient.Name : ''}" akan diperbarui otomatis begitu tersinkron.`, "Tersimpan Offline", "success");
            } else {
              notify.alert(`Berhasil dicatat. Stok "${selectedIngredient ? selectedIngredient.Name : ''}" sekarang: ${res.newStock} ${selectedIngredient ? selectedIngredient.Unit : ''}`, "Berhasil", "success");
            }
            setQty('');
            setCustomPriceMode(false);
            setCustomPrice('');
            loadData();
          } else {
            notify.alert("Gagal mencatat: " + res.message, "Gagal", "error");
          }
        } catch (err) {
          notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
        }
        setSubmitting(false);
      };

      return (
        <div className="p-6 h-full overflow-y-auto">
          <div className="max-w-lg mx-auto">
            <div className="mb-6">
              <h2 className="text-2xl font-bold text-gray-800">Barang Masuk</h2>
              <p className="text-gray-500 text-sm mt-1">Catat barang yang diambil dari gudang untuk outlet ini.</p>
            </div>

            {loading ? (

    function StockMovementFormView({ user, branch }) {
      const [ingredients, setIngredients] = useState([]);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(false);
      const [type, setType] = useState('Masuk');
      const [ingredientId, setIngredientId] = useState('');
      const [unitType, setUnitType] = useState('base');
      const [qty, setQty] = useState('');
      const [reason, setReason] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const notify = useNotification();
      const branchId = branch ? branch.ID : 'BR001';

      const loadData = () => {
        setLoading(true);
        setLoadError(false);
        cachedFetch('ingredients_' + branchId, () => runGoogleScript('getIngredients', branchId)).then(data => {
          setIngredients(data || []);
          setLoading(false);
          setIngredientId(prev => (data && data.length > 0) ? (data.find(d => d.ID === prev) ? prev : data[0].ID) : '');
        }).catch(() => { setLoading(false); setLoadError(true); });
      };
      useEffect(() => { loadData(); }, [branchId]);

      const selectedIngredient = ingredients.find(i => i.ID === ingredientId);
      const hasConversion = selectedIngredient && selectedIngredient.Purchase_Unit && Number(selectedIngredient.Purchase_Conversion) > 0;

      const handleIngredientChange = (id) => {
        setIngredientId(id);
        setUnitType('base'); // reset ke satuan resep tiap ganti bahan, biar tidak ketuker konversi bahan lain
      };

      const previewConverted = hasConversion && unitType === 'purchase' && qty
        ? Number(qty) * Number(selectedIngredient.Purchase_Conversion)
        : null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!ingredientId || !qty || Number(qty) <= 0) {
          notify.alert("Pilih bahan baku dan isi jumlah dengan benar.", "Data Belum Lengkap", "error");
          return;
        }
        setSubmitting(true);
        try {
          const res = await runGoogleScript(
            'recordStockMovement',
            ingredientId,
            type,
            Number(qty),
            reason || (type === 'Masuk' ? 'Pembelian Stok' : 'Penyesuaian Manual'),
            user && user.name ? user.name : 'Owner',
            unitType,
            branchId
          );
          if (res.success) {
            invalidateCache('ingredients_' + branchId);
            if (res.offlineQueued) {
              notify.alert("Tersimpan offline. Stok akan diperbarui otomatis begitu tersinkron.", "Tersimpan Offline", "success");
            } else {
              notify.alert(`Stok berhasil dicatat. Stok terbaru: ${res.newStock} ${selectedIngredient ? selectedIngredient.Unit : ''}`, "Berhasil", "success");
            }
            setQty('');
            setReason('');
            loadData();
          } else {
            notify.alert("Gagal mencatat: " + res.message, "Gagal", "error");
          }
        } catch (err) {
          notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
        }
        setSubmitting(false);
      };

      return (
        <div className="p-6 h-full overflow-y-auto max-w-xl">
          <div className="mb-6">
            <h2 className="text-2xl font-bold text-gray-800">Catat Stok Masuk / Keluar</h2>
            <p className="text-gray-500 text-sm mt-1">Gunakan untuk mencatat pembelian bahan baku baru, atau penyesuaian stok (rusak, kadaluarsa, dsb). Pengurangan stok dari penjualan tercatat otomatis, tidak perlu diinput di sini.</p>
          </div>

          {loadError ? (
            <div className="bg-white rounded-2xl shadow-sm border p-6 text-center">
              <p className="text-amber-600 font-semibold mb-3"><i className="fa-solid fa-triangle-exclamation mr-1.5"></i>Gagal memuat daftar bahan baku (kemungkinan sedang offline dan belum ada data tersimpan).</p>
              <button onClick={loadData} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">Coba Lagi</button>
            </div>
          ) : !loading && ingredients.length === 0 ? (
            <div className="bg-white rounded-2xl shadow-sm border p-6 text-center text-gray-400">
              Belum ada bahan baku terdaftar. Tambahkan dulu di menu Kelola Produk &gt; Bahan Baku & Resep.
            </div>
          ) : (
            <div className="bg-white rounded-2xl shadow-sm border p-6">
              <div className="grid grid-cols-2 gap-3 mb-5">
                <button type="button" onClick={() => setType('Masuk')} className={`p-4 rounded-xl border flex flex-col items-center gap-2 transition-all ${type === 'Masuk' ? 'bg-emerald-50 border-emerald-500 text-emerald-700 ring-2 ring-emerald-100' : 'border-gray-200 text-gray-500'}`}>
                  <i className="fa-solid fa-arrow-down text-xl"></i>
                  <span className="font-bold text-sm">Stok Masuk</span>
                </button>
                <button type="button" onClick={() => setType('Keluar')} className={`p-4 rounded-xl border flex flex-col items-center gap-2 transition-all ${type === 'Keluar' ? 'bg-red-50 border-red-500 text-red-700 ring-2 ring-red-100' : 'border-gray-200 text-gray-500'}`}>
                  <i className="fa-solid fa-arrow-up text-xl"></i>
                  <span className="font-bold text-sm">Stok Keluar</span>
                </button>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">Bahan Baku</label>
                  <SearchableSelect
                    options={ingredients}
                    value={ingredientId}
                    onChange={handleIngredientChange}
                    placeholder="Ketik untuk cari bahan baku..."
                    getValue={ing => ing.ID}
                    getLabel={ing => `${ing.Name} (Stok saat ini: ${ing.Stock} ${ing.Unit})`}
                  />
                </div>

                {hasConversion && (
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">Input Jumlah Dalam Satuan</label>
                    <div className="grid grid-cols-2 gap-3">
                      <button type="button" onClick={() => setUnitType('base')} className={`p-2.5 rounded-xl border text-sm font-bold transition-all ${unitType === 'base' ? 'bg-indigo-50 border-indigo-500 text-indigo-700' : 'border-gray-200 text-gray-500'}`}>
                        Satuan Resep ({selectedIngredient.Unit})
                      </button>
                      <button type="button" onClick={() => setUnitType('purchase')} className={`p-2.5 rounded-xl border text-sm font-bold transition-all ${unitType === 'purchase' ? 'bg-amber-50 border-amber-500 text-amber-700' : 'border-gray-200 text-gray-500'}`}>
                        Satuan Beli ({selectedIngredient.Purchase_Unit})
                      </button>
                    </div>
                  </div>
                )}

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">
                    Jumlah {hasConversion && unitType === 'purchase' ? `(${selectedIngredient.Purchase_Unit})` : selectedIngredient ? `(${selectedIngredient.Unit})` : ''}
                  </label>
                  <input type="number" step="any" value={qty} onChange={e => setQty(e.target.value)} className="w-full px-3 py-2 border rounded-lg text-sm" placeholder="0" />
                  {previewConverted !== null && (
                    <p className="text-xs text-amber-700 font-semibold mt-1.5">
                      <i className="fa-solid fa-arrow-right-arrow-left mr-1"></i>
                      = {previewConverted} {selectedIngredient.Unit} akan {type === 'Masuk' ? 'ditambahkan ke' : 'dikurangi dari'} stok
                    </p>
                  )}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-1">Catatan / Alasan</label>
                  <input type="text" value={reason} onChange={e => setReason(e.target.value)} className="w-full px-3 py-2 border rounded-lg text-sm" placeholder={type === 'Masuk' ? 'Misal: Belanja ke supplier X' : 'Misal: Susu basi, tumpah, dll'} />
                </div>
                <button type="submit" disabled={submitting} className={`w-full font-bold py-3 rounded-xl shadow-md transition-colors text-white ${type === 'Masuk' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-600 hover:bg-red-700'} disabled:bg-gray-300`}>
                  {submitting ? <i className="fa-solid fa-spinner fa-spin"></i> : `Simpan ${type === 'Masuk' ? 'Stok Masuk' : 'Stok Keluar'}`}
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }

        </div>

    function QRISSettingsView({ settings, onRefresh }) {
       const [uploading, setUploading] = useState(false);
       const [qrisType, setQrisType] = useState(settings.QRIS_Type || 'Mockup');
       const notify = useNotification();

       const handleFileSelect = (e) => {
         const file = e.target.files[0];
         if (!file) return;

         const reader = new FileReader();
         reader.readAsDataURL(file);
         reader.onload = async () => {
            setUploading(true);
            try {
              const base64Data = reader.result.split(',')[1];
              const filename = "QRIS_" + new Date().getTime() + ".jpg";
              
              const uploadRes = await runGoogleScript('uploadImage', base64Data, filename, 'image/jpeg');
              if (uploadRes.success) {
                 await runGoogleScript('saveSetting', 'QRIS_Image_URL', uploadRes.url);
                 await runGoogleScript('saveSetting', 'QRIS_Type', 'Static');
                 setQrisType('Static');
                 onRefresh();
                 notify.alert("Foto QRIS toko Anda berhasil diunggah dan diaktifkan!", "Unggah QRIS Sukses", "success");
              } else {
                 notify.alert("Gagal mengunggah foto: " + uploadRes.message, "Gagal", "error");
              }
            } catch(err) {
              notify.alert("Terjadi masalah saat mengunggah berkas QRIS.", "Eror", "error");
            }
            setUploading(false);
         };
         e.target.value = null; 
       };

       const handleTypeChange = async (type) => {
          setQrisType(type);
          await runGoogleScript('saveSetting', 'QRIS_Type', type);
          onRefresh();
          notify.alert(`Sistem beralih menggunakan ${type === 'Static' ? 'QRIS Statis Toko Anda' : 'QRIS Dinamis (Mockup)'}.`, "Sistem Diperbarui", "success");

                    className={`p-4 rounded-xl border flex flex-col items-center gap-2 text-center transition-all ${qrisType === 'Static' ? 'bg-indigo-50 border-indigo-500 text-indigo-700 ring-2 ring-indigo-100' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}
                  >
                    <i className="fa-solid fa-qrcode text-2xl"></i>
                    <div>
                      <p className="font-bold text-sm">QRIS Toko Anda</p>
                      <p className="text-[10px] text-gray-400 mt-0.5 leading-tight">Gunakan gambar QRIS resmi milik gerai Anda.</p>
                    </div>
                  </button>
                  <button 
                    type="button"

                  >
                    <i className="fa-solid fa-wand-magic-sparkles text-2xl"></i>
                    <div>
                      <p className="font-bold text-sm">QRIS Dinamis</p>
                      <p className="text-[10px] text-gray-400 mt-0.5 leading-tight">Gunakan kode otomatis sistem (Mockup).</p>
                    </div>
                  </button>
                </div>
              </div>

              {qrisType === 'Static' && (
                <div className="bg-slate-50 p-5 rounded-xl border border-dashed border-slate-300 space-y-4 animate-fade-in">
                   <p className="text-xs font-bold text-gray-700 uppercase tracking-wide">Unggah QRIS Toko Anda</p>

                     <div className="w-32 h-32 bg-white border rounded-xl overflow-hidden shadow-inner flex items-center justify-center p-2 shrink-0">

                    <p className="text-[9px] text-gray-400 text-center leading-tight">QRIS aktif: {qrisType === 'Static' ? 'Statis Toko' : 'Dinamis Mockup'}</p>

         </div>
       );

    // Pengaturan cetak untuk tablet ini: metode (dialog Android / RawBT), cetak otomatis, tes cetak.

    // Satu daftar per outlet: kunci FAVORITE_PRODUCTS_<ID outlet>.
    const favoriteKeyFor = (branchId) => 'FAVORITE_PRODUCTS_' + (branchId || 'BR001');
    function parseFavoriteIds(raw) {
      try {
        const v = typeof raw === 'string' ? JSON.parse(raw || '[]') : raw;
        return Array.isArray(v) ? v.map(String).filter((x, i, arr) => x && arr.indexOf(x) === i) : [];
      } catch (e) { return []; }
    }

    // --- RIWAYAT TRANSAKSI VIEW (STANDAR TANPA DUPLIKAT) ---
    function HistoryView({ limitToday, cashierName, settings, branch, allowBranchFilter }) {
      const [trx, setTrx] = useState([]);
      const [loading, setLoading] = useState(true);
      const [timeFilter, setTimeFilter] = useState('Hari Ini');
      const [startDate, setStartDate] = useState(() => new Date().toISOString().substring(0, 10));
      const [endDate, setEndDate] = useState(() => new Date().toISOString().substring(0, 10));
      const [branchList, setBranchList] = useState([]);
      const [loadError, setLoadError] = useState('');
      const [viewBranchId, setViewBranchId] = useState(allowBranchFilter ? 'ALL' : (branch ? branch.ID : 'BR001'));
      const notify = useNotification();

      useEffect(() => {
        if (allowBranchFilter) {
          runGoogleScript('getBranches').then(data => setBranchList(data || [])).catch(() => {});
        }
      }, []);

      const handlePrintAgain = (t) => {
        try {
          const items = typeof t.Items === 'string' ? JSON.parse(t.Items) : t.Items;
          printReceipt({
            id: t.TRX_ID,
            date: t.Date,
            cashier: t.Cashier,
            paymentMethod: t.Payment_Method || 'Tunai',
            items: items,
            total: Number(t.Total),
            cashReceived: t.Cash_Received !== undefined && t.Cash_Received !== '' ? Number(t.Cash_Received) : Number(t.Total),
            change: t.Change !== undefined && t.Change !== '' ? Number(t.Change) : 0
          }, settings);
        } catch(e) {
          notify.alert("Gagal memproses struk belanja untuk dicetak kembali.", "Kesalahan Cetak", "error");
        }
      };

      const loadData = () => {
        setLoading(true);
        setLoadError('');
        if (limitToday && cashierName) {
          // Mode "Riwayat Hari Ini" milik kasir: pakai fungsi ringan yang sudah
          // menyaring tanggal & kasir DI SERVER, jadi tidak perlu transfer
          // seluruh riwayat transaksi lama yang tidak dipakai.
          const branchParam = branch ? branch.ID : 'BR001';
          runGoogleScript('getTodayCashierTransactions', '', branchParam).then(data => {
            setTrx(data || []);
            setLoading(false);
          }).catch((err) => { setLoadError(String((err && err.message) || err || 'Gagal memuat')); setLoading(false); });
        } else {
          const branchParam = viewBranchId === 'ALL' ? undefined : viewBranchId;
          runGoogleScript('getTransactions', branchParam).then(data => {
            setTrx(data || []);
            setLoading(false);
          }).catch((err) => { setLoadError(String((err && err.message) || err || 'Gagal memuat')); setLoading(false); });
        }
      };

      useEffect(() => { loadData(); }, [viewBranchId]);

      // Filter kalender (khusus tampilan "Seluruh Riwayat Transaksi", bukan riwayat harian kasir
      // yang memang sudah otomatis dibatasi hari ini)
      const timeFilteredTrx = (() => {
        if (limitToday) return trx;
        const now = new Date();
        return trx.filter(t => {
          try {
            const d = parseIndoDate(t.Date);
            if (timeFilter === 'Hari Ini') {
              return d.toDateString() === now.toDateString();
            } else if (timeFilter === 'Minggu Ini') {
              const diffDays = (now - d) / (1000 * 60 * 60 * 24);
              return diffDays >= 0 && diffDays <= 7;
            } else if (timeFilter === 'Bulan Ini') {
              return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            } else if (timeFilter === 'Pilih Tanggal') {
              const start = new Date(startDate);
              const end = new Date(endDate);
              start.setHours(0, 0, 0, 0);
              end.setHours(23, 59, 59, 999);
              return d >= start && d <= end;
            }
          } catch (err) {
            console.error("Filter tanggal bermasalah:", err);
          }
          return true;
        });
      })();

      const totalPenjualan = timeFilteredTrx.reduce((sum, t) => sum + (Number(t.Total) || 0), 0);

      return (
        <div className="p-6 h-full flex flex-col">
          <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-3 mb-6">
            <div className="flex items-center gap-3">

              <button onClick={loadData} disabled={loading} className="bg-white border hover:bg-gray-50 text-gray-600 w-9 h-9 rounded-xl flex items-center justify-center transition-colors flex-shrink-0" title="Muat ulang transaksi terbaru">

              </button>
            </div>
            {!limitToday && (
              <div className="flex flex-col md:flex-row items-start md:items-center gap-3">
                {allowBranchFilter && branchList.length > 0 && (
                  <select value={viewBranchId} onChange={e => setViewBranchId(e.target.value)} className="px-3 py-2 border rounded-xl text-sm font-bold bg-white">

                    {branchList.map(b => <option key={b.ID} value={b.ID}>{b.Name}</option>)}

                <div className="bg-white rounded-xl shadow-sm border p-1 flex flex-wrap w-fit">
                  {['Hari Ini', 'Minggu Ini', 'Bulan Ini', 'Pilih Tanggal'].map(tf => (
                    <button key={tf} onClick={() => setTimeFilter(tf)} className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${timeFilter === tf ? 'bg-indigo-50 text-indigo-700' : 'text-gray-500 hover:bg-gray-100'}`}>{tf}</button>
                  ))}
                </div>

                {timeFilter === 'Pilih Tanggal' && (
                  <div className="flex items-center gap-2 bg-white p-2 rounded-xl shadow-sm border border-slate-150 animate-fade-in text-xs">
                    <div className="flex flex-col">
                      <span className="text-[9px] text-gray-400 font-bold uppercase pl-1 mb-0.5">Mulai</span>
                      <input

                    <span className="text-xs text-gray-400 font-bold mt-4">s/d</span>

                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
          <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 flex flex-col">
            <div className="overflow-auto flex-1">
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="bg-gray-50 sticky top-0 border-b">
                  <tr>

    function AttendanceView({ user, branch }) {
      const [loading, setLoading] = useState(false);
      const [myRecords, setMyRecords] = useState([]);
      const [loadingRecords, setLoadingRecords] = useState(true);
      const [shiftModalOpen, setShiftModalOpen] = useState(false);
      const [umStatus, setUmStatus] = useState({ alreadyAdded: false });
      const [loadingUmStatus, setLoadingUmStatus] = useState(true);
      const [savingUm, setSavingUm] = useState(false);
      const notify = useNotification();
      const branchId = branch ? branch.ID : 'BR001';

      const loadMyRecords = () => {
        setLoadingRecords(true);
        runGoogleScript('getTodayAttendance', user.username, branchId).then(data => {
          setMyRecords(data || []);
          setLoadingRecords(false);
        }).catch(() => setLoadingRecords(false));
      };

      const loadUmStatus = () => {
        setLoadingUmStatus(true);
        runGoogleScript('getMyUangMakanToday', user.username, branchId).then(data => {
          setUmStatus(data || { alreadyAdded: false });
          setLoadingUmStatus(false);
        }).catch(() => setLoadingUmStatus(false));
      };

      useEffect(() => { loadMyRecords(); loadUmStatus(); }, []);

      const handleAbsen = async (type, shift) => {
        setLoading(true);
        try {
          const res = await runGoogleScript('recordAttendance', user.username, type, branchId, shift);
          if(res.success) {
            notify.alert(`Berhasil melakukan ${type} pada pukul ${res.timestamp}`, "Absensi Berhasil", "success");
            loadMyRecords(); // langsung muncul di riwayat, kasir bisa cek langsung
          } else {
            notify.alert("Gagal mencatat absensi.", "Error", "error");
          }
        } catch(e) {
          notify.alert("Masalah koneksi ke server.", "Koneksi Bermasalah", "error");

        setLoading(false);
      };

      const handlePilihShift = (shift) => {
        setShiftModalOpen(false);
        handleAbsen('Clock In', shift);

      const handleTambahUangMakan = () => {
        notify.confirm("Tambahkan Uang Makan untuk hari ini? Gunakan ini kalau memang sedang bertugas di hari kondisional (misal malam pasar/malam Selasa) dan tidak sempat istirahat.", async () => {
          setSavingUm(true);
          try {
            const todayStr = new Date().toLocaleDateString('id-ID');

            if (res.success) {
              notify.alert("Uang Makan hari ini berhasil dicatat.", "Berhasil", "success");
              loadUmStatus();

              notify.alert("Uang Makan hari ini sudah pernah dicatat sebelumnya.", "Sudah Tercatat", "info");
              loadUmStatus();
            } else {
              notify.alert("Gagal mencatat: " + res.message, "Gagal", "error");

          } catch (e) {
            notify.alert("Masalah koneksi ke server.", "Koneksi Bermasalah", "error");
          }
          setSavingUm(false);
        });

        const map = {
          'Clock In': { label: 'Mulai Shift', icon: 'fa-right-to-bracket', className: 'bg-emerald-100 text-emerald-700' },
          'Break In': { label: 'Mulai Istirahat', icon: 'fa-mug-saucer', className: 'bg-amber-100 text-amber-700' },
          'Break Out': { label: 'Selesai Istirahat', icon: 'fa-arrow-rotate-left', className: 'bg-sky-100 text-sky-700' },
          'Clock Out': { label: 'Selesai Shift', icon: 'fa-right-from-bracket', className: 'bg-rose-100 text-rose-700' }
        };
        const cfg = map[type] || { label: type, icon: 'fa-clock', className: 'bg-gray-100 text-gray-700' };
        return (
          <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${cfg.className}`}>
            <i className={`fa-solid ${cfg.icon} mr-1`}></i>{cfg.label}

          {shiftModalOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden">
                <div className="p-6 text-center border-b">
                  <i className="fa-solid fa-right-to-bracket text-3xl text-emerald-500 mb-2"></i>
                  <h3 className="font-bold text-xl text-gray-800">Pilih Shift Anda</h3>
                  <p className="text-gray-500 text-sm mt-1">Shift hari ini yang akan Anda kerjakan.</p>

                  <button onClick={() => handlePilihShift('SHIFT 1')} disabled={loading} className="w-full bg-slate-50 hover:bg-emerald-50 hover:border-emerald-300 border text-gray-700 font-bold py-3.5 rounded-xl transition-colors text-left px-4">
                    <span className="block">Shift 1</span>
                    <span className="text-xs text-gray-400 font-normal">08:00 - 16:00</span>
                  </button>
                  <button onClick={() => handlePilihShift('SHIFT 2')} disabled={loading} className="w-full bg-slate-50 hover:bg-emerald-50 hover:border-emerald-300 border text-gray-700 font-bold py-3.5 rounded-xl transition-colors text-left px-4">
                    <span className="block">Shift 2</span>
                    <span className="text-xs text-gray-400 font-normal">16:00 - 22:00</span>
                  </button>
                  <button onClick={() => handlePilihShift('SHIFT 1, SHIFT 2')} disabled={loading} className="w-full bg-slate-50 hover:bg-emerald-50 hover:border-emerald-300 border text-gray-700 font-bold py-3.5 rounded-xl transition-colors text-left px-4">
                    <span className="block">Shift 1 & 2</span>
                    <span className="text-xs text-gray-400 font-normal">08:00 - 22:00 (Kerja Penuh)</span>
                  </button>
                  <button onClick={() => setShiftModalOpen(false)} className="w-full text-gray-500 font-bold py-2 text-sm mt-1">Batal</button>

            </div>

          <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-150 text-center max-w-sm w-full relative overflow-hidden flex-shrink-0">
            <div className="absolute top-0 left-0 right-0 h-2 bg-indigo-600"></div>
            <i className="fa-regular fa-clock text-5xl text-indigo-500 mb-4 font-bold"></i>
            <h2 className="text-2xl font-bold text-gray-800 mb-2">Presensi Kehadiran</h2>
            <p className="text-gray-500 mb-8">Pilih tipe presensi Anda saat ini.</p>
            <div className="space-y-4">
              <button onClick={() => setShiftModalOpen(true)} disabled={loading} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-100 transition-colors flex items-center justify-center gap-2"><i className="fa-solid fa-right-to-bracket mr-2"></i>Mulai Shift</button>
              <button onClick={() => handleAbsen('Break In')} disabled={loading} className="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-amber-100 transition-colors flex items-center justify-center gap-2"><i className="fa-solid fa-mug-saucer mr-2"></i>Mulai Istirahat</button>
              <button onClick={() => handleAbsen('Break Out')} disabled={loading} className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-100 transition-colors flex items-center justify-center gap-2"><i className="fa-solid fa-arrow-rotate-left mr-2"></i>Selesai Istirahat</button>
              <button onClick={() => handleAbsen('Clock Out')} disabled={loading} className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-rose-100 transition-colors flex items-center justify-center gap-2"><i className="fa-solid fa-right-from-bracket mr-2"></i>Selesai Shift</button>
            </div>
          </div>

          {/* Uang Makan mandiri — kasir bisa catat sendiri untuk hari kondisional
              (misal malam pasar/malam Selasa) tanpa perlu minta Owner input manual. */}
          <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-150 max-w-sm w-full mt-6 flex-shrink-0">
            <div className="flex items-center gap-3 mb-3">
              <div className="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center flex-shrink-0">
                <i className="fa-solid fa-utensils text-amber-500"></i>
              </div>
              <div>
                <h3 className="font-bold text-gray-800 text-sm">Uang Makan</h3>
                <p className="text-gray-400 text-xs">Untuk hari kondisional</p>
              </div>
            </div>
            {loadingUmStatus ? (
              <p className="text-center text-gray-400 text-sm py-2"><i className="fa-solid fa-spinner fa-spin"></i></p>
            ) : umStatus.alreadyAdded ? (
              <div className="bg-emerald-50 text-emerald-700 rounded-xl py-2.5 text-center text-sm font-bold">
                <i className="fa-solid fa-circle-check mr-1.5"></i>Sudah Tercatat Hari Ini
              </div>
            ) : (
              <button onClick={handleTambahUangMakan} disabled={savingUm} className="w-full bg-amber-500 hover:bg-amber-600 disabled:bg-gray-300 text-white font-bold py-3 rounded-xl transition-colors">
                {savingUm ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Tambah Uang Makan'}
              </button>
            )}
          </div>

          {/* Riwayat absensi HARI INI milik kasir sendiri, supaya bisa langsung cek
              apakah sudah absen atau ketahuan kalau ada yang salah pencet. */}
          <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-150 max-w-sm w-full mt-6 mb-6 flex-shrink-0">
            <div className="flex items-center justify-between mb-4">
              <h3 className="font-bold text-gray-800">Absensi Saya Hari Ini</h3>
              <button onClick={loadMyRecords} disabled={loadingRecords} className="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center" title="Muat ulang">
                <i className={`fa-solid fa-arrow-rotate-right ${loadingRecords ? 'fa-spin' : ''}`}></i>
              </button>
            </div>
            {loadingRecords ? (
              <p className="text-center text-gray-400 text-sm py-4"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Memuat...</p>
            ) : myRecords.length === 0 ? (
              <p className="text-center text-gray-400 text-sm py-4">Belum ada absensi tercatat hari ini.</p>
            ) : (
              <div className="space-y-2">
                {myRecords.map((r, i) => (
                  <div key={i} className="flex items-center justify-between bg-slate-50 rounded-xl px-3 py-2.5">

                    <span className="text-xs text-gray-500 font-semibold">{r.Timestamp}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function ShiftRecapView({ branch, allowBranchFilter, settings, readOnly }) {
      const [subTab, setSubTab] = useState('absensi');
      const [records, setRecords] = useState([]);
      const [employees, setEmployees] = useState([]);
      const [branchList, setBranchList] = useState([]);
      const [loading, setLoading] = useState(true);
      const [month, setMonth] = useState(() => new Date().toISOString().substring(0, 7));
      const [filterUsername, setFilterUsername] = useState('ALL');
      const [viewBranchId, setViewBranchId] = useState(allowBranchFilter ? 'ALL' : (branch ? branch.ID : 'BR001'));
      const notify = useNotification();

      // --- Rekap Gaji ---
      const [payroll, setPayroll] = useState({ defaultRates: { Shift_1_Rate: 0, Shift_2_Rate: 0, Double_Shift_Rate: 0, Uang_Makan_Rate: 0 }, employees: [] });
      const [loadingPayroll, setLoadingPayroll] = useState(true);
      const [allRates, setAllRates] = useState([]); // DEFAULT + tarif khusus tiap pegawai
      const [rateManagerOpen, setRateManagerOpen] = useState(false);
      const [editingRateUsername, setEditingRateUsername] = useState(null); // null = tidak sedang edit
      const [rateForm, setRateForm] = useState({ Shift_1_Rate: '', Shift_2_Rate: '', Double_Shift_Rate: '', Uang_Makan_Rate: '' });
      const [savingRates, setSavingRates] = useState(false);
      const [umModalOpen, setUmModalOpen] = useState(false);
      const [umUsername, setUmUsername] = useState('');
      const [umDate, setUmDate] = useState('');
      const [savingUm, setSavingUm] = useState(false);
      const [umList, setUmList] = useState([]); // daftar entri Uang Makan bulan ini, buat ditampilkan & dihapus
      const [loadingUmList, setLoadingUmList] = useState(false);
      const [expandedUmUsername, setExpandedUmUsername] = useState(null); // pegawai yang daftar Uang Makan-nya sedang dibuka langsung di tabel

      useEffect(() => {
        if (allowBranchFilter) {
          runGoogleScript('getBranches').then(data => setBranchList(data || [])).catch(() => {});
        }
        cachedFetch('employees', () => runGoogleScript('getEmployees')).then(data => setEmployees(data || [])).catch(() => {});
      }, []);

      const loadRecap = () => {
        setLoading(true);
        const [yearStr, monthStr] = month.split('-');
        const branchParam = viewBranchId === 'ALL' ? undefined : viewBranchId;
        runGoogleScript('getShiftRecap', branchParam, Number(monthStr), Number(yearStr)).then(data => {
          setRecords(data || []);
          setLoading(false);
        }).catch(() => setLoading(false));
      };

      const loadPayroll = () => {
        setLoadingPayroll(true);
        const [yearStr, monthStr] = month.split('-');
        const branchParam = viewBranchId === 'ALL' ? undefined : viewBranchId;
        runGoogleScript('getPayrollSummary', branchParam, Number(monthStr), Number(yearStr)).then(data => {
          setPayroll(data || { defaultRates: {}, employees: [] });
          setLoadingPayroll(false);
        }).catch(() => setLoadingPayroll(false));
      };

      const loadAllRates = () => {
        runGoogleScript('getAllPayrollRates').then(data => setAllRates(data || [])).catch(() => {});
      };

      const loadUmList = () => {
        setLoadingUmList(true);
        const [yearStr, monthStr] = month.split('-');
        const branchParam = branch ? branch.ID : 'BR001';
        runGoogleScript('getUangMakanForMonth', branchParam, Number(monthStr), Number(yearStr)).then(data => {
          setUmList(data || []);
          setLoadingUmList(false);
        }).catch(() => setLoadingUmList(false));
      };

      // umList sekarang selalu dimuat bareng payroll, supaya langsung siap dipakai
      // begitu kolom Uang Makan di tabel Rekap Gaji diklik (tanpa perlu buka modal dulu).
      useEffect(() => { loadRecap(); loadPayroll(); loadUmList(); }, [month, viewBranchId]);

      const getName = (username) => { if (username === 'DEFAULT') return 'Tarif Default (Semua Pegawai Lain)'; const e = employees.find(x => x.Username === username); return e ? e.Name : username; };

      const displayed = filterUsername === 'ALL' ? records : records.filter(r => r.Username === filterUsername);
      const displayedPayroll = filterUsername === 'ALL' ? payroll.employees : payroll.employees.filter(e => e.Username === filterUsername);

      // Ringkasan per pegawai: total Shift 1 / Shift 2 / gabungan, mirip pola hitung
      // manual COUNTIFS yang biasa dipakai Owner untuk rekap gaji.
      const summaryByUser = {};
      displayed.forEach(r => {
        if (!summaryByUser[r.Username]) summaryByUser[r.Username] = { shift1: 0, shift2: 0, double: 0, terlambat: 0 };
        if (r.Keterangan === 'SHIFT 1, SHIFT 2') summaryByUser[r.Username].double++;
        else if (r.Keterangan === 'SHIFT 1') summaryByUser[r.Username].shift1++;
        else summaryByUser[r.Username].shift2++;
        if (r.StatusMasuk.indexOf('Terlambat') === 0) summaryByUser[r.Username].terlambat++;
      });

      const statusClass = (status) => {
        if (status === 'Tepat Waktu') return 'text-emerald-600';
        if (status === 'Belum Clock Out') return 'text-gray-400';
        return 'text-rose-600 font-bold';
      };

      const openRateManager = () => {
        loadAllRates();
        setEditingRateUsername(null);
        setRateManagerOpen(true);
      };

      const startEditRate = (username) => {
        const existing = allRates.find(r => r.Username === username);
        const fallback = allRates.find(r => r.Username === 'DEFAULT') || { Shift_1_Rate: 55000, Shift_2_Rate: 55000, Double_Shift_Rate: 110000, Uang_Makan_Rate: 25000 };
        const base = existing || fallback;
        setRateForm({
          Shift_1_Rate: base.Shift_1_Rate,
          Shift_2_Rate: base.Shift_2_Rate,
          Double_Shift_Rate: base.Double_Shift_Rate,
          Uang_Makan_Rate: base.Uang_Makan_Rate
        });
        setEditingRateUsername(username);
      };

      const handleSaveRates = async () => {
        setSavingRates(true);
        try {
          const res = await runGoogleScript('savePayrollRatesFor', editingRateUsername, rateForm);
          if (res.success) {
            notify.alert("Tarif berhasil disimpan.", "Berhasil", "success");
            setEditingRateUsername(null);
            loadAllRates();
            loadPayroll();
          } else {
            notify.alert("Gagal menyimpan: " + res.message, "Gagal", "error");
          }
        } catch (e) {
          notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
        }
        setSavingRates(false);
      };

      const handleResetRate = (username) => {
        notify.confirm(`Kembalikan "${getName(username)}" ke tarif Default? Tarif khususnya akan dihapus.`, async () => {
          const res = await runGoogleScript('deletePayrollRatesFor', username);
          if (res.success) {
            notify.alert("Berhasil dikembalikan ke tarif Default.", "Berhasil", "success");
            loadAllRates();
            loadPayroll();
          } else {
            notify.alert("Gagal: " + res.message, "Gagal", "error");
          }
        });
      };

      const openUmModal = () => {
        setUmUsername(employees.filter(e => e.Role !== 'Owner')[0] ? employees.filter(e => e.Role !== 'Owner')[0].Username : '');
        setUmDate(new Date().toISOString().substring(0, 10));
        setUmModalOpen(true);
        loadUmList();
      };

      const handleSaveUm = async () => {
        if (!umUsername || !umDate) {
          notify.alert("Pilih pegawai dan tanggal terlebih dahulu.", "Data Belum Lengkap", "error");
          return;
        }
        setSavingUm(true);
        try {
          const [y, m, d] = umDate.split('-');
          const dateStr = `${Number(d)}/${Number(m)}/${y}`; // samakan format dengan data absensi
          const branchParam = branch ? branch.ID : 'BR001';
          const res = await runGoogleScript('addUangMakan', umUsername, dateStr, branchParam);
          if (res.success) {
            notify.alert("Uang Makan berhasil ditambahkan.", "Berhasil", "success");
            loadUmList();
            loadPayroll();
          } else {
            notify.alert("Gagal menambahkan: " + res.message, "Gagal", "error");
          }
        } catch (e) {
          notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
        }
        setSavingUm(false);
      };

      const handleDeleteUm = (entry) => {
        notify.confirm(`Hapus Uang Makan "${getName(entry.Username)}" pada ${entry.Date}?`, async () => {
          const res = await runGoogleScript('deleteUangMakan', entry.ID);
          if (res.success) {
            notify.alert("Berhasil dihapus.", "Terhapus", "success");
            loadUmList();
            loadPayroll();
          } else {
            notify.alert("Gagal menghapus: " + res.message, "Gagal", "error");
          }
        });
