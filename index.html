          {/* MODAL SUKSES: kartu info pembayaran + pilihan Cetak Struk / Kirim Struk /
              Cetak Pesanan / Transaksi Baru. Dipisah dari proses simpan supaya kasir
              tidak perlu menunggu printer Bluetooth merespons dulu sebelum bisa lanjut
              ke pembeli berikutnya — kasir bebas pilih mau cetak sekarang, kirim struk
              digital, atau langsung transaksi baru saja. */}
          {successModalOpen && lastTrx && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xs overflow-hidden">
                <div className="p-6 text-center border-b">
                  <div className="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i className="fa-solid fa-circle-check text-3xl text-emerald-500"></i>
                  </div>
                  <h3 className="font-bold text-xl text-gray-800">Pembayaran Sukses</h3>
                  <p className="text-gray-500 text-sm mt-1">Transaksi berhasil disimpan!</p>
                  {lastTrx.offlineQueued && (
                    <div className="mt-2 inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 text-[11px] font-bold px-3 py-1 rounded-full">
                      <i className="fa-solid fa-clock-rotate-left"></i>
                      Tersimpan offline — akan otomatis sinkron begitu online
                    </div>
                  )}
                </div>

                <div className="p-5">
                  <div className="grid grid-cols-2 gap-2.5 mb-4">
                    <div className="border rounded-xl p-3">
                      <p className="text-[11px] text-gray-400 font-semibold">Pembayaran</p>
                      <p className="font-bold text-gray-800 text-sm mt-0.5">{lastTrx.paymentMethod}</p>
                    </div>
                    <div className="border rounded-xl p-3">
                      <p className="text-[11px] text-gray-400 font-semibold">Total Tagihan</p>
                      <p className="font-bold text-gray-800 text-sm mt-0.5">Rp{Number(lastTrx.total).toLocaleString('id-ID')}</p>
                    </div>
                    <div className="border rounded-xl p-3">
                      <p className="text-[11px] text-gray-400 font-semibold">Diterima</p>
                      <p className="font-bold text-gray-800 text-sm mt-0.5">Rp{Number(lastTrx.cashReceived).toLocaleString('id-ID')}</p>
                    </div>
                    <div className="border rounded-xl p-3">
                      <p className="text-[11px] text-gray-400 font-semibold">Kembalian</p>
                      <p className="font-bold text-gray-800 text-sm mt-0.5">Rp{Number(lastTrx.change).toLocaleString('id-ID')}</p>
                    </div>
                  </div>

                  <PrintMethodRow settings={settings} />
                  <div className="grid grid-cols-3 gap-2 mb-3">
                    <button onClick={() => printReceipt(lastTrx, settings)} className="bg-slate-50 hover:bg-slate-100 border text-gray-700 font-bold py-3 rounded-xl transition-colors text-xs">
                      Cetak Struk
                    </button>
                    <button onClick={() => handleSendReceipt(lastTrx)} className="bg-slate-50 hover:bg-slate-100 border text-gray-700 font-bold py-3 rounded-xl transition-colors text-xs">
                      Kirim Struk
                    </button>
                    <button onClick={() => printOrderTicket(lastTrx, settings)} className="bg-slate-50 hover:bg-slate-100 border text-gray-700 font-bold py-3 rounded-xl transition-colors text-xs">
                      Cetak Pesanan
                    </button>
                  </div>

                  <button
                    onClick={() => { setSuccessModalOpen(false); setLastTrx(null); }}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition-colors"
                  >
                    Transaksi Baru
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    // Daftarkan Service Worker -- HANYA kalau file ini dibuka dari LUAR Google
    // Apps Script (misal GitHub Pages). Kalau masih dijalankan dari dalam GAS
    // seperti biasa, lewati saja -- sw.js tidak ada di situ dan memang tidak perlu.
    if (typeof google === 'undefined' && 'serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('Gagal mendaftarkan Service Worker:', err);
        });
        // Setiap kali aplikasi dibuka, minta service worker melengkapi file offline
        // yang mungkin belum tersimpan (misal saat pemasangan internetnya putus-putus).
        navigator.serviceWorker.ready.then(function (reg) {
          if (reg.active) reg.active.postMessage('ensure');
        }).catch(function () {});
      });
    }

    // Kalau setelah beberapa detik aplikasi belum tampil (misal pustaka belum pernah
    // tersimpan dan tidak ada internet), tampilkan penjelasan, bukan layar putih kosong.
    setTimeout(function () {
      var boot = document.getElementById('boot-msg');
      if (!boot) return;
      boot.innerHTML = '<p style="font-weight:bold;font-size:18px;margin:0 0 8px">Aplikasi belum bisa dimuat</p>' +
        '<p style="margin:0 0 16px">Jika tidak ada internet, buka aplikasi sekali saat online agar tersimpan untuk mode offline, lalu coba lagi.</p>' +
        '<button onclick="location.reload()" style="background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-weight:bold;font-size:14px">Muat Ulang</button>';
    }, 10000);
  </script>
</body>
</html>
