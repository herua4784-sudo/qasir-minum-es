    // Sesi login disimpan ke localStorage browser supaya kalau halaman di-refresh
    // (atau device restart), kasir/owner tidak perlu login ulang dari nol.
    // Otomatis kadaluarsa setelah 12 jam demi keamanan (misal device dipakai bergantian shift).
    const SESSION_KEY = 'qasir_minumes_session';
    const SESSION_MAX_AGE_MS = 12 * 60 * 60 * 1000; // 12 jam

    const saveSession = (user, branch) => {
      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ user, branch, savedAt: Date.now() }));
      } catch (e) { /* localStorage tidak tersedia, abaikan saja */ }
    };

    const loadSession = () => {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.user || (Date.now() - parsed.savedAt) > SESSION_MAX_AGE_MS) {
          localStorage.removeItem(SESSION_KEY);
          return null;
        }
        return parsed;
      } catch (e) {
        return null;
      }
    };

    const clearSession = () => {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* abaikan */ }
    };

    // Preferensi sidebar disembunyikan/ditampilkan, dipakai bersama di semua
    // aplikasi (Kasir, Administrator, Owner) dan tersimpan di browser supaya
    // pilihannya tetap diingat walau halaman di-refresh.
    const SIDEBAR_PREF_KEY = 'qasir_minumes_sidebar_collapsed';
    const loadSidebarPref = () => {
      try { return localStorage.getItem(SIDEBAR_PREF_KEY) === '1'; } catch (e) { return false; }
    };
    const saveSidebarPref = (collapsed) => {
      try { localStorage.setItem(SIDEBAR_PREF_KEY, collapsed ? '1' : '0'); } catch (e) { /* abaikan */ }
    };

    // Tombol kecil di tepi sidebar untuk sembunyikan/tampilkan (khusus tampilan
    // desktop — di HP tetap pakai menu hamburger seperti biasa).
    function SidebarToggleButton({ collapsed, onClick }) {
      return (
        <button
          onClick={onClick}
          className="hidden lg:flex absolute z-50 top-1/2 -translate-y-1/2 w-6 h-12 bg-white border rounded-r-lg items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-50 transition-all shadow-sm"
          style={{ left: collapsed ? '0px' : '256px' }}
          title={collapsed ? 'Tampilkan menu' : 'Sembunyikan menu'}
        >
          <i className={`fa-solid fa-chevron-${collapsed ? 'right' : 'left'} text-xs`}></i>
        </button>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [branch, setBranch] = useState(null);
      const [checkingSession, setCheckingSession] = useState(true);
      const [alertConfig, setAlertConfig] = useState({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null });
      const [settings, setSettings] = useState({ 
        QRIS_Image_URL: '', 
        QRIS_Type: 'Mockup', 
        STORE_NAME: '', 
        STORE_SLOGAN: '', 
        STORE_ADDRESS: '', 
        STORE_LOGO_URL: '', 
        STORE_FOOTER: '', 
        PAPER_SIZE: '58mm',
        RECEIPT_FONT_SIZE: '10',
        RECEIPT_LOGO_SIZE: '60',
        RECEIPT_LINE_HEIGHT: 'normal'
      });

      // Mulai ambil data menu (produk & kategori) sedini mungkin, supaya begitu
      // kasir buka tab Transaksi datanya kemungkinan besar sudah siap (tidak perlu
      // menunggu lagi). Dipanggil begitu ada sesi aktif (baik dari login baru
      // maupun sesi tersimpan yang dipulihkan).
      // Diisi begitu login berhasil (atau sesi lama ditemukan) — SEMUA data penting
      // yang dipakai lintas menu langsung disimpan ke cache offline sejak awal,
      // supaya kasir tidak perlu "kebetulan pernah buka menu itu saat online" dulu
      // baru datanya tersedia kalau nanti internet putus.
      const preloadMenuData = (branchId, role) => {
        const bId = branchId || 'BR001';
        cachedFetch('products_' + bId, () => runGoogleScript('getProducts', bId)).catch(() => {});
        cachedFetch('categories', () => runGoogleScript('getCategories')).catch(() => {});
        runGoogleScript('getIngredients', bId).catch(() => {});
        runGoogleScript('getBranches').catch(() => {});
        // Kasir: riwayat stok bawaan (tampilan awal tab Riwayat Masuk/Keluar) ikut
        // disimpan supaya bisa dibuka saat offline.
        if (role !== 'Owner' && role !== 'Administrator' && role !== 'Rekan Bisnis') {
          runGoogleScript('getRecentStockMovements', bId, 300, 'Semua', true).catch(() => {});
        }
      };

      // Begitu aplikasi dibuka/di-refresh, cek dulu apakah ada sesi login tersimpan
      useEffect(() => {
        const session = loadSession();
        if (session) {
          if (session.user && session.user.token) setAuthToken(session.user.token);
          setUser(session.user);
          setBranch(session.branch);
          preloadMenuData(session.branch ? session.branch.ID : 'BR001', session.user && session.user.role);
        }
        setCheckingSession(false);
      }, []);

      const handleLoginSuccess = (u, b) => {
        if (u && u.token) setAuthToken(u.token);
        setUser(u);
        setBranch(b);
        saveSession(u, b);
        preloadMenuData(b ? b.ID : 'BR001', u && u.role);
      };

      const handleChangeBranch = (b) => {
        setBranch(b);
        saveSession(user, b);
      };

      const handleLogout = () => {
        setUser(null);
        setBranch(null);
        clearSession();
      };

      // Peringatan browser sebelum refresh/tutup tab, SELALU aktif selama sudah
      // login (tidak perlu ada isi keranjang) — karena memuat ulang halaman ini
      // butuh waktu, jadi lebih baik kasir/owner dikasih kesempatan untuk batal
      // dulu sebelum kejadian, bukan cuma saat ada transaksi berjalan.
      useEffect(() => {
        if (!user) return;
        const handleBeforeUnload = (e) => {
          // Saat membuka RawBT untuk mencetak, browser mengira halaman akan ditinggalkan.
          // Jangan munculkan "Keluar dari situs?" untuk kasus itu.
          if (window.__skipUnloadWarn) return;
          e.preventDefault();
          e.returnValue = '';
        };
        window.addEventListener('beforeunload', handleBeforeUnload);
        return () => window.removeEventListener('beforeunload', handleBeforeUnload);
      }, [user]);

      const loadSettings = () => {
        runGoogleScript('getSettings')
          .then(s => {
            if (s.STORE_LOGO_URL) {
              const formattedUrl = formatImageUrl(s.STORE_LOGO_URL);
              // Logo struk ditanam sebagai Base64 dan disalin ke penyimpanan tablet, supaya
              // struk tetap bisa berlogo walau saat itu offline.
              const logoKey = 'logo:' + formattedUrl;
              const useCachedLogo = () => offlineCacheGet(logoKey).then(d => setSettings(d ? { ...s, STORE_LOGO_URL: d } : s)).catch(() => setSettings(s));
              runGoogleScript('getImageAsBase64', formattedUrl)
                .then(res => {
                  if (res && res.success) {
                    offlineCacheSet(logoKey, res.dataUri);
                    setSettings({ ...s, STORE_LOGO_URL: res.dataUri });
                  } else {
                    console.warn("Gagal menanam logo untuk struk:", res && res.message);
                    useCachedLogo();
                  }
                })
                .catch(err => { console.warn("Gagal menanam logo untuk struk:", err); useCachedLogo(); });
            } else {
              setSettings(s);
            }
          })
          .catch(err => console.error("Gagal memuat pengaturan toko:", err));
      };

      useEffect(() => {
        if (user) {
          loadSettings();
        }
      }, [user]);

      // Siapkan logo untuk cetak RawBT begitu pengaturan (dengan logo tertanam) siap.
      useEffect(() => { prepareLogoRaster(settings); }, [settings]);

      const triggerAlert = (message, title = "Informasi", type = "info") => {
        setAlertConfig({ isOpen: true, title, message, type, onConfirm: null });
      };

      const triggerConfirm = (message, onConfirm, title = "Apakah Anda Yakin?") => {
        setAlertConfig({ isOpen: true, title, message, type: 'confirm', onConfirm });
      };

      const closeAlert = () => {
        setAlertConfig(prev => ({ ...prev, isOpen: false }));
      };

      // Server menolak token sesi (kedaluwarsa / password diganti / akun dihapus): minta
      // login ulang. Data antrian offline tetap aman dan terkirim setelah login ulang.
      const userForAuthRef = useRef(null);
      userForAuthRef.current = user;
      useEffect(() => {
        const onAuthExpired = () => {
          if (!userForAuthRef.current) return;
          setUser(null);
          setBranch(null);
          clearSession();
          triggerAlert('Sesi login Anda sudah berakhir atau password diganti. Silakan login ulang (data yang menunggu sinkron tetap aman).', 'Login Ulang', 'info');
        };
        window.addEventListener('qasir-auth-expired', onAuthExpired);
        return () => window.removeEventListener('qasir-auth-expired', onAuthExpired);
      }, []);

      const notificationAPI = {
        alert: triggerAlert,
        confirm: triggerConfirm
      };

      // Selagi masih mengecek sesi tersimpan, tampilkan layar kosong sebentar
      // supaya tidak "kedip" ke layar login lalu langsung pindah ke dashboard.
      if (checkingSession) {
        return <div className="min-h-screen bg-slate-100"></div>;
      }

      if (!user) {
        return (
          <NotificationContext.Provider value={notificationAPI}>
            <TopStatusBar />
            <LoginScreen onLogin={handleLoginSuccess} />
            <CustomNotificationModal config={alertConfig} onClose={closeAlert} />
          </NotificationContext.Provider>
        );
      }

      return (
        <NotificationContext.Provider value={notificationAPI}>
          <TopStatusBar />
          <div className="min-h-screen">
            {user.role === 'Owner' ? (
              <OwnerDashboard user={user} branch={branch} onChangeBranch={handleChangeBranch} onLogout={handleLogout} settings={settings} onRefreshSettings={loadSettings} />
            ) : (user.role === 'Administrator' || user.role === 'Rekan Bisnis') ? (
              <AdministratorDashboard user={user} branch={branch} onLogout={handleLogout} settings={settings} />
            ) : (
              <AdminDashboard user={user} branch={branch} onLogout={handleLogout} settings={settings} />
            )}
            <CustomNotificationModal config={alertConfig} onClose={closeAlert} />
          </div>
        </NotificationContext.Provider>
      );
    }

    // Pita kecil di paling atas layar, muncul otomatis begitu HP kehilangan koneksi
    // internet -- supaya kasir sadar sedang lihat data tersimpan (bisa jadi tidak
    // 100% terbaru), bukan data langsung dari server.
    // Satu pita status di paling atas layar: teks "Offline" (kalau tidak ada jaringan)
    // dan pil "N menunggu sinkron" (kalau ada antrean) DI DALAM pita yang sama. Pita ini
    // MENDORONG isi aplikasi ke bawah (tidak menimpa), jadi tidak menutupi tombol apa pun.
    function TopStatusBar() {
      const [isOffline, setIsOffline] = useState(!navigator.onLine);
      const [items, setItems] = useState([]);
      const [syncing, setSyncing] = useState(false);
      const [expanded, setExpanded] = useState(false);

      const refresh = () => {
        queueGetAllWrites().then(list => setItems(list || [])).catch(() => {});
      };

      useEffect(() => {
        const goOffline = () => setIsOffline(true);
        const goOnline = () => { setIsOffline(false); refresh(); };
        window.addEventListener('offline', goOffline);
        window.addEventListener('online', goOnline);
        refresh();
        const interval = setInterval(refresh, 4000);
        return () => {
          clearInterval(interval);
          window.removeEventListener('offline', goOffline);
          window.removeEventListener('online', goOnline);
        };
      }, []);

      const visible = isOffline || items.length > 0;
      useEffect(() => {
        document.documentElement.classList.toggle('has-status-bar', visible);
        return () => document.documentElement.classList.remove('has-status-bar');
      }, [visible]);

      if (!visible) return null;

      const failedItems = items.filter(i => i.failed);
      const pendingCount = items.length - failedItems.length;
      const errorText = (failedItems[0] && failedItems[0].lastError) || window.__lastSyncError || '';

      const handleSyncNow = async () => {
        setSyncing(true);
        const list = await queueGetAllWrites();
        for (const it of list) {
          if (it.failed) { it.failed = false; it.attempts = 0; await queueUpdateWrite(it); }
        }
        await trySyncOfflineQueue();
        refresh();
        setSyncing(false);
      };

      return (
        <React.Fragment>
          <div id="top-status-bar" style={{ position: 'fixed', top: 0, left: 0, right: 0, height: '34px', zIndex: 9999 }}
            className={'flex items-center justify-center gap-3 text-white text-xs font-bold px-3 shadow-md ' + (isOffline ? 'bg-amber-500' : 'bg-slate-800')}>
            {isOffline && (
              <span className="truncate"><i className="fa-solid fa-wifi-slash mr-1.5"></i>Offline — menampilkan data tersimpan terakhir</span>
            )}
            {items.length > 0 && (
              <button type="button" onClick={() => setExpanded(v => !v)}
                className={'flex-shrink-0 text-white rounded-full px-3 py-1 text-xs font-bold flex items-center gap-2 ' + (failedItems.length > 0 ? 'bg-red-600' : 'bg-slate-800')}>
                <i className="fa-solid fa-clock-rotate-left text-amber-400"></i>
                <span>{pendingCount > 0 ? pendingCount + ' menunggu sinkron' : ''}{pendingCount > 0 && failedItems.length > 0 ? ' · ' : ''}{failedItems.length > 0 ? failedItems.length + ' gagal' : ''}</span>
              </button>
            )}
          </div>
          {expanded && items.length > 0 && (
            <div style={{ position: 'fixed', top: '40px', left: '50%', transform: 'translateX(-50%)', zIndex: 9999 }} className="w-80 max-w-full bg-slate-800 text-white rounded-xl shadow-lg px-4 py-3 text-sm">
              <div className="text-right mb-1">
                <button type="button" onClick={() => setExpanded(false)} className="text-xs text-slate-300 px-2 py-0.5">Tutup <i className="fa-solid fa-xmark"></i></button>
              </div>
              <div className="flex items-center gap-3">
                <i className="fa-solid fa-clock-rotate-left text-amber-400"></i>
                <span className="font-semibold">
                  {pendingCount > 0 ? pendingCount + ' data menunggu sinkron' : ''}
                  {pendingCount > 0 && failedItems.length > 0 ? ' · ' : ''}
                  {failedItems.length > 0 ? failedItems.length + ' gagal, perlu dicek' : ''}
                </span>
                <button onClick={handleSyncNow} disabled={syncing} className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-500 text-white px-3 py-1 rounded-lg text-xs font-bold transition-colors flex-shrink-0">
                  {syncing ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Sinkron Sekarang'}
                </button>
              </div>
              {errorText && (
                <p className="text-[11px] text-red-300 mt-2 break-words">Terakhir: {errorText}</p>
              )}
            </div>
          )}
        </React.Fragment>
      );
    }

    function OfflineIndicator() {
      const [isOffline, setIsOffline] = useState(!navigator.onLine);

      useEffect(() => {
        const goOffline = () => setIsOffline(true);
        const goOnline = () => setIsOffline(false);
        window.addEventListener('offline', goOffline);
        window.addEventListener('online', goOnline);
        return () => {
          window.removeEventListener('offline', goOffline);
          window.removeEventListener('online', goOnline);
        };
      }, []);

      if (!isOffline) return null;

      return (
        <div className="fixed top-0 left-0 right-0 z-[9999] bg-amber-500 text-white text-xs font-bold text-center py-1.5 shadow-md">
          <i className="fa-solid fa-wifi-slash mr-1.5"></i>
          Offline — menampilkan data tersimpan terakhir, mungkin tidak 100% terbaru
        </div>
      );
    }

    // Pita kecil menunjukkan berapa transaksi/absensi yang masih menunggu dikirim
    // ke server (dibuat saat offline). Dipantau berkala (bukan real-time sempurna,
    // tapi cukup untuk memberi rasa aman ke kasir/Owner bahwa datanya "aman menunggu",
    // bukan hilang). Otomatis hilang begitu semuanya berhasil terkirim.
    function PendingSyncBadge() {
      const [items, setItems] = useState([]);
      const [syncing, setSyncing] = useState(false);
      const [expanded, setExpanded] = useState(false); // default: pil kecil, supaya tidak menutupi tombol Simpan/Bayar

      const refresh = () => {
        queueGetAllWrites().then(list => setItems(list || [])).catch(() => {});
      };

      useEffect(() => {
        refresh();
        const interval = setInterval(refresh, 4000);
        window.addEventListener('online', refresh);
        return () => {
          clearInterval(interval);
          window.removeEventListener('online', refresh);
        };
      }, []);

      if (items.length === 0) return null;

      const failedItems = items.filter(i => i.failed);
      const pendingCount = items.length - failedItems.length;
      const errorText = (failedItems[0] && failedItems[0].lastError) || window.__lastSyncError || '';

      const handleSyncNow = async () => {
        setSyncing(true);
        // Beri kesempatan baru untuk item yang sebelumnya ditandai gagal.
        const list = await queueGetAllWrites();
        for (const it of list) {
          if (it.failed) { it.failed = false; it.attempts = 0; await queueUpdateWrite(it); }
        }
        await trySyncOfflineQueue();
        refresh();
        setSyncing(false);
      };

      // Letaknya di tengah atas (di bawah pita Offline), BUKAN pojok kanan bawah yang
      // menutupi tombol Bayar. Ketuk pil untuk membuka detail & tombol Sinkron.
      const pos = { position: 'fixed', top: '34px', left: '50%', transform: 'translateX(-50%)' };

      if (!expanded) {
        return (
          <button type="button" onClick={() => setExpanded(true)} style={pos}
            className={'z-[9999] text-white rounded-full shadow-lg px-3 py-1.5 text-xs font-bold flex items-center gap-2 ' + (failedItems.length > 0 ? 'bg-red-600' : 'bg-slate-800')}>
            <i className="fa-solid fa-clock-rotate-left text-amber-400"></i>
            <span>{pendingCount > 0 ? pendingCount + ' menunggu sinkron' : ''}{pendingCount > 0 && failedItems.length > 0 ? ' · ' : ''}{failedItems.length > 0 ? failedItems.length + ' gagal' : ''}</span>
          </button>
        );
      }

      return (
        <div style={pos} className="z-[9999] w-80 max-w-full bg-slate-800 text-white rounded-xl shadow-lg px-4 py-3 text-sm">
          <div className="text-right mb-1">
            <button type="button" onClick={() => setExpanded(false)} className="text-xs text-slate-300 px-2 py-0.5">Tutup <i className="fa-solid fa-xmark"></i></button>
          </div>
          <div className="flex items-center gap-3">
            <i className="fa-solid fa-clock-rotate-left text-amber-400"></i>
            <span className="font-semibold">
              {pendingCount > 0 ? pendingCount + ' data menunggu sinkron' : ''}
              {pendingCount > 0 && failedItems.length > 0 ? ' · ' : ''}
              {failedItems.length > 0 ? failedItems.length + ' gagal, perlu dicek' : ''}
            </span>
            <button onClick={handleSyncNow} disabled={syncing} className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-500 text-white px-3 py-1 rounded-lg text-xs font-bold transition-colors flex-shrink-0">
              {syncing ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Sinkron Sekarang'}
            </button>
          </div>
          {errorText && (
            <p className="text-[11px] text-red-300 mt-2 break-words">Terakhir: {errorText}</p>
          )}
        </div>
      );
    }

    // ==========================================
    // LOGIN OFFLINE: tablet menyimpan "sidik jari" password (PBKDF2 + salt acak, BUKAN
    // password aslinya) di penyimpanan lokal. Kalau internet mati, password yang diketik
    // dicocokkan ke sidik jari itu. Sidik jari bisa berasal dari dua jalur:
    //  (1) pegawai login SAAT ONLINE di tablet ini (skema 'plain'), atau
    //  (2) Owner menekan "Siapkan Login Offline" (skema 'sha256'): server mengirim hash
    //      password pegawai outlet, tablet langsung membungkusnya dengan PBKDF2 lalu
    //      membuang hash aslinya. Dengan jalur ini pegawai bisa login offline walau
    //      belum pernah login di tablet ini.
    // Pengaman: kedaluwarsa 30 hari sejak disimpan; dicabut otomatis kalau server
    // menyatakan akun/password tidak valid; dikunci 60 detik setelah 5x salah; penyiapan
    // ulang oleh Owner menghapus akun pegawai yang sudah tidak ada di server.
    // ==========================================
    const OFFLINE_LOGIN_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;
    const OFFLINE_LOGIN_ITERATIONS = 150000;
    const OFFLINE_LOGIN_MAX_FAILS = 5;
    const OFFLINE_LOGIN_LOCK_MS = 60 * 1000;
    const OFFLINE_LOGIN_FAIL_KEY = 'qasir_offline_login_fail';
    const OFFLINE_AUTH_INDEX_KEY = 'auth-index'; // daftar username yang punya catatan login offline

    function offlineLoginAvailable() {
      return typeof crypto !== 'undefined' && !!crypto.subtle && typeof TextEncoder !== 'undefined';
    }

    function bytesToBase64(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }

    function base64ToBytes(str) {
      const bin = atob(str);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    // Server membandingkan password setelah di-trim; tablet harus memperlakukannya sama.
    function normalizePassword(password) {
      return String(password == null ? '' : password).trim();
    }

    // SHA-256 heksadesimal huruf kecil dari teks UTF-8: SAMA PERSIS dengan hashPassword di Kode.gs.
    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function derivePasswordHash(secret, saltBytes, iterations) {
      const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: saltBytes, iterations: iterations, hash: 'SHA-256' }, keyMaterial, 256);
      return new Uint8Array(bits);
    }

    async function offlineAuthIndexGet() {
      const idx = await offlineCacheGet(OFFLINE_AUTH_INDEX_KEY);
      return Array.isArray(idx) ? idx : [];
    }
    async function offlineAuthIndexAdd(username) {
      const idx = await offlineAuthIndexGet();
      if (idx.indexOf(username) === -1) { idx.push(username); await offlineCacheSet(OFFLINE_AUTH_INDEX_KEY, idx); }
    }
    async function offlineAuthIndexRemove(username) {
      const idx = await offlineAuthIndexGet();
      const next = idx.filter(u => u !== username);
      if (next.length !== idx.length) await offlineCacheSet(OFFLINE_AUTH_INDEX_KEY, next);
    }

    // secret = teks yang di-PBKDF2: password yang diketik (skema 'plain') atau hash SHA-256
    // password dari server (skema 'sha256').
    async function writeOfflineAuthRecord(username, secret, user, scheme) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const hash = await derivePasswordHash(secret, salt, OFFLINE_LOGIN_ITERATIONS);
      await offlineCacheSet('auth:' + username, {
        salt: bytesToBase64(salt), hash: bytesToBase64(hash),
        iterations: OFFLINE_LOGIN_ITERATIONS, user: user, savedAt: Date.now(), scheme: scheme
      });
      await offlineAuthIndexAdd(username);
    }

    // Jalur (1): dipanggil setelah login online berhasil.
    async function saveOfflineLogin(username, password, user) {
      if (!offlineLoginAvailable()) return;
      try {
        await writeOfflineAuthRecord(username, normalizePassword(password), user, 'plain');
      } catch (e) { /* gagal menyimpan bukan masalah fatal: login offline saja yang tidak tersedia */ }
    }

    async function clearOfflineLogin(username) {
      await offlineCacheSet('auth:' + username, null);
      await offlineAuthIndexRemove(username);
    }

    // Jalur (2): dipanggil setelah server menjawab permintaan Owner.
    // accounts = [{ username, name, role, branchId, passwordHash }]
    // Hasil: { added, removed, names }. Akun pegawai di outlet ini yang tersimpan di
    // tablet tapi sudah tidak ada di daftar server ikut dihapus (misal pegawai berhenti).
    async function provisionOfflineLogin(accounts, branchId) {
      if (!offlineLoginAvailable()) throw new Error('Browser ini tidak mendukung login offline.');
      const keep = {};
      const names = [];
      for (const acc of accounts) {
        const key = String(acc.username).trim().toLowerCase();
        const serverHash = String(acc.passwordHash || '').trim().toLowerCase();
        if (!key || !/^[0-9a-f]{64}$/.test(serverHash)) continue;
        await writeOfflineAuthRecord(key, serverHash, { username: acc.username, role: acc.role, name: acc.name, branchId: acc.branchId || '', token: acc.token || undefined }, 'sha256');
        keep[key] = true;
        names.push(acc.name || acc.username);
      }
      let removed = 0;
      for (const key of await offlineAuthIndexGet()) {
        if (keep[key]) continue;
        const rec = await offlineCacheGet('auth:' + key);
        const u = rec && rec.user;
        // Hanya akun yang memang ikut disiapkan (pegawai kasir). Owner, Administrator, dan
        // Rekan Bisnis tidak ikut disiapkan, jadi tidak boleh ikut terhapus di sini.
        const covered = u && u.role !== 'Owner' && u.role !== 'Administrator' && u.role !== 'Rekan Bisnis';
        if (covered && (!u.branchId || u.branchId === branchId)) {
          await clearOfflineLogin(key);
          removed++;
        }
      }
      return { added: names.length, removed: removed, names: names };
    }

    // Daftar akun yang bisa dipakai login offline di tablet ini (untuk ditampilkan ke Owner).
    async function listOfflineLoginAccounts() {
      const out = [];
      for (const key of await offlineAuthIndexGet()) {
        const rec = await offlineCacheGet('auth:' + key);
        if (!rec || !rec.user) continue;
        out.push({
          username: key, name: rec.user.name || key, role: rec.user.role, branchId: rec.user.branchId || '',
          validUntil: rec.savedAt + OFFLINE_LOGIN_MAX_AGE_MS,
          expired: Date.now() - rec.savedAt > OFFLINE_LOGIN_MAX_AGE_MS
        });
      }
      return out;
    }

    function offlineLoginThrottleGet() {
      try { return JSON.parse(localStorage.getItem(OFFLINE_LOGIN_FAIL_KEY) || '{}'); } catch (e) { return {}; }
    }
    function offlineLoginThrottleSave(state) {
      try { localStorage.setItem(OFFLINE_LOGIN_FAIL_KEY, JSON.stringify(state)); } catch (e) {}
    }

    // Hasil: { ok: true, user } atau { ok: false, reason: 'unsupported' | 'locked' | 'no-record' | 'expired' | 'wrong', waitSec? }
    async function verifyOfflineLogin(username, password) {
      if (!offlineLoginAvailable()) return { ok: false, reason: 'unsupported' };
      const throttle = offlineLoginThrottleGet();
      if (throttle.until && throttle.until > Date.now()) {
        return { ok: false, reason: 'locked', waitSec: Math.ceil((throttle.until - Date.now()) / 1000) };
      }
      const rec = await offlineCacheGet('auth:' + username);
      if (!rec || !rec.hash) return { ok: false, reason: 'no-record' };
      if (Date.now() - rec.savedAt > OFFLINE_LOGIN_MAX_AGE_MS) return { ok: false, reason: 'expired' };

      let same = false;
      try {
        const typed = normalizePassword(password);
        const secret = rec.scheme === 'sha256' ? await sha256Hex(typed) : typed;
        const hash = await derivePasswordHash(secret, base64ToBytes(rec.salt), rec.iterations);
        const expected = base64ToBytes(rec.hash);
        let diff = hash.length === expected.length ? 0 : 1;
        for (let i = 0; i < hash.length && i < expected.length; i++) diff |= hash[i] ^ expected[i];
        same = diff === 0;
      } catch (e) {
        return { ok: false, reason: 'unsupported' };
      }

      if (same) {
        offlineLoginThrottleSave({});
        return { ok: true, user: rec.user };
      }
      const fails = (throttle.fails || 0) + 1;
      if (fails >= OFFLINE_LOGIN_MAX_FAILS) offlineLoginThrottleSave({ fails: 0, until: Date.now() + OFFLINE_LOGIN_LOCK_MS });
      else offlineLoginThrottleSave({ fails: fails });
      return { ok: false, reason: 'wrong' };
    }

    // ==========================================
    // LOGIN PIN (masuk cepat): kasir cukup pilih nama + PIN 4-6 angka.
    // PIN hanya berlaku di TABLET ini (disimpan sebagai sidik jari PBKDF2, bukan PIN
    // aslinya) dan tidak menggantikan password: dibuat setelah kasir login dengan
    // password. Salah 5 kali -> PIN dihapus, harus masuk dengan password lagi.
    // Saat online, akun dicek ke server (masih terdaftar? peran berubah?); saat
    // offline, PIN berlaku 30 hari sejak terakhir dikonfirmasi online.
    // ==========================================
    const PIN_INDEX_KEY = 'pin-index';
    const PIN_MAX_FAILS = 5;
    const PIN_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;

    function pinEligible(user) {
      return !!user && offlineLoginAvailable() && user.role !== 'Owner' && user.role !== 'Administrator' && user.role !== 'Rekan Bisnis';
    }
    function pinFormatOk(pin) { return /^[0-9]{4,6}$/.test(String(pin || '')); }

    async function pinIndexGet() {
      const idx = await offlineCacheGet(PIN_INDEX_KEY);
      return Array.isArray(idx) ? idx : [];
    }
    async function hasPin(username) {
      const rec = await offlineCacheGet('pin:' + username);
      return !!(rec && rec.hash);
    }
    async function clearPin(username) {
      await offlineCacheSet('pin:' + username, null);
      const idx = await pinIndexGet();
      const next = idx.filter(u => u !== username);
      if (next.length !== idx.length) await offlineCacheSet(PIN_INDEX_KEY, next);
    }
    async function savePin(username, pin, user) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const hash = await derivePasswordHash(String(pin), salt, OFFLINE_LOGIN_ITERATIONS);
      await offlineCacheSet('pin:' + username, {
        salt: bytesToBase64(salt), hash: bytesToBase64(hash), iterations: OFFLINE_LOGIN_ITERATIONS,
        user: user, setAt: Date.now(), verifiedAt: Date.now(), fails: 0
      });
      const idx = await pinIndexGet();
      if (idx.indexOf(username) === -1) { idx.push(username); await offlineCacheSet(PIN_INDEX_KEY, idx); }
    }
    // Daftar kasir yang sudah punya PIN di tablet ini (untuk tombol nama di layar login).
    async function listPinAccounts() {
      const out = [];
      for (const key of await pinIndexGet()) {
        const rec = await offlineCacheGet('pin:' + key);
        if (!rec || !rec.user) continue;
        out.push({ username: key, name: rec.user.name || key, role: rec.user.role, branchId: rec.user.branchId || '' });
      }
      out.sort((a, b) => String(a.name).localeCompare(String(b.name)));
      return out;
    }

    // Tanya server apakah akun masih ada. 'unreachable' = tidak bisa memastikan (offline/lambat).
    // Memakai token tersimpan: server mengecek akun masih ada & password belum diganti,
    // sekaligus menukar token dengan yang baru (sesi diperpanjang 30 hari).
    // Status: ok | gone | reauth (token kedaluwarsa/password diganti) | notoken (data lama) | unreachable.
    async function confirmAccountOnline(username, token) {
      if (typeof navigator !== 'undefined' && navigator.onLine === false) return { status: 'unreachable' };
      if (!token) return { status: 'notoken' };
      try {
        const res = await Promise.race([
          runGoogleScriptRaw('renewSession', token),
          new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 5000))
        ]);
        if (!res) return { status: 'unreachable' };
        if (res.success && res.user) {
          return { status: 'ok', token: res.token, emp: { Role: res.user.role, Name: res.user.name, Branch_ID: res.user.branchId } };
        }
        if (res.status === 'gone') return { status: 'gone' };
        return { status: 'reauth' };
      } catch (e) { return { status: 'unreachable' }; }
    }

    // Simpan token baru ke catatan PIN & login offline akun ini (kalau ada).
    async function refreshStoredToken(username, token) {
      if (!token) return;
      try {
        for (const key of ['pin:' + username, 'auth:' + username]) {
          const rec = await offlineCacheGet(key);
          if (rec && rec.user) await offlineCacheSet(key, Object.assign({}, rec, { user: Object.assign({}, rec.user, { token: token }) }));
        }
      } catch (e) {}
    }

    // Hasil: { ok:true, user } atau { ok:false, reason:'unsupported'|'no-record'|'wrong'|'wiped'|'expired'|'gone'|'role', left? }
    async function loginWithPin(username, pin) {
      if (!offlineLoginAvailable()) return { ok: false, reason: 'unsupported' };
      const rec = await offlineCacheGet('pin:' + username);
      if (!rec || !rec.hash) return { ok: false, reason: 'no-record' };
      let same = false;
      try {
        const hash = await derivePasswordHash(String(pin), base64ToBytes(rec.salt), rec.iterations);
        const expected = base64ToBytes(rec.hash);
        let diff = hash.length === expected.length ? 0 : 1;
        for (let i = 0; i < hash.length && i < expected.length; i++) diff |= hash[i] ^ expected[i];
        same = diff === 0;
      } catch (e) { return { ok: false, reason: 'unsupported' }; }

      if (!same) {
        const fails = (rec.fails || 0) + 1;
        if (fails >= PIN_MAX_FAILS) { await clearPin(username); return { ok: false, reason: 'wiped' }; }
        await offlineCacheSet('pin:' + username, Object.assign({}, rec, { fails: fails }));
        return { ok: false, reason: 'wrong', left: PIN_MAX_FAILS - fails };
      }

      const check = await confirmAccountOnline(username, rec.user && rec.user.token);
      if (check.status === 'reauth' || check.status === 'notoken') return { ok: false, reason: 'reauth' };
      if (check.status === 'gone') {
        await clearPin(username);
        await clearOfflineLogin(username);
        return { ok: false, reason: 'gone' };
      }
      let user = rec.user;
      let verifiedAt = rec.verifiedAt || rec.setAt || 0;
      if (check.status === 'ok') {
        const role = check.emp.Role;
        if (role === 'Owner' || role === 'Administrator' || role === 'Rekan Bisnis') {
          await clearPin(username);
          return { ok: false, reason: 'role' };
        }
        user = Object.assign({}, rec.user, { role: role, name: check.emp.Name || rec.user.name, token: check.token || rec.user.token });
        if (check.emp.Branch_ID) user.branchId = check.emp.Branch_ID;
        verifiedAt = Date.now();
      } else if (Date.now() - verifiedAt > PIN_MAX_AGE_MS) {
        return { ok: false, reason: 'expired' };
      }
      await offlineCacheSet('pin:' + username, Object.assign({}, rec, { fails: 0, verifiedAt: verifiedAt, user: user }));
      if (check.status === 'ok' && check.token) refreshStoredToken(username, check.token);
      return { ok: true, user: user };
    }

    function LoginScreen({ onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [branches, setBranches] = useState([]);
      const [branchId, setBranchId] = useState('');
      const notify = useNotification();
      const [mode, setMode] = useState('pin'); // 'pin' | 'password' (PIN dipakai otomatis kalau tablet ini punya akun ber-PIN)
      const [pinAccounts, setPinAccounts] = useState([]);
      const [pinUser, setPinUser] = useState('');
      const [pinValue, setPinValue] = useState('');
      const [pinSetup, setPinSetup] = useState(null); // { uname, user } saat kasir diminta membuat PIN
      const [newPin, setNewPin] = useState('');
      const [newPin2, setNewPin2] = useState('');
      const [forcePinSetup, setForcePinSetup] = useState(false);

      useEffect(() => {
        listPinAccounts().then(setPinAccounts).catch(() => {});
      }, []);

      useEffect(() => {
        runGoogleScript('getBranches')
          .then(data => {
            setBranches(data || []);
            // Outlet sengaja dikosongkan: kasir harus memilih sendiri. Kalau hanya ada
            // satu outlet, langsung dipilihkan.
            if (data && data.length === 1) setBranchId(data[0].ID);
          })
          .catch(() => {});
      }, []);

      // Menyelesaikan login (dipakai jalur online maupun offline): cek aturan outlet,
      // lalu masuk. Mengembalikan false kalau login ditolak karena salah pilih outlet.
      const branchErrorFor = (user) => {
        if (branches.length > 1 && !branchId) return 'Pilih outlet dulu.';
        const isOwner = user.role === 'Owner';
        const ownBranchId = user.branchId;
        // Pegawai (bukan Owner) hanya boleh login di cabang yang memang jadi tempatnya.
        // (Kalau daftar cabang gagal dimuat sama sekali, pemeriksaan ini dilewati
        // supaya pegawai tidak terkunci di luar hanya karena daftarnya kosong.)
        if (!isOwner && ownBranchId && branches.length > 0 && branchId !== ownBranchId) {
          const ownBranch = branches.find(b => b.ID === ownBranchId);
          return `Akun ini terdaftar di outlet "${ownBranch ? ownBranch.Name : ownBranchId}". Silakan pilih outlet tersebut untuk masuk.`;
        }
        return '';
      };

      const finishLogin = (user) => {
        const ownBranchId = user.branchId;
        const branchErr = branchErrorFor(user);
        if (branchErr) { setError(branchErr); return false; }

        const selectedBranch = branches.find(b => b.ID === branchId);
        onLogin(user, selectedBranch ? { ID: selectedBranch.ID, Name: selectedBranch.Name } : { ID: ownBranchId || 'BR001', Name: 'Cabang Utama' });
        return true;
      };

      // Setelah login dengan PASSWORD berhasil: kasir yang belum punya PIN di tablet ini
      // ditawari membuat PIN dulu (bisa dilewati), baru masuk.
      const proceedAfterPassword = async (uname, user) => {
        const branchErr = branchErrorFor(user);
        if (branchErr) { setError(branchErr); return; }
        if (user && user.token) { try { await refreshStoredToken(uname, user.token); } catch (e) {} }
        if (pinEligible(user)) {
          let needs = forcePinSetup;
          if (!needs) { try { needs = !(await hasPin(uname)); } catch (e) { needs = false; } }
          if (needs) { setPinSetup({ uname: uname, user: user }); setNewPin(''); setNewPin2(''); return; }
        }
        finishLogin(user);
      };

      const handleSavePin = async (e) => {
        e.preventDefault();
        if (!pinFormatOk(newPin)) { setError('PIN harus 4 sampai 6 angka.'); return; }
        if (newPin !== newPin2) { setError('Kedua PIN tidak sama.'); return; }
        try { await savePin(pinSetup.uname, newPin, pinSetup.user); } catch (err) { /* PIN hanya kemudahan; tetap masuk */ }
        const u = pinSetup.user;
        setPinSetup(null);
        setForcePinSetup(false);
        finishLogin(u);
      };

      const handleSkipPin = () => {
        const u = pinSetup.user;
        setPinSetup(null);
        setForcePinSetup(false);
        finishLogin(u);
      };

      const handlePinLogin = async (e) => {
        e.preventDefault();
        if (!pinUser) { setError('Pilih nama Anda dulu.'); return; }
        if (!pinFormatOk(pinValue)) { setError('Masukkan PIN 4 sampai 6 angka.'); return; }
        setLoading(true);
        setError('');
        const res = await loginWithPin(pinUser, pinValue);
        setLoading(false);
        setPinValue('');
        if (res.ok) {
          finishLogin(res.user);
          return;
        }
        const goPassword = (msg) => { setError(msg); listPinAccounts().then(setPinAccounts).catch(() => {}); setPinUser(''); };
        if (res.reason === 'wrong') setError(`PIN salah. Sisa percobaan: ${res.left}.`);
        else if (res.reason === 'wiped') goPassword('PIN salah 5 kali, jadi dihapus demi keamanan. Masuk dengan password untuk membuat PIN baru.');
        else if (res.reason === 'expired') setError('PIN perlu dikonfirmasi ulang lewat internet (sudah lebih dari 30 hari). Sambungkan internet lalu coba lagi, atau masuk dengan password.');
        else if (res.reason === 'gone') goPassword('Akun ini sudah tidak terdaftar. Hubungi Owner.');
        else if (res.reason === 'reauth') goPassword('Masuk dengan password sekali untuk memperbarui sesi (sesi lebih dari 30 hari, password diganti, atau pembaruan keamanan).');
        else if (res.reason === 'role') goPassword('Peran akun ini berubah. Masuk dengan password.');
        else if (res.reason === 'unsupported') setError('Browser ini tidak mendukung login PIN. Masuk dengan password.');
        else goPassword('PIN tidak ditemukan. Masuk dengan password.');
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        const uname = username.trim().toLowerCase();
        try {
          const res = await runGoogleScript('authenticate', uname, password);
          if (res.success) {
            // Simpan sidik jari password di tablet ini (tanpa menunggu) supaya lain
            // kali bisa login walau internet mati.
            const loggedIn = res.token ? Object.assign({}, res.user, { token: res.token }) : res.user;
            if (res.token) setAuthToken(res.token);
            saveOfflineLogin(uname, password, loggedIn);
            await proceedAfterPassword(uname, loggedIn);
          } else {
            // Server menyatakan akun/password tidak valid -> cabut izin login offline
            // akun ini di perangkat ini (misal password sudah diganti Owner).
            clearOfflineLogin(uname);
            setError(res.message);
          }
        } catch (err) {
          if (err && err.serverError) {
            // Server merespons tapi bermasalah -- ini bukan soal internet, jangan
            // dijawab dengan login offline.
            setError('Terjadi kesalahan di server.');
            notify.alert("Gagal melakukan autentikasi. Hubungi pemilik sistem.", "Masalah Server", "error");
          } else {
            // Tidak ada koneksi ke server -> coba login offline (hanya akun yang
            // pernah login online di perangkat ini).
            const offline = await verifyOfflineLogin(uname, password);
            if (offline.ok) {
              await proceedAfterPassword(uname, offline.user);
            } else if (offline.reason === 'locked') {
              setError(`Terlalu banyak percobaan salah. Coba lagi dalam ${offline.waitSec} detik.`);
            } else if (offline.reason === 'wrong') {
              setError('Username atau password salah.');
            } else if (offline.reason === 'unsupported') {
              setError('Tidak ada koneksi internet, dan browser ini tidak mendukung login offline.');
            } else {
              // 'no-record' atau 'expired'
              setError('Tidak ada koneksi internet. Login offline hanya bisa untuk akun yang pernah login online di tablet ini dalam 30 hari terakhir, atau yang sudah disiapkan Owner lewat menu Pemeliharaan Data.');
            }
          }
        }
        setLoading(false);
      };

      const needOutlet = branches.length > 1 && !branchId;
      const visiblePinAccounts = needOutlet ? [] : pinAccounts.filter(a => !a.branchId || a.branchId === branchId);

      const outletField = branches.length > 1 ? (
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Outlet</label>
          <div className="relative">
            <i className="fa-solid fa-store absolute left-3 top-3.5 text-gray-400"></i>
            <select value={branchId} onChange={e => { setBranchId(e.target.value); setPinUser(''); setPinValue(''); setError(''); }} className="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all bg-white appearance-none">
              <option value="">-- Pilih outlet --</option>
              {branches.map(b => <option key={b.ID} value={b.ID}>{b.Name}</option>)}
            </select>
          </div>
        </div>
      ) : null;

      return (
        <div className="min-h-screen overflow-y-auto flex items-start sm:items-center justify-center bg-slate-100 p-4 py-8 sm:py-10">
          <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200 my-auto">
            <div className="text-center mb-8">
              <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200">
                <i className="fa-solid fa-cash-register text-white text-2xl"></i>
              </div>
              <h1 className="text-2xl font-bold text-gray-800">Qasir Minum.Es</h1>
              <p className="text-gray-500 text-sm mt-1">Masuk untuk memulai sesi Anda</p>
            </div>
            {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm text-center font-semibold border border-red-100">{error}</div>}
            {pinSetup ? (
              <form onSubmit={handleSavePin} className="space-y-4">
                <p className="text-sm text-gray-600 text-center">Halo, <span className="font-bold text-gray-800">{pinSetup.user.name || pinSetup.uname}</span>. Buat PIN 4-6 angka supaya lain kali cukup pilih nama dan masukkan PIN. PIN hanya berlaku di tablet ini.</p>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">PIN baru</label>
                  <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6} value={newPin} onChange={e => setNewPin(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center text-xl font-bold" autoFocus />
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Ulangi PIN</label>
                  <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6} value={newPin2} onChange={e => setNewPin2(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center text-xl font-bold" />
                </div>
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-lg transition-all">Simpan PIN & Masuk</button>
                <button type="button" onClick={handleSkipPin} className="w-full text-sm text-gray-500 py-2">Lewati, masuk tanpa PIN</button>
              </form>
            ) : (mode === 'pin' && pinAccounts.length > 0) ? (
              <form onSubmit={handlePinLogin} className="space-y-4">
                {outletField}
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Pilih nama Anda</label>
                  {needOutlet && <p className="text-sm text-gray-500 text-center py-2">Pilih outlet dulu untuk melihat nama kasir.</p>}
                  {!needOutlet && visiblePinAccounts.length === 0 && <p className="text-sm text-gray-500 text-center py-2">Belum ada kasir ber-PIN di outlet ini. Masuk dengan password.</p>}
                  <div className="grid grid-cols-2 gap-2">
                    {visiblePinAccounts.map(a => (
                      <button type="button" key={a.username} onClick={() => { setPinUser(a.username); setPinValue(''); setError(''); }} className={`px-3 py-3 rounded-lg border text-sm font-bold truncate ${pinUser === a.username ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-700 border-gray-300 hover:border-indigo-400'}`}>{a.name}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">PIN</label>
                  <input type="password" inputMode="numeric" pattern="[0-9]*" maxLength={6} value={pinValue} onChange={e => setPinValue(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center text-xl font-bold" />
                </div>
                <button type="submit" disabled={loading} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-lg flex justify-center items-center gap-2 transition-all">
                  {loading ? <div className="loader border-white border-t-indigo-600"></div> : <span>Masuk</span>}
                </button>
                <button type="button" onClick={() => { setMode('password'); setForcePinSetup(true); setError(''); }} className="w-full text-sm text-indigo-600 hover:text-indigo-800 py-2">Lupa PIN / masuk dengan password</button>
              </form>
            ) : (
            <form onSubmit={handleLogin} className="space-y-4">
              {outletField}

                <label className="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <div className="relative">
                  <i className="fa-solid fa-user absolute left-3 top-3.5 text-gray-400"></i>
                  <input type="text" value={username} onChange={e => setUsername(e.target.value)} required className="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Masukkan username" />

              )}
            </form>
            )}
          </div>
        </div>
      );
