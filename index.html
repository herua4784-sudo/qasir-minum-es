    function CategoryManagerView({ readOnly }) {
       const [categories, setCategories] = useState([]);
       const [loading, setLoading] = useState(true);
       const [modal, setModal] = useState({ isOpen: false, mode: 'add' });
       const [formData, setFormData] = useState({ ID: '', Name: '' });
       const notify = useNotification();

       const loadCategories = () => {
         setLoading(true);
         cachedFetch('categories', () => runGoogleScript('getCategories')).then(data => { setCategories(data); setLoading(false); });
       };

       useEffect(() => { loadCategories(); }, []);

       const openModal = (mode, category = null) => {
         if (mode === 'edit' && category) setFormData({ ...category });
         else setFormData({ ID: 'C' + String(categories.length + 1).padStart(3, '0'), Name: '' });
         setModal({ isOpen: true, mode });
       };

       const handleSave = async (e) => {
         e.preventDefault();
         const btn = e.target.querySelector('button[type="submit"]');
         const originalText = btn.innerHTML;
         btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...';
         btn.disabled = true;
         const res = await runGoogleScript('manageCategory', modal.mode, formData);
         if (res.success) { 
           invalidateCache('categories');
           setModal({ isOpen: false, mode: 'add' }); 
           loadCategories(); 
           notify.alert(`Kategori "${formData.Name}" berhasil disimpan!`, "Kategori Diperbarui", "success");
         } else {
           notify.alert("Gagal: " + res.message, "Penyimpanan Gagal", "error");
         }
         btn.innerHTML = originalText; btn.disabled = false;
       };

       const handleDelete = async (id, name) => {
         notify.confirm(`Apakah Anda yakin ingin menghapus kategori "${name}"? Pastikan tidak ada produk yang menggunakan kategori ini.`, async () => {
           const res = await runGoogleScript('manageCategory', 'delete', { ID: id });
           if (res.success) {
             invalidateCache('categories');
             loadCategories();
             notify.alert(`Kategori "${name}" berhasil dihapus.`, "Kategori Dihapus", "success");
           } else {
             notify.alert("Gagal menghapus kategori. Kategori ini mungkin masih dikaitkan dengan produk aktif.", "Gagal Hapus", "error");
           }
         });
       };

       return (
         <div className="p-6 relative h-full flex flex-col">
           {modal.isOpen && (
             <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
               <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm transform animate-fade-in-up max-h-[90vh] overflow-y-auto">
                 <div className="flex justify-between items-center mb-4 border-b pb-3">
                   <h3 className="font-bold text-xl text-gray-800">{modal.mode === 'add' ? 'Tambah Kategori' : 'Edit Kategori'}</h3>
                   <button onClick={() => setModal({ isOpen: false, mode: 'add' })} className="text-gray-400 hover:bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center"><i className="fa-solid fa-xmark"></i></button>
                 </div>
                 <form onSubmit={handleSave} className="space-y-4">
                   <div>
                     <label className="block text-sm font-semibold text-gray-700 mb-1">ID Kategori</label>
                     <input type="text" value={formData.ID} readOnly className="w-full px-3 py-2 border rounded-lg bg-gray-100 text-gray-500 font-mono text-sm" />
                   </div>
                   <div>
                     <label className="block text-sm font-semibold text-gray-700 mb-1">Nama Kategori</label>
                     <input type="text" required value={formData.Name} onChange={e => setFormData({...formData, Name: e.target.value})} className="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Misal: Minuman Boba" />
                   </div>
                   <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl mt-6 shadow-md transition-colors">Simpan Kategori</button>
                 </form>
               </div>
             </div>
           )}
           <div className="flex justify-between items-center mb-4">
              <h2 className="text-2xl font-bold text-gray-800">Kelola Kategori Produk</h2>
              {!readOnly && (
                <button onClick={() => openModal('add')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md flex items-center transition-colors"><i className="fa-solid fa-plus mr-2"></i>Tambah Kategori</button>
              )}
           </div>
           <div className="bg-sky-50 border border-sky-100 rounded-xl p-3 mb-4 text-xs text-sky-700 max-w-2xl">
             <i className="fa-solid fa-circle-info mr-1.5"></i>
             Kategori di sini otomatis berlaku untuk <b>semua cabang</b> — tidak perlu diulang satu-satu tiap buka cabang baru.
           </div>
           <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 flex flex-col max-w-2xl">
             <div className="overflow-auto flex-1">
               <table className="w-full text-left text-sm whitespace-nowrap">
                 <thead className="bg-gray-50 border-b sticky top-0 z-10">
                   <tr><th className="p-4 font-semibold text-gray-600 w-24">ID</th><th className="p-4 font-semibold text-gray-600">Nama Kategori</th><th className="p-4 font-semibold text-gray-600 text-center w-32">Aksi</th></tr>
                 </thead>
                 <tbody>
                   {loading ? ( <tr><td colSpan="3" className="p-12 text-center text-gray-400">Memuat...</td></tr> ) : categories.length === 0 ? (
                     <tr><td colSpan="3" className="p-12 text-center text-gray-400">Belum ada kategori.</td></tr>
                   ) : (
                     categories.map(c => (
                       <tr key={c.ID} className="border-b border-gray-50 hover:bg-emerald-50/50">
                         <td className="p-4 text-gray-500 font-mono">{c.ID}</td><td className="p-4 font-bold text-gray-800">{c.Name}</td>
                         <td className="p-4 text-center">
                           {!readOnly && (
                             <>
                               <button onClick={() => openModal('edit', c)} className="text-blue-600 hover:text-blue-800 bg-blue-50 w-8 h-8 rounded-lg mr-2 transition-colors"><i className="fa-solid fa-pen-to-square"></i></button>
                               <button onClick={() => handleDelete(c.ID, c.Name)} className="text-red-500 hover:text-red-100 bg-red-50 w-8 h-8 rounded-lg transition-colors"><i className="fa-solid fa-trash-can"></i></button>
                             </>
                           )}
                         </td>
                       </tr>
                     ))
                   )}
                 </tbody>
               </table>
             </div>
           </div>
         </div>
       );
    }

    function ProductManagerView({ hideDeleteForAdmin, branch, readOnly }) {
       const [products, setProducts] = useState([]);
       const [categories, setCategories] = useState([]);
       const [loading, setLoading] = useState(true);
       const [filterCat, setFilterCat] = useState('Semua'); 
       const notify = useNotification();
       const branchId = branch ? branch.ID : 'BR001';
       
       const [modal, setModal] = useState({ isOpen: false, mode: 'add' });
       const [formData, setFormData] = useState({ ID: '', Name: '', Category: '', Price: '', Harga_Jumbo: '', Image_URL: '', Cost_Price: '', Cost_Price_Jumbo: '' });
       
       const [rawImageSrc, setRawImageSrc] = useState(null);
       const [croppedImageBase64, setCroppedImageBase64] = useState(null);
       const [showCropper, setShowCropper] = useState(false);

       const [branchList, setBranchList] = useState([]);
       const [copyModalOpen, setCopyModalOpen] = useState(false);
       const [copySourceBranchId, setCopySourceBranchId] = useState('');
       const [copying, setCopying] = useState(false);
       const [copyResult, setCopyResult] = useState(null);
       const [syncingCostPrices, setSyncingCostPrices] = useState(false);

       useEffect(() => {
         runGoogleScript('getBranches').then(data => setBranchList(data || [])).catch(() => {});
       }, []);

       const openCopyModal = () => {
         setCopySourceBranchId('');
         setCopyResult(null);
         setCopyModalOpen(true);
       };

       const handleSyncAllCostPrices = () => {
         setSyncingCostPrices(true);
         runGoogleScript('syncAllProductCostPrices', branchId).then(res => {
           if (res.success) {
             notify.alert(`Harga Modal ${res.syncedCount} produk berhasil disinkronkan dengan Resep terbaru.`, "Sinkronisasi Berhasil", "success");
             invalidateCache('products_' + branchId);
             loadData();
           } else {
             notify.alert("Gagal menyinkronkan.", "Gagal", "error");
           }
           setSyncingCostPrices(false);
         }).catch(() => {
           notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
           setSyncingCostPrices(false);
         });
       };

       const handleCopyPricing = () => {
         if (!copySourceBranchId) {
           notify.alert("Pilih cabang sumber terlebih dahulu.", "Data Belum Lengkap", "error");
           return;
         }
         setCopying(true);
         runGoogleScript('copyProductPricing', copySourceBranchId, branchId).then(res => {
           if (res.success) {
             setCopyResult(res);
             invalidateCache('products_' + branchId);
           } else {
             notify.alert(res.message, "Gagal", "error");
           }
           setCopying(false);
         }).catch(() => {
           notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
           setCopying(false);
         });
       };

       const loadData = () => {
         setLoading(true);
         Promise.all([ cachedFetch('products_' + branchId, () => runGoogleScript('getProducts', branchId)), cachedFetch('categories', () => runGoogleScript('getCategories')) ]).then(([prodData, catData]) => {
           setProducts(prodData || []); setCategories(catData || []); setLoading(false);
         });
       };

       useEffect(() => { loadData(); }, [branchId]);

       const openModal = (mode, product = null) => {
         setRawImageSrc(null);
         setCroppedImageBase64(null);
         setShowCropper(false);
         
         const defaultCat = categories.length > 0 ? categories[0].Name : 'Lainnya';
         if (mode === 'edit' && product) {
           setFormData({ ...product });
         } else {
           const newId = 'P' + new Date().getTime().toString().slice(-8);
           setFormData({ ID: newId, Name: '', Category: defaultCat, Price: '', Harga_Jumbo: '', Image_URL: '', Cost_Price: '', Cost_Price_Jumbo: '' });
         }
         setModal({ isOpen: true, mode });
       };

       const handleFileChange = (e) => {
         const file = e.target.files[0];
         if (file) {
           const reader = new FileReader();
           reader.readAsDataURL(file);
           reader.onload = () => {
             setRawImageSrc(reader.result);
             setShowCropper(true);
           };
           e.target.value = null;
         }
       };

       const handleSave = async (e) => {
         e.preventDefault();
         const btn = e.target.querySelector('button[type="submit"]');
         const originalText = btn.innerHTML;
         btn.disabled = true;

         let finalData = { ...formData };

         if (croppedImageBase64) {
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Mengunggah Foto...';
            const base64Data = croppedImageBase64.split(',')[1];
            const filename = "Product_" + new Date().getTime() + ".jpg";
            
            const uploadRes = await runGoogleScript('uploadImage', base64Data, filename, 'image/jpeg');
            if (uploadRes.success) {
               finalData.Image_URL = uploadRes.url; 
               await submitToDatabase(finalData, btn, originalText);
            } else {
               notify.alert("Gagal mengunggah gambar produk: " + uploadRes.message, "Unggah Gagal", "error");
               btn.innerHTML = originalText;
               btn.disabled = false;
            }
            return; 
         }
         
         await submitToDatabase(finalData, btn, originalText);
       };

       const submitToDatabase = async (dataToSave, btn, originalText) => {
         btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan Data...';
         const res = await runGoogleScript('manageProduct', modal.mode, dataToSave, branchId);
         if (res.success) {
           invalidateCache('products_' + branchId);
           setModal({ isOpen: false, mode: 'add' });
           setCroppedImageBase64(null);
           loadData();
           notify.alert(`Produk "${dataToSave.Name}" berhasil disimpan!`, "Katalog Diperbarui", "success");
         } else {
           notify.alert("Gagal menyimpan data produk: " + res.message, "Gagal Simpan", "error");
         }
         btn.innerHTML = originalText;
         btn.disabled = false;
       };

       const handleDelete = async (id, name) => {
         notify.confirm(`Apakah Anda yakin ingin menghapus produk "${name}"? Ini akan menghapus produk beserta harganya di SEMUA cabang.`, async () => {
           const res = await runGoogleScript('manageProduct', 'delete', { ID: id });
           if (res.success) {
             invalidateCache('products_' + branchId);
             loadData();
             notify.alert(`Produk "${name}" berhasil dihapus.`, "Katalog Diperbarui", "success");
           } else {
             notify.alert("Gagal menghapus produk. Silakan coba lagi.", "Penghapusan Gagal", "error");
           }
         });
       };

       const displayedProducts = filterCat === 'Semua' ? products : products.filter(p => p.Category === filterCat);

       return (
         <div className="p-6 relative h-full flex flex-col">
           {showCropper && (
             <ImageCropperModal 
               imageSrc={rawImageSrc} 
               onCancel={() => { setShowCropper(false); setRawImageSrc(null); }}
               onCropComplete={(croppedDataUrl) => {
                 setCroppedImageBase64(croppedDataUrl);
                 setShowCropper(false);
               }}
             />
           )}

           {modal.isOpen && !showCropper && (
             <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
               <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-lg transform animate-fade-in-up max-h-[90vh] overflow-y-auto">
                 <div className="flex justify-between items-center mb-4 border-b pb-3 sticky top-0 bg-white z-10">
                   <h3 className="font-bold text-xl text-gray-800">
                     {modal.mode === 'add' ? 'Tambah Produk Baru' : 'Edit Produk'}
                   </h3>
                   <button onClick={() => setModal({ isOpen: false, mode: 'add' })} className="text-gray-400 hover:bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center">
                     <i className="fa-solid fa-xmark"></i>
                   </button>
                 </div>
                 
                 <form onSubmit={handleSave} className="space-y-4 pb-2">
                   <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                     <label className="block text-sm font-semibold text-gray-700 mb-2">Foto Produk (Potong Kotak 1:1)</label>
                     <div className="flex items-center gap-3">
                       <div className="h-16 w-16 bg-white border rounded-lg overflow-hidden flex items-center justify-center shrink-0 shadow-sm p-1">
                         {croppedImageBase64 ? (
                           <img src={croppedImageBase64} className="w-full h-full object-contain" />
                         ) : formData.Image_URL ? (
                           <img src={formatImageUrl(formData.Image_URL)} className="w-full h-full object-contain" onError={(e) => { e.target.onerror = null; e.target.src = "https://placehold.co/200x200/ffffff/94a3b8?text=Image+Error"; }} />
                         ) : (
                           <i className="fa-solid fa-camera text-slate-300 text-xl"></i>
                         )}
                       </div>
                       <input type="file" accept="image/*" onChange={handleFileChange} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-xs bg-white text-gray-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer" />
                     </div>
                   </div>

                   <div className="grid grid-cols-2 gap-4">
                     <div>
                       <label className="block text-sm font-semibold text-gray-700 mb-1">ID Produk</label>
                       <input type="text" value={formData.ID} readOnly className="w-full px-3 py-2 border rounded-lg bg-gray-100 text-gray-500 font-mono text-sm" />
                     </div>
                     <div>
                       <label className="block text-sm font-semibold text-gray-700 mb-1">Kategori</label>
                       <select value={formData.Category} onChange={e => setFormData({...formData, Category: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm bg-white">
                         {categories.length === 0 && <option value="Belum Ada">Belum Ada Kategori</option>}
                         {categories.map(c => <option key={c.ID} value={c.Name}>{c.Name}</option>)}
                       </select>
                     </div>
                   </div>

                   <div>
                     <label className="block text-sm font-semibold text-gray-700 mb-1">Nama Produk</label>
                     <input type="text" required value={formData.Name} onChange={e => setFormData({...formData, Name: e.target.value})} className="w-full px-3 py-2.5 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Misal: Es Jeruk Nipis" />
                   </div>
                   
                   <div className="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100 space-y-3">
                     <p className="text-xs font-bold text-emerald-700 uppercase tracking-wide">Varian Reguler / Medium <span className="font-normal normal-case text-emerald-600">(khusus cabang {branch ? branch.Name : 'Cabang Utama'})</span></p>
                     <div className="grid grid-cols-2 gap-4">
                       <div>
                         <label className="block text-xs font-semibold text-gray-600 mb-1">Harga Jual</label>
                         <div className="relative">
                           <span className="absolute left-3 top-2.5 text-gray-500 text-sm">Rp</span>
                           <input type="number" required value={formData.Price} onChange={e => setFormData({...formData, Price: e.target.value})} className="w-full pl-8 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="0" />
                         </div>
                       </div>
                       <div>
                         <label className="block text-xs font-semibold text-gray-600 mb-1">Harga Modal <span className="text-gray-400 font-normal normal-case">(otomatis dari Resep)</span></label>
                         <div className="relative">
                           <span className="absolute left-3 top-2.5 text-gray-400 text-sm">Rp</span>
                           <input type="text" readOnly value={formData.Cost_Price ? Number(formData.Cost_Price).toLocaleString('id-ID', { maximumFractionDigits: 2 }) : 'Belum ada resep'} className="w-full pl-8 pr-3 py-2 border rounded-lg text-sm bg-gray-50 text-gray-500 cursor-not-allowed" />
                         </div>
                       </div>
                     </div>
                   </div>

                   <div className="bg-orange-50/50 p-4 rounded-xl border border-orange-100 space-y-3">
                     <p className="text-xs font-bold text-orange-700 uppercase tracking-wide">Varian Jumbo (Opsional)</p>
                     <div className="grid grid-cols-2 gap-4">
                       <div>
                         <label className="block text-xs font-semibold text-gray-600 mb-1">Harga Jual</label>
                         <div className="relative">
                           <span className="absolute left-3 top-2.5 text-gray-500 text-sm">Rp</span>
                           <input type="number" value={formData.Harga_Jumbo || ''} onChange={e => setFormData({...formData, Harga_Jumbo: e.target.value})} className="w-full pl-8 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="Kosongkan jika tak ada" />
                         </div>
                       </div>
                       <div>
                         <label className="block text-xs font-semibold text-gray-600 mb-1">Harga Modal <span className="text-gray-400 font-normal normal-case">(otomatis dari Resep)</span></label>
                         <div className="relative">
                           <span className="absolute left-3 top-2.5 text-gray-400 text-sm">Rp</span>
                           <input type="text" readOnly value={formData.Cost_Price_Jumbo ? Number(formData.Cost_Price_Jumbo).toLocaleString('id-ID', { maximumFractionDigits: 2 }) : 'Belum ada resep'} className="w-full pl-8 pr-3 py-2 border rounded-lg text-sm bg-gray-50 text-gray-500 cursor-not-allowed" />
                         </div>
                       </div>
                     </div>
                   </div>

                   <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl mt-4 shadow-md transition-colors sticky bottom-0">
                      Simpan Data Produk
                   </button>
                 </form>
               </div>
             </div>
           )}

           <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
              <div>
                <h2 className="text-2xl font-bold text-gray-800">Katalog Produk</h2>
                <p className="text-gray-500 text-sm mt-1 font-medium">Atur foto, data modal, harga jual reguler & jumbo gerai Anda. <span className="text-indigo-600 font-bold">Harga khusus untuk cabang: {branch ? branch.Name : 'Cabang Utama'}</span></p>
              </div>
              <div className="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                <div className="relative w-full sm:w-48">
                  <select 
                    value={filterCat} 
                    onChange={e => setFilterCat(e.target.value)} 
                    className="w-full bg-white text-gray-700 pl-3 pr-8 py-2.5 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-xs cursor-pointer appearance-none shadow-sm"
                  >
                    <option value="Semua">Semua Kategori</option>
                    {categories.map(c => (
                      <option key={c.ID} value={c.Name}>{c.Name}</option>
                    ))}
                  </select>
                  <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500">
                    <i className="fa-solid fa-chevron-down text-[10px]"></i>
                  </div>
                </div>

                {!readOnly && (
                  <button onClick={() => openModal('add')} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md transition-colors flex items-center w-full sm:w-auto justify-center">
                    <i className="fa-solid fa-plus mr-2"></i>Tambah Produk
                  </button>
                )}
                {!readOnly && branchList.length > 1 && (
                  <button onClick={openCopyModal} className="bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center w-full sm:w-auto justify-center">
                    <i className="fa-solid fa-copy mr-2"></i>Salin Harga dari Cabang Lain
                  </button>
                )}
                {!readOnly && (
                  <button onClick={handleSyncAllCostPrices} disabled={syncingCostPrices} className="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center w-full sm:w-auto justify-center">
                    {syncingCostPrices ? <i className="fa-solid fa-spinner fa-spin"></i> : <><i className="fa-solid fa-arrows-rotate mr-2"></i>Sinkronkan Semua Harga Modal</>}
                  </button>
                )}
              </div>
           </div>

           {/* MODAL SALIN HARGA PRODUK — nama & foto produk memang sudah otomatis
               sama di semua cabang, cuma HARGA yang perlu disalin per cabang. */}
           {copyModalOpen && (
             <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
               <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm">
                 <div className="flex justify-between items-center mb-4 border-b pb-3">
                   <h3 className="font-bold text-xl text-gray-800">Salin Harga dari Cabang Lain</h3>
                   <button onClick={() => setCopyModalOpen(false)} className="text-gray-400 hover:bg-gray-100 w-8 h-8 rounded-full"><i className="fa-solid fa-xmark"></i></button>
                 </div>

                 {!copyResult ? (
                   <>
                     <p className="text-xs text-gray-500 mb-4">Menyalin Harga Jual & Modal semua produk dari cabang lain ke <b>{branch ? branch.Name : 'cabang ini'}</b>. Produk yang sudah ada harganya di cabang ini tidak akan ditimpa.</p>
                     <div>
                       <label className="block text-sm font-semibold text-gray-700 mb-1">Salin Dari Cabang</label>
                       <select value={copySourceBranchId} onChange={e => setCopySourceBranchId(e.target.value)} className="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                         <option value="">-- Pilih Cabang Sumber --</option>
                         {branchList.filter(b => !branch || b.ID !== branch.ID).map(b => <option key={b.ID} value={b.ID}>{b.Name}</option>)}
                       </select>
                     </div>
                     <button onClick={handleCopyPricing} disabled={copying || !copySourceBranchId} className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white font-bold py-3 rounded-xl mt-4 transition-colors">
                       {copying ? <i className="fa-solid fa-spinner fa-spin"></i> : 'Salin Sekarang'}
                     </button>
                   </>
                 ) : (
                   <div>
                     <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-4 text-sm">
                       <p className="font-bold text-emerald-700 mb-2"><i className="fa-solid fa-circle-check mr-1.5"></i>Berhasil disalin!</p>
                       <div className="space-y-1 text-gray-600">
                         <div className="flex justify-between"><span>Harga produk baru disalin</span><span className="font-bold">{copyResult.copied}</span></div>
                         <div className="flex justify-between"><span>Sudah ada harga (dilewati)</span><span className="font-bold">{copyResult.skipped}</span></div>
                       </div>
                     </div>
                     <button onClick={() => { setCopyModalOpen(false); loadData(); }} className="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition-colors">Tutup & Muat Ulang</button>
                   </div>
                 )}
               </div>
             </div>
           )}
           
           <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 flex flex-col">
             <div className="overflow-x-auto flex-1">
               <table className="w-full text-left text-sm whitespace-nowrap">
                 <thead className="bg-gray-50 border-b sticky top-0 z-10">
                   <tr>
                     <th className="p-4 font-semibold text-gray-600 w-16">Foto</th>
                     <th className="p-4 font-semibold text-gray-600">Produk</th>
                     <th className="p-4 font-semibold text-gray-600">Reguler (Modal / Jual)</th>
                     <th className="p-4 font-semibold text-gray-600">Jumbo (Modal / Jual)</th>
                     <th className="p-4 font-semibold text-gray-600 text-center">Aksi</th>
                   </tr>
                 </thead>
                 <tbody>
                   {loading ? (
                     <tr><td colSpan="5" className="p-12 text-center text-gray-400"><i className="fa-solid fa-spinner fa-spin text-2xl mb-3 block"></i>Memuat...</td></tr>
                   ) : displayedProducts.length === 0 ? (
                     <tr><td colSpan="5" className="p-12 text-center text-gray-400">Tidak ada produk ditemukan di kategori "{filterCat}".</td></tr>
                   ) : (
                     displayedProducts.map(p => (
                       <tr key={p.ID} className="border-b border-gray-50 hover:bg-indigo-50/50 transition-colors">
                         <td className="p-4">
                           <div className="h-10 w-10 bg-slate-100 rounded-lg overflow-hidden flex items-center justify-center border shadow-sm">
                             {p.Image_URL ? (
                               <CachedImg url={p.Image_URL} alt={p.Name} fallbackIcon="fa-image" className="h-full w-full object-contain p-1" />
                             ) : (
                               <i className="fa-solid fa-image text-slate-300"></i>
                             )}
                           </div>
                         </td>
                         <td className="p-4">
                           <div className="font-bold text-gray-800">{p.Name}</div>
                           <div className="flex items-center mt-1">
                             <span className="bg-gray-100 text-gray-500 px-1.5 py-0.5 rounded text-[10px] font-mono mr-2">{p.ID}</span>
                             <span className="text-[10px] font-semibold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">{p.Category}</span>
                           </div>
                         </td>
                         <td className="p-4">
                            {p.Price && Number(p.Price) > 0 ? (
                              <>
                                <div className="text-gray-400 text-[11px] line-through mb-0.5">Rp {Number(p.Cost_Price || 0).toLocaleString('id-ID')}</div>
                                <div className="text-gray-800 font-bold">Rp {Number(p.Price).toLocaleString('id-ID')}</div>
                              </>
                            ) : (
                              <span className="text-red-400 text-xs font-semibold italic">Belum diatur</span>
                            )}
                         </td>
                         <td className="p-4">
                            {p.Harga_Jumbo && Number(p.Harga_Jumbo) > 0 ? (
                              <>
                                <div className="text-gray-400 text-[11px] line-through mb-0.5">Rp {Number(p.Cost_Price_Jumbo || 0).toLocaleString('id-ID')}</div>
                                <div className="text-orange-600 font-bold">Rp {Number(p.Harga_Jumbo).toLocaleString('id-ID')}</div>
                              </>
                            ) : (
                              <span className="text-gray-300 text-xs italic">-</span>
                            )}
                         </td>
                         <td className="p-4 text-center">
                           {!readOnly && (
                             <>
                               <button onClick={() => openModal('edit', p)} className="text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 w-8 h-8 rounded-lg mr-2 transition-colors" title="Edit Produk"><i className="fa-solid fa-pen-to-square"></i></button>
                               {!hideDeleteForAdmin && (
                                 <button onClick={() => handleDelete(p.ID, p.Name)} className="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 w-8 h-8 rounded-lg transition-colors" title="Hapus Produk"><i className="fa-solid fa-trash-can"></i></button>
                               )}
                             </>
                           )}
                         </td>
                       </tr>
                     ))
                   )}
                 </tbody>
               </table>
             </div>
           </div>
         </div>
       );
    }

    function EmployeeManagerView() {
       const [users, setUsers] = useState([]);
       const [branches, setBranches] = useState([]);
       const [loading, setLoading] = useState(true);
       const notify = useNotification();
       
       const [modal, setModal] = useState({ isOpen: false, mode: 'add' });
       const [formData, setFormData] = useState({ Name: '', Username: '', Password: '', Role: 'Kasir', Branch_ID: '' });

       const loadUsers = () => {
         setLoading(true);
         Promise.all([
           cachedFetch('employees', () => runGoogleScript('getEmployees')),
           runGoogleScript('getBranches')
         ]).then(([userData, branchData]) => {
           setUsers(userData || []);
           setBranches(branchData || []);
           setLoading(false);
         }).catch(err => {
           setLoading(false);
           notify.alert("Gagal memuat daftar pegawai dari server Google Sheets.", "Kesalahan Memuat", "error");
         });
       };

       useEffect(() => { loadUsers(); }, []);

       const getBranchName = (id) => { const b = branches.find(x => x.ID === id); return b ? b.Name : '-'; };

       const openModal = (mode = 'add', employee = null) => {
         if (mode === 'edit' && employee) {
           setFormData({
             Name: employee.Name || '',
             Username: employee.Username || '',
             Password: '',
             Role: employee.Role || 'Kasir',
             Branch_ID: employee.Branch_ID || (branches.length > 0 ? branches[0].ID : '')
           });
         } else {
           setFormData({ Name: '', Username: '', Password: '', Role: 'Kasir', Branch_ID: branches.length > 0 ? branches[0].ID : '' });
         }
         setModal({ isOpen: true, mode });
       };

       const handleSave = async (e) => {
         e.preventDefault();
         const btn = e.target.querySelector('button[type="submit"]');
         const originalText = btn.innerHTML;
         btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...';
         btn.disabled = true;

         const sanitizedUsername = formData.Username.trim().toLowerCase().replace(/\s+/g, '');
         const updatedFormData = { ...formData, Username: sanitizedUsername };

         const res = await runGoogleScript('manageEmployee', modal.mode, updatedFormData);
         if (res.success) {
           invalidateCache('employees');
           setModal({ isOpen: false, mode: 'add' });
           loadUsers();
           notify.alert(`Pegawai "${formData.Name}" berhasil disimpan!`, "Pegawai Disimpan", "success");
         } else {

         btn.disabled = false;

         notify.confirm(`Apakah Anda yakin ingin menghapus akun pegawai "${name}" (${username})?\nAktivitas absensi dan login untuk akun ini akan dicabut selamanya.`, async () => {
           const res = await runGoogleScript('manageEmployee', 'delete', { Username: username });
           if (res.success) {
             invalidateCache('employees');
             loadUsers();
             notify.alert(`Pegawai "${name}" berhasil dihapus dari sistem.`, "Pegawai Dihapus", "success");

       return (

           {modal.isOpen && (

               <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm transform animate-fade-in-up max-h-[90vh] overflow-y-auto">

                     <input type="text" required value={formData.Name} onChange={e => setFormData({...formData, Name: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="Misal: Budi Santoso" />
                   </div>
                   <div>
                     <label className="block text-sm font-semibold text-gray-700 mb-1">Username Login</label>
                     <input type="text" required readOnly={modal.mode === 'edit'} value={formData.Username} onChange={e => setFormData({...formData, Username: e.target.value})} className={`w-full px-3 py-2 border rounded-lg outline-none text-sm ${modal.mode === 'edit' ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'focus:ring-2 focus:ring-indigo-500'}`} placeholder="Misal: budi" />

                   </div>
                   <div>
                     <label className="block text-sm font-semibold text-gray-700 mb-1">Password {modal.mode === 'edit' && <span className="font-normal text-gray-400">(kosongkan jika tidak diubah)</span>}</label>
                     <input type="text" required={modal.mode === 'add'} value={formData.Password} onChange={e => setFormData({...formData, Password: e.target.value})} className="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder={modal.mode === 'edit' ? 'Kosongkan jika tetap sama' : 'Masukkan password'} />

                     <label className="block text-sm font-semibold text-gray-700 mb-1">Role / Hak Akses</label>

                         {branches.length === 0 && <option value="">Belum ada cabang</option>}

                       <p className="text-[10px] text-gray-400 mt-1">Pegawai ini hanya bisa login di cabang yang dipilih di sini.</p>

                   {/* DYNAMIC ROLE DESCRIPTION */}
                   <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-100 text-xs text-slate-600 leading-relaxed transition-all">
                     {formData.Role === 'Owner' && (
                       <div>

                         <p>Sebagai pemegang kendali tertinggi, owner memiliki hak akses tak terbatas (full access) ke semua fitur dan data pada sistem bisnis Anda.</p>
                       </div>
                     )}
                     {(formData.Role === 'Administrator' || formData.Role === 'Rekan Bisnis') && (
                       <div>
                         <p className="font-bold text-slate-800 mb-1"><i className="fa-solid fa-user-shield text-indigo-500 mr-1.5"></i>Rekan Bisnis (Kerja Sama Kelola Outlet)</p>
                         <p>Cocok untuk rekan yang sama-sama mengelola satu outlet secara kerja sama. Dapat akses penuh ke Laporan Analitik, Laba Rugi, Nilai Persediaan, Semua Transaksi, Kelola Produk, Inventory (ringkasan, riwayat, pemakaian bahan), serta Riwayat Absensi & Rekap Gaji — tapi tetap terkunci ke 1 cabang yang sama, dan tidak bisa mengubah pengaturan sistem atau data pegawai.</p>
                       </div>
                     )}
                     {formData.Role === 'Kasir' && (
                       <div>
                         <p className="font-bold text-slate-800 mb-1"><i className="fa-solid fa-cash-register text-emerald-500 mr-1.5"></i>Kasir (Pelayanan Transaksi)</p>
                         <p>Peran ini dikhususkan bagi karyawan yang melayani transaksi langsung dengan pelanggan. Akses kasir dibatasi demi keamanan.</p>
                       </div>
                     )}
                   </div>

                   <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl mt-6 shadow-md transition-colors">Simpan Pegawai</button>
                 </form>
               </div>
             </div>
           )}

           <div className="flex justify-between items-center mb-6">
              <div>
                <h2 className="text-2xl font-bold text-gray-800">Daftar Pegawai & Akses</h2>
                <p className="text-gray-500 text-sm mt-1 col">Kelola staf kasir, administrator, dan pemilik yang diizinkan mengoperasikan sistem.</p>
              </div>
              <button onClick={() => openModal('add')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md flex items-center transition-all"><i className="fa-solid fa-user-plus mr-2"></i>Tambah Pegawai</button>
           </div>
           
           <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 flex flex-col">
             <div className="overflow-auto flex-1">
               <table className="w-full text-left text-sm whitespace-nowrap">
                 <thead className="bg-gray-50 border-b sticky top-0 z-10">

                     <th className="p-4 font-semibold text-gray-600">Nama Pegawai</th>
                     <th className="p-4 font-semibold text-gray-600">Username</th>
                     <th className="p-4 font-semibold text-gray-600">Role Akses</th>
                     <th className="p-4 font-semibold text-gray-600">Cabang</th>
                     <th className="p-4 font-semibold text-gray-600 text-center w-32">Aksi</th>

                     <tr><td colSpan="5" className="p-12 text-center text-gray-400"><i className="fa-solid fa-spinner fa-spin text-xl mr-2"></i>Memuat tim...</td></tr>

                     <tr><td colSpan="5" className="p-12 text-center text-gray-400">Belum ada pegawai terdaftar.</td></tr>

                     users.map((u, i) => (
                       <tr key={i} className="border-b border-gray-50 hover:bg-slate-50 transition-colors">
                         <td className="p-4 font-bold text-gray-800">{u.Name}</td>

                             u.Role === 'Owner' ? 'bg-emerald-100 text-emerald-700' : 
                             (u.Role === 'Administrator' || u.Role === 'Rekan Bisnis') ? 'bg-indigo-100 text-indigo-700' :

                               <i className="fa-solid fa-trash-can"></i>

    // ==========================================
    // PEMELIHARAAN DATA (Arsip Transaksi Lama & Backup Spreadsheet)
    // ==========================================
    // ==========================================
    // KARTU "LOGIN OFFLINE UNTUK PEGAWAI" (khusus Owner, di menu Pemeliharaan Data).
    // Owner menyiapkan tablet ini SATU KALI saat online; sesudahnya pegawai outlet bisa
    // login di tablet ini walau tidak ada internet, termasuk yang belum pernah login di sini.
    // ==========================================
    function OfflineLoginSetupCard({ user, branch }) {
      const [branches, setBranches] = useState([]);
      const [branchId, setBranchId] = useState(branch && branch.ID && branch.ID !== 'ALL' ? branch.ID : '');
      const [password, setPassword] = useState('');
      const [busy, setBusy] = useState(false);
      const [message, setMessage] = useState(null); // { type: 'ok' | 'warn' | 'error', text }
      const [accounts, setAccounts] = useState([]);
      const supported = offlineLoginAvailable();

      const refreshAccounts = () => { listOfflineLoginAccounts().then(setAccounts).catch(() => {}); };

      useEffect(() => {
        refreshAccounts();
        runGoogleScript('getBranches').then(d => {
          setBranches(d || []);
          setBranchId(prev => prev || (d && d.length > 0 ? d[0].ID : ''));
        }).catch(() => {});
      }, []);

      const fmtDate = (ts) => new Date(ts).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

      const handleSetup = async (e) => {
        e.preventDefault();
        if (!password || !branchId) return;
        setBusy(true);
        setMessage(null);
        try {
          const res = await runGoogleScript('getOfflineLoginMaterial', user.username, password, branchId);
          if (!res || !res.success) {
            setMessage({ type: 'error', text: (res && res.message) || 'Gagal menyiapkan login offline.' });
          } else {
            const out = await provisionOfflineLogin(res.accounts || [], branchId);
            // Sekalian simpan data kerja outlet ini (produk, kategori, bahan, pengaturan,
            // riwayat stok) supaya kasir yang masuk pertama kali dalam keadaan offline
            // langsung punya menu untuk berjualan, bukan layar kosong. Foto produk
            // diunduh di latar belakang setelahnya.
            await Promise.all([
              runGoogleScript('getProducts', branchId),
              runGoogleScript('getCategories'),
              runGoogleScript('getIngredients', branchId),
              runGoogleScript('getSettings'),
              runGoogleScript('getRecentStockMovements', branchId, 300, 'Semua', true)
            ].map(pr => Promise.resolve(pr).catch(() => {})));
            if (out.added === 0) {
              setMessage({ type: 'warn', text: 'Tidak ada akun pegawai untuk outlet ini.' + (out.removed > 0 ? ' ' + out.removed + ' akun lama dihapus dari tablet ini.' : '') });
            } else {
              setMessage({ type: 'ok', text: out.added + ' akun pegawai siap login offline di tablet ini (' + out.names.join(', ') + '). Data produk outlet ikut disimpan; foto produk menyusul beberapa saat. Berlaku 30 hari.' + (out.removed > 0 ? ' ' + out.removed + ' akun lama yang sudah tidak terdaftar dihapus dari tablet ini.' : '') });
            }
            setPassword('');
          }
        } catch (err) {
          setMessage({ type: 'error', text: (err && err.serverError) ? 'Server menolak permintaan: ' + err.message : 'Tidak ada koneksi internet. Penyiapan hanya bisa dilakukan saat tablet online.' });
        }
        refreshAccounts();
        setBusy(false);
      };

      return (
        <div className="bg-white rounded-2xl shadow-sm border p-6 mb-6">
          <div className="flex items-start justify-between mb-3 gap-3">
            <div>
              <h3 className="font-bold text-gray-800">Login Offline untuk Pegawai</h3>
              <p className="text-gray-500 text-xs mt-1 leading-relaxed">Siapkan tablet ini supaya pegawai outlet bisa login walau tidak ada internet, termasuk yang belum pernah login di tablet ini. Lakukan sekali saat tablet online; berlaku 30 hari. Ulangi kalau ada pegawai baru, password diganti, atau pegawai berhenti.</p>
            </div>
            <div className="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0 bg-indigo-50">
              <i className="fa-solid fa-user-lock text-xl text-indigo-500"></i>
            </div>
          </div>

          {!supported ? (
            <p className="text-amber-600 text-sm font-semibold"><i className="fa-solid fa-triangle-exclamation mr-1.5"></i>Browser ini tidak mendukung login offline.</p>
          ) : (
            <form onSubmit={handleSetup} className="space-y-3">
              {branches.length > 1 && (
                <div>
                  <label className="block text-xs font-bold text-gray-600 mb-1">Outlet</label>
                  <select value={branchId} onChange={e => setBranchId(e.target.value)} className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                    {branches.map(b => <option key={b.ID} value={b.ID}>{b.Name}</option>)}
                  </select>
                </div>
              )}
              <div>
                <label className="block text-xs font-bold text-gray-600 mb-1">Password Owner (untuk konfirmasi)</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} autoComplete="current-password" className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ketik ulang password Anda" />
              </div>
              <button type="submit" disabled={busy || !password || !branchId} className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition-colors">
                {busy ? <i className="fa-solid fa-spinner fa-spin"></i> : <span><i className="fa-solid fa-user-lock mr-1.5"></i>Siapkan Login Offline</span>}
              </button>
            </form>
          )}

          {message && (
            <div className={`mt-3 text-sm font-semibold px-3 py-2 rounded-lg ${message.type === 'ok' ? 'bg-emerald-50 text-emerald-700' : message.type === 'warn' ? 'bg-amber-50 text-amber-700' : 'bg-red-50 text-red-600'}`}>{message.text}</div>
          )}

          <div className="mt-4 pt-4 border-t">
            <p className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Akun yang bisa login offline di tablet ini</p>
            {accounts.length === 0 ? (
              <p className="text-sm text-gray-400">Belum ada.</p>
            ) : (
              <div className="space-y-1.5">
                {accounts.map(a => (
                  <div key={a.username} className="flex items-center justify-between text-sm bg-slate-50 rounded-lg px-3 py-2 gap-3">
                    <span className="font-semibold text-gray-700 truncate">{a.name} <span className="text-gray-400 font-normal">({a.username}) · {a.role}</span></span>
                    <span className={`text-xs font-bold flex-shrink-0 ${a.expired ? 'text-red-500' : 'text-gray-400'}`}>{a.expired ? 'Kedaluwarsa' : 'sampai ' + fmtDate(a.validUntil)}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function DataMaintenanceView({ user, branch }) {
      const [status, setStatus] = useState({ archiveEnabled: false, backupEnabled: false, totalTransactionRows: 0, totalStockMovementRows: 0, totalAttendanceRows: 0, estimatedTotalCells: 0, archiveUrl: '', archiveMonths: 3 });
      const [loading, setLoading] = useState(true);
      const [archiving, setArchiving] = useState(false);
      const [backingUp, setBackingUp] = useState(false);
      const [togglingArchive, setTogglingArchive] = useState(false);
      const [togglingBackup, setTogglingBackup] = useState(false);
      const [monthsInput, setMonthsInput] = useState('3');
      const [savingMonths, setSavingMonths] = useState(false);
      const notify = useNotification();

      const loadStatus = () => {
        setLoading(true);
        runGoogleScript('getMaintenanceStatus').then(data => {
          setStatus(data || status);
          setMonthsInput(String((data && data.archiveMonths) || 3));
          setLoading(false);
        }).catch(() => setLoading(false));
      };
      useEffect(() => { loadStatus(); }, []);

      const CELL_LIMIT = 10000000; // batas resmi Google Sheets per file
      const usagePercent = Math.min(100, (status.estimatedTotalCells / CELL_LIMIT) * 100);
      const usageLevel = usagePercent >= 80 ? 'danger' : usagePercent >= 50 ? 'warning' : 'safe';

      const handleSaveMonths = async () => {
        const val = Number(monthsInput);
        if (!val || val < 1 || val > 24) {
          notify.alert("Isi jumlah bulan antara 1 - 24.", "Data Tidak Valid", "error");
          return;
        }
        setSavingMonths(true);
        try {
          const res = await runGoogleScript('saveArchiveMonthsSetting', val);
          if (res.success) {
            setStatus(prev => ({ ...prev, archiveMonths: res.months }));
            notify.alert(`Pengaturan disimpan: data ${res.months} bulan terakhir akan tetap ada di file utama.`, "Berhasil", "success");
          } else {
            notify.alert(res.message, "Gagal", "error");
          }
        } catch (e) {
          notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
        }
        setSavingMonths(false);
      };

      const handleArchiveNow = () => {
        const months = status.archiveMonths || 3;
        notify.confirm(`Arsipkan Transaksi, Riwayat Stok, dan Absensi yang lebih lama dari ${months} bulan? Data TIDAK hilang — dipindahkan ke file Spreadsheet TERPISAH ("... - Arsip Data Lama"), lalu dihapus dari file utama supaya kuota sel benar-benar hemat.`, async () => {
          setArchiving(true);
          try {
            const res = await runGoogleScript('archiveAllOldData', months);
            if (res.success) {
              const totalArchived = res.transactions.archivedCount + res.stockMovements.archivedCount + res.attendance.archivedCount;
              notify.alert(`${totalArchived} baris data lama berhasil dipindahkan ke file arsip terpisah (Transaksi: ${res.transactions.archivedCount}, Riwayat Stok: ${res.stockMovements.archivedCount}, Absensi: ${res.attendance.archivedCount}).`, "Arsip Berhasil", "success");
              loadStatus();
            } else {
              notify.alert("Gagal mengarsipkan: " + res.message, "Gagal", "error");
            }
          } catch (e) {
            notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
          }
          setArchiving(false);
        });
      };

      const handleToggleArchive = async () => {
        setTogglingArchive(true);
        try {
          const res = await runGoogleScript('manageArchiveTrigger', status.archiveEnabled ? 'disable' : 'enable');
          if (res.success) {
            setStatus(prev => ({ ...prev, archiveEnabled: res.enabled }));
            notify.alert(res.enabled ? "Arsip otomatis diaktifkan. Akan jalan sendiri tiap tanggal 1 jam 3 pagi." : "Arsip otomatis dimatikan.", "Berhasil", "success");
          } else {
            notify.alert("Gagal mengubah pengaturan: " + res.message, "Gagal", "error");
          }
        } catch (e) {
          notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
        }
        setTogglingArchive(false);
      };

      const handleBackupNow = async () => {
        setBackingUp(true);
        try {
          const res = await runGoogleScript('createSpreadsheetBackup');
          if (res.success) {
            notify.alert(`Backup berhasil dibuat: "${res.backupName}"`, "Backup Berhasil", "success");
          } else {
            notify.alert("Gagal membuat backup: " + res.message, "Gagal", "error");
          }
        } catch (e) {
          notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
        }
        setBackingUp(false);
      };

    function BranchManagerView() {

      const [formData, setFormData] = useState({ ID: '', Name: '' });
      const notify = useNotification();

      const loadData = () => {
        setLoading(true);
        runGoogleScript('getBranches').then(data => { setBranches(data || []); setLoading(false); }).catch(() => setLoading(false));
      };
      useEffect(() => { loadData(); }, []);

      const openModal = (mode, item = null) => {
        if (mode === 'edit' && item) setFormData({ ...item });
        else setFormData({ ID: 'BR' + String(branches.length + 1).padStart(3, '0'), Name: '' });
        setModal({ isOpen: true, mode });
      };

      const handleSave = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...';
        btn.disabled = true;
        const res = await runGoogleScript('manageBranch', modal.mode, formData);
        if (res.success) {
          setModal({ isOpen: false, mode: 'add' });
          loadData();
          notify.alert(`Cabang "${formData.Name}" berhasil disimpan!`, "Tersimpan", "success");
        } else {
          notify.alert("Gagal: " + res.message, "Gagal Simpan", "error");
        }
        btn.innerHTML = originalText; btn.disabled = false;
      };

      const handleDelete = async (id, name) => {
        notify.confirm(`Hapus cabang "${name}"? Data lama (transaksi/stok) milik cabang ini TIDAK akan ikut terhapus, hanya daftar cabangnya saja.`, async () => {
          const res = await runGoogleScript('manageBranch', 'delete', { ID: id });
          if (res.success) { loadData(); notify.alert(`"${name}" berhasil dihapus.`, "Terhapus", "success"); }
          else notify.alert("Gagal: " + res.message, "Gagal Hapus", "error");
        });
      };

      return (
        <div className="p-6 h-full flex flex-col">
          {modal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 border-b pb-3">
                  <h3 className="font-bold text-xl text-gray-800">{modal.mode === 'add' ? 'Tambah Cabang' : 'Edit Cabang'}</h3>
                  <button onClick={() => setModal({ isOpen: false, mode: 'add' })} className="text-gray-400 hover:bg-gray-100 w-8 h-8 rounded-full"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <form onSubmit={handleSave} className="space-y-3">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">ID Cabang</label>
                    <input type="text" value={formData.ID} readOnly className="w-full px-3 py-2 border rounded-lg bg-gray-100 text-gray-500 font-mono text-sm" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">Nama Cabang</label>
                    <input type="text" required value={formData.Name} onChange={e => setFormData({...formData, Name: e.target.value})} className="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Misal: Cabang Kota Bangun" />
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl mt-4 shadow-md transition-colors">Simpan</button>
                </form>
              </div>
            </div>
          )}

          <div className="flex justify-between items-center mb-6">
            <div>
              <h2 className="text-2xl font-bold text-gray-800">Manajemen Cabang</h2>
              <p className="text-gray-500 text-sm mt-1">Kelola daftar cabang. Setiap cabang punya stok bahan baku, resep, transaksi, dan absensi sendiri-sendiri.</p>
            </div>
            <button onClick={() => openModal('add')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-md flex items-center transition-colors flex-shrink-0"><i className="fa-solid fa-plus mr-2"></i>Tambah Cabang</button>
          </div>

          <div className="bg-white rounded-xl shadow-sm border overflow-hidden flex-1 flex flex-col max-w-2xl">
            <div className="overflow-auto flex-1">
              <table className="w-full text-left text-sm whitespace-nowrap">
                <thead className="bg-gray-50 border-b sticky top-0 z-10">
                  <tr>
                    <th className="p-4 font-semibold text-gray-600 w-28">ID</th>
                    <th className="p-4 font-semibold text-gray-600">Nama Cabang</th>
                    <th className="p-4 font-semibold text-gray-600 text-center w-24">Aksi</th>
                  </tr>
                </thead>
                <tbody>
                  {loading ? (
                    <tr><td colSpan="3" className="p-12 text-center text-gray-400">Memuat...</td></tr>
                  ) : branches.length === 0 ? (
                    <tr><td colSpan="3" className="p-12 text-center text-gray-400">Belum ada cabang.</td></tr>
                  ) : (
                    branches.map(b => (
                      <tr key={b.ID} className="border-b border-gray-50 hover:bg-slate-50">
                        <td className="p-4 text-gray-500 font-mono">{b.ID}</td>
                        <td className="p-4 font-bold text-gray-800">{b.Name}</td>
                        <td className="p-4 text-center">
                          <button onClick={() => openModal('edit', b)} className="text-blue-600 hover:text-blue-800 bg-blue-50 w-8 h-8 rounded-lg mr-2 transition-colors"><i className="fa-solid fa-pen-to-square"></i></button>
                          <button onClick={() => handleDelete(b.ID, b.Name)} className="text-red-500 hover:text-red-700 bg-red-50 w-8 h-8 rounded-lg transition-colors"><i className="fa-solid fa-trash-can"></i></button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

        setSubTab(tab);
        setVisitedSubTabs(prev => prev.has(tab) ? prev : new Set(prev).add(tab));
      };

        <div className="h-full" style={{ display: subTab === tabKey ? 'block' : 'none' }}>{node}</div>
      ) : null;

      useEffect(() => {
        runGoogleScript('getBranches').then(data => setBranchList(data || [])).catch(() => {});

            if (res.success) {
              setCopyResult(res);
              invalidateCache('ingredients_' + (branch ? branch.ID : 'BR001'));
              invalidateCache('recipes_' + (branch ? branch.ID : 'BR001'));
              invalidateCache('prodrecipes_' + (branch ? branch.ID : 'BR001'));

          setCopying(false);

                    <button onClick={handleCopy} disabled={copying || !copySourceBranchId} className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white font-bold py-3 rounded-xl mt-4 transition-colors">

      // Kalkulator bantu saja (tidak disimpan ke database) — begitu diisi, otomatis
      // hitung & isi kolom Harga/Satuan, supaya Owner tidak perlu bagi manual sendiri.

    function RecipeManagerView({ branch, readOnly }) {
      const [products, setProducts] = useState([]);
      const [ingredients, setIngredients] = useState([]);
      const [recipes, setRecipes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedProductId, setSelectedProductId] = useState('');
      const [modal, setModal] = useState({ isOpen: false, mode: 'add' });
      const [formData, setFormData] = useState({ ID: '', Product_ID: '', Ingredient_ID: '', Qty_Medium: '', Qty_Jumbo: '' });
      const notify = useNotification();
      const branchId = branch ? branch.ID : 'BR001';

      const loadData = () => {
        setLoading(true);
        Promise.all([cachedFetch('products_' + branchId, () => runGoogleScript('getProducts', branchId)), cachedFetch('ingredients_' + branchId, () => runGoogleScript('getIngredients', branchId)), cachedFetch('recipes_' + branchId, () => runGoogleScript('getRecipes', branchId))])
          .then(([p, ing, rec]) => {
            setProducts(p || []); setIngredients(ing || []); setRecipes(rec || []);
            setLoading(false);
            // SENGAJA tidak auto-pilih produk pertama — biar HPP & detail resep
            // cuma muncul setelah Owner benar-benar memilih produknya sendiri.
          }).catch(() => setLoading(false));
      };
      useEffect(() => { loadData(); }, [branchId]);

      const selectedProduct = products.find(p => p.ID === selectedProductId);
      const productRecipes = recipes.filter(r => r.Product_ID === selectedProductId);
      const getIngredientName = (id) => { const ing = ingredients.find(i => i.ID === id); return ing ? ing.Name : id; };
      const getIngredientUnit = (id) => { const ing = ingredients.find(i => i.ID === id); return ing ? ing.Unit : ''; };

      // HPP (Harga Pokok Penjualan) per gelas dihitung dari total biaya semua bahan
      // di resep, dikalikan takaran pemakaiannya masing-masing varian. Laba Kotor
      // dan Margin otomatis ikut, supaya Owner langsung lihat untung-rugi tiap
      // produk tanpa perlu hitung manual di luar aplikasi.
      const calcHpp = (qtyField) => {
        return productRecipes.reduce((sum, r) => {
          const ing = ingredients.find(i => i.ID === r.Ingredient_ID);
          const costPerUnit = ing ? Number(ing.Cost_Per_Unit) || 0 : 0;
          const qty = Number(r[qtyField]) || 0;
          return sum + (costPerUnit * qty);
        }, 0);
      };
      const hppMedium = calcHpp('Qty_Medium');
      const hppJumbo = calcHpp('Qty_Jumbo');
      const hargaMedium = selectedProduct ? Number(selectedProduct.Price) || 0 : 0;
      const hargaJumbo = selectedProduct ? Number(selectedProduct.Harga_Jumbo) || 0 : 0;
      const labaMedium = hargaMedium - hppMedium;
      const labaJumbo = hargaJumbo - hppJumbo;
      const marginMedium = hargaMedium > 0 ? (labaMedium / hargaMedium) * 100 : 0;
      const marginJumbo = hargaJumbo > 0 ? (labaJumbo / hargaJumbo) * 100 : 0;

      const openModal = (mode, item = null) => {
        if (mode === 'edit' && item) setFormData({ ...item });
        else setFormData({ ID: '', Product_ID: selectedProductId, Ingredient_ID: ingredients.length > 0 ? ingredients[0].ID : '', Qty_Medium: '', Qty_Jumbo: '' });
        setModal({ isOpen: true, mode });
      };

      const handleSave = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...';
        btn.disabled = true;
        const res = await runGoogleScript('manageRecipe', modal.mode, { ...formData, Branch_ID: branchId });
        if (res.success) {
          invalidateCache('recipes_' + branchId);
          setModal({ isOpen: false, mode: 'add' });
          loadData();
          notify.alert("Resep berhasil disimpan!", "Tersimpan", "success");
        } else {
          notify.alert("Gagal: " + res.message, "Gagal Simpan", "error");
        }
        btn.innerHTML = originalText; btn.disabled = false;
      };

      const handleDelete = async (id) => {
        notify.confirm("Hapus komposisi bahan ini dari resep?", async () => {
          const res = await runGoogleScript('manageRecipe', 'delete', { ID: id });
          if (res.success) { invalidateCache('recipes_' + branchId); loadData(); notify.alert("Berhasil dihapus.", "Terhapus", "success"); }
          else notify.alert("Gagal menghapus.", "Gagal", "error");
        });
      };

      if (!loading && products.length === 0) {
        return <div className="p-12 text-center text-gray-400">Belum ada produk di Katalog Produk. Tambahkan produk dulu sebelum membuat resep.</div>;
      }

      return (
        <div className="h-full flex flex-col">
          {modal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 border-b pb-3">
                  <h3 className="font-bold text-xl text-gray-800">{modal.mode === 'add' ? 'Tambah Bahan ke Resep' : 'Edit Komposisi Bahan'}</h3>
                  <button onClick={() => setModal({ isOpen: false, mode: 'add' })} className="text-gray-400 hover:bg-gray-100 w-8 h-8 rounded-full"><i className="fa-solid fa-xmark"></i></button>
                </div>
                {ingredients.length === 0 ? (

    function ProductionRecipeManagerView({ branch, readOnly }) {
      const [ingredients, setIngredients] = useState([]);
      const [productionRecipes, setProductionRecipes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [selectedOutputId, setSelectedOutputId] = useState('');
      const [modal, setModal] = useState({ isOpen: false, mode: 'add' });
      const [formData, setFormData] = useState({ ID: '', Output_Ingredient_ID: '', Component_Ingredient_ID: '', Component_Qty: '' });
      const [recalculating, setRecalculating] = useState(false);
      const [recalcResult, setRecalcResult] = useState(null);
      const notify = useNotification();
      const branchId = branch ? branch.ID : 'BR001';

      const loadData = () => {
        setLoading(true);
        Promise.all([cachedFetch('ingredients_' + branchId, () => runGoogleScript('getIngredients', branchId)), cachedFetch('prodrecipes_' + branchId, () => runGoogleScript('getProductionRecipes', branchId))])
          .then(([ing, rec]) => {
            setIngredients(ing || []);
            setProductionRecipes(rec || []);
            setLoading(false);
            const outputCandidates = (ing || []).filter(i => Number(i.Batch_Yield) > 0);
            setSelectedOutputId(prev => prev || (outputCandidates.length > 0 ? outputCandidates[0].ID : ''));
          }).catch(() => setLoading(false));
      };
      useEffect(() => { loadData(); }, [branchId]);

      const outputCandidates = ingredients.filter(i => Number(i.Batch_Yield) > 0);
      const selectedOutput = ingredients.find(i => i.ID === selectedOutputId);
      const components = productionRecipes.filter(r => r.Output_Ingredient_ID === selectedOutputId);
      const getIngredientName = (id) => { const ing = ingredients.find(i => i.ID === id); return ing ? ing.Name : id; };
      const getIngredientUnit = (id) => { const ing = ingredients.find(i => i.ID === id); return ing ? ing.Unit : ''; };

      const openModal = (mode, item = null) => {
        if (mode === 'edit' && item) setFormData({ ...item });
        else setFormData({ ID: '', Output_Ingredient_ID: selectedOutputId, Component_Ingredient_ID: ingredients.length > 0 ? ingredients[0].ID : '', Component_Qty: '' });
        setModal({ isOpen: true, mode });
      };

      const handleSave = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Menyimpan...';
        btn.disabled = true;
        const res = await runGoogleScript('manageProductionRecipe', modal.mode, { ...formData, Branch_ID: branchId });
        if (res.success) {
          invalidateCache('prodrecipes_' + branchId);
          setModal({ isOpen: false, mode: 'add' });
          loadData();
          notify.alert("Komposisi racikan berhasil disimpan!", "Tersimpan", "success");
        } else {
          notify.alert("Gagal: " + res.message, "Gagal Simpan", "error");
        }
        btn.innerHTML = originalText; btn.disabled = false;
      };

      const handleDelete = async (id) => {
        notify.confirm("Hapus bahan ini dari komposisi racikan?", async () => {
          const res = await runGoogleScript('manageProductionRecipe', 'delete', { ID: id });
          if (res.success) { invalidateCache('prodrecipes_' + branchId); loadData(); notify.alert("Berhasil dihapus.", "Terhapus", "success"); }
          else notify.alert("Gagal menghapus.", "Gagal", "error");
        });
      };

      const handleRecalculate = async () => {
        if (!selectedOutputId) return;
        setRecalculating(true);
        setRecalcResult(null);
        try {
          const res = await runGoogleScript('recalculateIngredientCost', selectedOutputId);
          if (res.success) {
            setRecalcResult(res);
            invalidateCache('ingredients_' + branchId);
            loadData();
          } else {
            notify.alert(res.message, "Belum Bisa Dihitung", "error");
          }
        } catch (e) {
          notify.alert("Terjadi kesalahan koneksi.", "Error", "error");
        }
        setRecalculating(false);
      };

      useEffect(() => { setRecalcResult(null); }, [selectedOutputId]);

      if (!loading && outputCandidates.length === 0) {
        return (
          <div className="p-8 text-center text-gray-400 bg-white rounded-xl border">
            Belum ada bahan olahan/racikan. Buka tab "Bahan Baku", edit atau tambah bahan (misal "Air Teh Ori"), lalu isi kolom biru "Bahan Olahan / Racikan &gt; Hasil per Sekali Produksi/Masak" dulu.
          </div>
        );
      }

      return (
        <div className="h-full flex flex-col">
          {modal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4 border-b pb-3">
                  <h3 className="font-bold text-xl text-gray-800">{modal.mode === 'add' ? 'Tambah Bahan Mentah' : 'Edit Komposisi'}</h3>

                </div>
                <form onSubmit={handleSave} className="space-y-3">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">Bahan Mentah</label>
                    <SearchableSelect
                      options={ingredients}
                      value={formData.Component_Ingredient_ID}
                      onChange={id => setFormData({...formData, Component_Ingredient_ID: id})}
                      placeholder="Ketik untuk cari bahan mentah..."
                      getValue={ing => ing.ID}
                      getLabel={ing => `${ing.Name} (${ing.Unit})`}
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-1">Jumlah Dipakai per 1x Masak</label>
                    <DecimalInput value={formData.Component_Qty} onChange={v => setFormData({...formData, Component_Qty: v})} className="w-full px-3 py-2 border rounded-lg text-sm" placeholder="0" />
                  </div>
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl mt-4 shadow-md">Simpan</button>
                </form>
              </div>
            </div>
          )}

          <div className="flex flex-wrap items-center gap-3 mb-4 flex-shrink-0">
            <label className="text-sm font-bold text-gray-700">Bahan Olahan:</label>
            <select value={selectedOutputId} onChange={e => setSelectedOutputId(e.target.value)} className="px-3 py-2 border rounded-lg text-sm bg-white font-semibold min-w-[200px]">
              {outputCandidates.map(ing => <option key={ing.ID} value={ing.ID}>{ing.Name}</option>)}
            </select>
            {!readOnly && (
              <button onClick={() => openModal('add')} disabled={!selectedOutputId} className="ml-auto bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-300 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md flex items-center transition-colors"><i className="fa-solid fa-plus mr-2"></i>Tambah Bahan Mentah</button>
            )}
          </div>

          {selectedOutput && (
            <div className="bg-sky-50 border border-sky-100 rounded-xl p-3 mb-4 text-sm text-sky-700 font-semibold flex flex-wrap items-center justify-between gap-2 flex-shrink-0">
              <span><i className="fa-solid fa-circle-info mr-2"></i>1x masak "{selectedOutput.Name}" menghasilkan {Number(selectedOutput.Batch_Yield || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 })} {selectedOutput.Unit}</span>
              {!readOnly && (
                <button onClick={handleRecalculate} disabled={recalculating || components.length === 0} className="bg-sky-600 hover:bg-sky-700 disabled:bg-gray-300 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-colors flex-shrink-0">
                  {recalculating ? <i className="fa-solid fa-spinner fa-spin"></i> : <><i className="fa-solid fa-calculator mr-1.5"></i>Hitung & Terapkan Harga Otomatis</>}
                </button>
              )}
            </div>
          )}
