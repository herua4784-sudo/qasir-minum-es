<body>
  <div id="root"><div id="boot-msg" style="font-family:Arial,sans-serif;text-align:center;padding:48px 24px;color:#475569">Memuat aplikasi&hellip;</div></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    const NotificationContext = createContext(null);
    const useNotification = () => useContext(NotificationContext);

    // URL Web App GAS — WAJIB diisi (lihat catatan di bawah) begitu Index.html
    // di-hosting di LUAR Google Apps Script (misal GitHub Pages). Kosongkan
    // (biarkan string kosong) kalau Index.html masih dibuka langsung dari dalam
    // GAS seperti biasa — aplikasi otomatis pakai google.script.run tanpa perlu ini.
    //
    // CARA MENDAPATKAN URL-NYA:
    // 1. Di Apps Script Editor: Deploy > New deployment > pilih tipe "Web app"
    // 2. Execute as: "Me", Who has access: "Anyone"
    // 3. Klik Deploy, salin URL yang muncul (diakhiri "/exec")
    // 4. Tempel URL itu di bawah ini, lalu deploy ulang Index.html ke GitHub Pages
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbykq9jikOTBR5z6whSZg_p8u6Gq8GW0j0Obz0zWq_UE0HKKqrdUB3fU9YlpOXymvQxB/exec';

    // Token sesi dari server (diberikan saat login). Dibawa di setiap permintaan; server
    // memeriksanya. Sengaja DISIMPAN terus walau kasir logout, supaya data antrian offline
    // tetap bisa terkirim. Server menolak kalau sudah kedaluwarsa (30 hari) / password diganti.
    const AUTH_TOKEN_KEY = 'qasir_auth_token';
    const getAuthToken = () => { try { return localStorage.getItem(AUTH_TOKEN_KEY) || ''; } catch (e) { return ''; } };
    const setAuthToken = (t) => { try { if (t) localStorage.setItem(AUTH_TOKEN_KEY, t); } catch (e) {} };
    let _authExpiredFired = false;
    const notifyAuthExpired = () => {
      if (_authExpiredFired) return;
      _authExpiredFired = true;
      setTimeout(() => { _authExpiredFired = false; }, 5000);
      try { window.dispatchEvent(new Event('qasir-auth-expired')); } catch (e) {}
    };

    const runGoogleScriptRaw = (functionName, ...args) => {
      // Dijalankan DARI DALAM Google Apps Script (dibuka lewat script.google.com) —
      // tetap pakai google.script.run seperti sebelumnya, tidak ada yang berubah
      // dari cara kerja aplikasi selama ini.
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            [functionName](...args);
        });
      }

      // Dijalankan dari LUAR GAS (misal di-hosting di GitHub Pages) — panggil lewat
      // Web App API yang sudah disiapkan di Kode.gs (doPost/handleApiRequest).
      // Content-Type SENGAJA "text/plain" (bukan "application/json") supaya browser
      // tidak mengirim permintaan "preflight" OPTIONS lebih dulu — GAS Web App tidak
      // bisa menjawab preflight itu dengan benar, dan panggilannya akan gagal kena
      // CORS kalau preflight-nya terkirim.
      if (!GAS_WEB_APP_URL) {
        console.warn("GAS_WEB_APP_URL belum diisi, dan google.script.run tidak tersedia.");
        return Promise.reject("Aplikasi belum terhubung ke server. Hubungi Owner untuk mengisi GAS_WEB_APP_URL.");
      }
      if (typeof fetch === 'undefined') {
        console.warn("Browser ini tidak mendukung fetch().");
        return Promise.reject("Browser tidak didukung. Coba pakai Chrome/Edge/Safari versi terbaru.");
      }

      return fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(functionName === 'renewSession'
          ? { fn: functionName, args: [], token: String(args[0] || '') }
          : { fn: functionName, args: args, token: getAuthToken() })
      })
        .then(res => res.json())
        .then(result => {
          if (result && typeof result === 'object' && result !== null && result.__error) {
            const serverErr = new Error(result.__error);
            serverErr.serverError = true; // tandai: ini ditolak/gagal di SERVER, bukan putus koneksi
            if (result.__auth) { serverErr.authError = true; notifyAuthExpired(); } // token sesi ditolak server
            throw serverErr;
          }
          return result;
        });
    };

    // ==========================================
    // CACHE OFFLINE (IndexedDB): data penting (produk, harga, kategori, cabang)
    // disimpan PERMANEN di HP setiap kali berhasil dimuat saat online. Kalau
    // internet putus, aplikasi otomatis pakai data tersimpan terakhir ini, supaya
    // kasir tetap bisa lihat-lihat produk & harga walau tidak ada koneksi.
    // SENGAJA dibatasi ke data yang jarang berubah & bukan aksi/transaksi — bukan
    // untuk data transaksi (itu harus selalu real-time, tidak boleh "nyangkut" versi lama).
    // ==========================================
    const OFFLINE_CACHEABLE_FUNCTIONS = ['getProducts', 'getCategories', 'getBranches', 'getIngredients', 'getSettings', 'getTodayCashierTransactions', 'getTransactions', 'getTodayAttendance', 'getStockMovements', 'getRecentStockMovements'];
    const OFFLINE_DB_NAME = 'qasir_offline_cache';
    const OFFLINE_STORE_NAME = 'kv';
    const QUEUE_STORE_NAME = 'pending_writes';
    const OFFLINE_DB_VERSION = 2; // dinaikkan dari 1 -> 2 untuk menambah object store antrian

    function openOfflineDb() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) { reject('IndexedDB tidak didukung di browser ini'); return; }
        const req = indexedDB.open(OFFLINE_DB_NAME, OFFLINE_DB_VERSION);
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(OFFLINE_STORE_NAME)) {
            req.result.createObjectStore(OFFLINE_STORE_NAME);
          }
          if (!req.result.objectStoreNames.contains(QUEUE_STORE_NAME)) {
            req.result.createObjectStore(QUEUE_STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function offlineCacheGet(key) {
      return openOfflineDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE_NAME, 'readonly');
        const req = tx.objectStore(OFFLINE_STORE_NAME).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      })).catch(() => undefined);
    }

    function offlineCacheSet(key, value) {
      return openOfflineDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE_NAME, 'readwrite');
        const req = tx.objectStore(OFFLINE_STORE_NAME).put(value, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      })).catch(() => {}); // gagal simpan cache bukan error fatal, diamkan saja
    }

    // ==========================================
    // ANTRIAN TULIS OFFLINE (Lapisan 4): kalau kasir bikin transaksi atau absen saat
    // TIDAK ADA internet, datanya TIDAK hilang -- disimpan dulu di HP (IndexedDB),
    // aplikasi tetap menganggapnya "berhasil" (struk tetap bisa dicetak, keranjang
    // tetap kekosong seperti biasa), lalu OTOMATIS dikirim ke server begitu internet
    // kembali -- tanpa kasir perlu input ulang apapun.
    // ==========================================
    const OFFLINE_QUEUEABLE_FUNCTIONS = ['saveTransaction', 'recordAttendance', 'recordStockMovement'];

    // ==========================================
    // KUNCI ANTI-GANDA: tiap permintaan tulis diberi "kunci unik" SEKALI saat pertama
    // dibuat, lalu kunci yang sama dipakai di SEMUA percobaan kirim (langsung maupun
    // dari antrian). Server mengenali kunci itu: kalau permintaan sudah pernah
    // tersimpan (misal internet putus tepat sebelum balasan sampai), kiriman ulang
    // tidak ditulis dua kali. Kunci diletakkan sebagai argumen TERAKHIR; jumlah
    // argumen baku tiap fungsi dicatat di bawah supaya posisinya selalu tepat.
    // ==========================================
    const QUEUEABLE_ARITY = { saveTransaction: 9, recordAttendance: 4, recordStockMovement: 8 };

    function newRequestId() {
      try { if (crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* lanjut ke cara cadangan */ }
      return 'R' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8);
    }

    // Tambahkan kunci kalau belum ada (aman dipanggil berulang: yang sudah punya kunci tidak diubah).
    function withRequestId(functionName, args) {
      const arity = QUEUEABLE_ARITY[functionName];
      if (arity === undefined || args.length > arity) return args;
      const padded = args.slice();
      while (padded.length < arity) padded.push(''); // argumen opsional yang tidak diisi pemanggil
      padded.push(newRequestId());
      return padded;
    }

    function queueAddWrite(payload) {
      return openOfflineDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(QUEUE_STORE_NAME, 'readwrite');
        const req = tx.objectStore(QUEUE_STORE_NAME).add(payload);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }));
    }

    function queueGetAllWrites() {
      return openOfflineDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(QUEUE_STORE_NAME, 'readonly');
        const req = tx.objectStore(QUEUE_STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      })).catch(() => []);
    }

    function queueUpdateWrite(item) {
      return openOfflineDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(QUEUE_STORE_NAME, 'readwrite');
        const req = tx.objectStore(QUEUE_STORE_NAME).put(item);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      })).catch(() => {});
    }

    function queueRemoveWrite(id) {
      return openOfflineDb().then(db => new Promise((resolve, reject) => {
        const tx = db.transaction(QUEUE_STORE_NAME, 'readwrite');
        const req = tx.objectStore(QUEUE_STORE_NAME).delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      })).catch(() => {});
    }

    // Buat "hasil seolah-olah berhasil" persis format asli dari server, supaya kode
    // yang sudah ada (cetak struk, tampilkan waktu absen, dst) tetap jalan normal
    // tanpa perlu tahu bahwa ini sebenarnya belum benar-benar tersimpan di server.
    function buildOptimisticResult(functionName) {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      if (functionName === 'saveTransaction') {
        const offlineTrxId = 'TRX-' + Date.now().toString().slice(-6);
        const offlineDate = pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' + String(now.getFullYear()).slice(-2) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
        return { success: true, trxId: offlineTrxId, date: offlineDate };
      }
      if (functionName === 'recordAttendance') {
        return { success: true, timestamp: now.toLocaleString('id-ID') };
      }
      if (functionName === 'recordStockMovement') {
        // Stok baru yang SEBENARNYA tidak bisa dipastikan sekarang (tergantung stok
        // server saat ini, yang tidak diketahui pasti saat offline) -- newStock
        // sengaja null, ditangani khusus di tampilan (pesan sukses generik, bukan
        // angka spesifik yang bisa salah).
        return { success: true, newStock: null };
      }
      return { success: true };
    }

    const MAX_SYNC_ATTEMPTS = 5;
    let isSyncingOfflineQueue = false;
    window.__lastSyncError = '';

    // Satu putaran pengiriman seluruh antrian. Aturan penting:
    // - Item yang DITOLAK server tidak boleh menahan item lain (dilewati, dihitung
    //   percobaannya; setelah beberapa kali gagal ditandai "gagal" untuk dicek manual).
    // - Kalau masalahnya KONEKSI (putus lagi), berhenti dan coba lagi nanti.
    // - Transaksi yang sudah berhasil tersimpan di server dicatat (savedTrxId) supaya
    //   TIDAK PERNAH terkirim dua kali, walau pengurangan stoknya perlu diulang.
    async function runSyncPass() {
      const pending = await queueGetAllWrites();
      for (const item of pending) {
        if (item.failed) continue;
        try {
          // Item dari versi lama (belum punya kunci): beri kunci SEKARANG dan simpan
          // sebelum dikirim, supaya percobaan ulang sesudahnya sudah terlindungi.
          const keyedArgs = withRequestId(item.functionName, item.args);
          if (keyedArgs !== item.args) {
            item.args = keyedArgs;
            await queueUpdateWrite(item);
          }
          let trxId = item.savedTrxId;
          if (!(item.functionName === 'saveTransaction' && trxId)) {
            const res = await runGoogleScriptRaw(item.functionName, ...item.args);
            if (!(res && res.success)) {
              const rejected = new Error((res && res.message) || 'Ditolak server');
              rejected.serverError = true;
              throw rejected;
            }
            trxId = res.trxId;
            if (item.functionName === 'saveTransaction') {
              item.savedTrxId = trxId;
              await queueUpdateWrite(item);
            }
          }
          if (item.functionName === 'saveTransaction') {
            try {
              // Kunci potong stok diturunkan dari kunci transaksi (BUKAN dari ID transaksi,
              // yang tidak unik), jadi kalau diulang tidak memotong stok dua kali.
              await runGoogleScriptRaw('deductStockForSale', item.args[4], trxId, item.args[8], 'D-' + item.args[9]);
            } catch (deductErr) {
              // Sama seperti alur online: gagal potong stok karena server (misal resep
              // bermasalah) hanya dicatat, tidak menggagalkan transaksinya. Kalau
              // karena koneksi, lempar lagi supaya diulang nanti.
              if (!(deductErr && deductErr.serverError) || deductErr.authError) throw deductErr;
              console.warn('[Sinkron] Potong stok gagal di server:', deductErr);
            }
          }
          await queueRemoveWrite(item.id);
          markReadsDirty(item.functionName);
          if (item.functionName === 'saveTransaction') markReadsDirty('deductStockForSale');
          window.__lastSyncError = '';
          console.log('[Sinkron] Berhasil mengirim ' + item.functionName + ' (ID lokal: ' + item.id + ')');
        } catch (err) {
          const msg = item.functionName + ': ' + (err && err.message ? err.message : String(err));
          window.__lastSyncError = msg;
          console.warn('[Sinkron] Gagal:', msg);
          if (err && err.authError) {
            // Sesi login habis: data TETAP di antrian (tidak dihitung gagal), dikirim setelah login ulang saat online.
            window.__lastSyncError = 'Sesi login berakhir. Login ulang saat online agar data terkirim.';
            break;
          }
          if (err && err.serverError) {
            item.attempts = (item.attempts || 0) + 1;
            item.lastError = msg;
            if (item.attempts >= MAX_SYNC_ATTEMPTS) item.failed = true;
            await queueUpdateWrite(item);
            continue;
          }
          break;
        }
      }
    }

    // Dipanggil otomatis (event 'online', interval, dan saat aplikasi dibuka) maupun
    // manual lewat tombol. SENGAJA tidak lagi bergantung pada navigator.onLine --
    // nilainya bisa keliru di aplikasi terpasang; cukup dicoba saja, kalau memang
    // offline panggilan itu gagal cepat dan dicoba lagi nanti.
    async function trySyncOfflineQueue() {
      if (isSyncingOfflineQueue) return;
      isSyncingOfflineQueue = true;
      try {
        // Kunci lintas tab/aplikasi: kalau tab browser DAN aplikasi terpasang sama-sama
        // terbuka, cuma satu yang boleh mengirim pada satu waktu (mencegah data ganda).
        if (typeof navigator !== 'undefined' && navigator.locks && navigator.locks.request) {
          await navigator.locks.request('qasir-offline-sync', { ifAvailable: true }, async (lock) => {
            if (!lock) return;
            await runSyncPass();
          });
        } else {
          await runSyncPass();
        }
      } catch (e) {
        window.__lastSyncError = String(e && e.message ? e.message : e);
      } finally {
        isSyncingOfflineQueue = false;
      }
    }

    if (typeof window !== 'undefined') {
      window.addEventListener('online', () => { trySyncOfflineQueue(); });
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') trySyncOfflineQueue(); });
      setInterval(trySyncOfflineQueue, 30000); // jaga-jaga, coba lagi tiap 30 detik
      setTimeout(trySyncOfflineQueue, 3000); // coba sekali di awal, siapa tahu ada antrian dari sesi sebelumnya
    }

    // Cari data satu bahan baku di simpanan lokal (hasil getIngredients terakhir cabang itu).
    function lookupCachedIngredient(branchId, ingredientId) {
      return offlineCacheGet('getIngredients:' + JSON.stringify([branchId]))
        .then(list => (list || []).find(i => i.ID === ingredientId) || null)
        .catch(() => null);
    }

    // Terjemahkan satu catatan stok di antrian ke angka yang NANTI akan dicatat server,
    // dengan aturan konversi yang sama seperti recordStockMovement di Kode.gs:
    // kalau diinput pakai satuan beli, jumlah dikali isi per satuan beli.
    function convertPendingMovement(item, ing) {
      const type = item.args[1];
      const unitType = item.args[5];
      let qtyNum = Number(item.args[2]) || 0;
      let note = '';
      if (unitType === 'purchase' && ing && ing.Purchase_Unit && Number(ing.Purchase_Conversion) > 0) {
        const conv = Number(ing.Purchase_Conversion);
        note = ' (' + qtyNum + ' ' + ing.Purchase_Unit + ' x ' + conv + ' ' + ing.Unit + ')';
        qtyNum = qtyNum * conv;
      }
      return { qtyNum: qtyNum, note: note, signed: type === 'Masuk' ? qtyNum : -qtyNum };
    }

    // Fungsi mana saja yang hasilnya perlu "digabung" dengan data di antrian
    // offline yang masih menunggu sinkron -- supaya kasir langsung lihat hasil
    // kerjanya sendiri (transaksi/absensi barusan) di Riwayat, TANPA perlu
    // menunggu proses sinkron ke server selesai dulu.
    const MERGE_WITH_QUEUE_FUNCTIONS = ['getTodayCashierTransactions', 'getTransactions', 'getTodayAttendance', 'getStockMovements', 'getRecentStockMovements'];

    function mergeQueuedIntoResult(functionName, args, result) {
      return queueGetAllWrites().then((pending) => {
        if (!pending || pending.length === 0) return result;

        if (functionName === 'getTodayCashierTransactions' || functionName === 'getTransactions') {
          const cashierFilter = functionName === 'getTodayCashierTransactions' ? args[0] : null;
          const branchFilter = functionName === 'getTodayCashierTransactions' ? args[1] : args[0];
          const extra = pending
            .filter(item => item.functionName === 'saveTransaction')
            .filter(item => {
              const cashier = item.args[0], branchId = item.args[8];
              if (cashierFilter && cashier !== cashierFilter) return false;
              if (branchFilter && branchId !== branchFilter) return false;
              return true;
            })
            .map(item => {
              const [cashier, subtotal, tax, total, items, paymentMethod, cashReceived, change, branchId] = item.args;
              return {
                TRX_ID: item.optimistic.trxId, Date: item.optimistic.date, Cashier: cashier,
                Subtotal: subtotal, Tax: tax, Total: total, Items: JSON.stringify(items),
                Payment_Method: paymentMethod, Cash_Received: cashReceived, Change: change,
                Branch_ID: branchId, _pendingSync: true
              };
            });
          return extra.concat(result || []); // transaksi offline ditaruh paling atas (terbaru)
        }

        if (functionName === 'getTodayAttendance') {
          const usernameFilter = args[0];
          const branchFilter = args[1];
          const now = new Date();
          const todayDateStr = now.getDate() + '/' + (now.getMonth() + 1) + '/' + now.getFullYear();
          const extra = pending
            .filter(item => item.functionName === 'recordAttendance')
            .filter(item => {
              const username = item.args[0], branchId = item.args[2];
              if (usernameFilter && username !== usernameFilter) return false;
              if (branchFilter && branchId !== branchFilter) return false;
              return true;
            })
            .map(item => {
              const [username, type, branchId, shift] = item.args;
              return {
                Date: todayDateStr, Username: username, Type: type,
                Timestamp: item.optimistic.timestamp, Branch_ID: branchId,
                Shift: type === 'Clock In' ? (shift || '') : '', _pendingSync: true
              };
            });
          return (result || []).concat(extra); // absensi offline ditaruh di akhir (urut waktu)
        }

        if (functionName === 'getStockMovements' || functionName === 'getRecentStockMovements') {
          const branchFilter = args[0];
          // Versi ringan punya filter jenis (args[2]) dan "sembunyikan penjualan otomatis"
          // (args[3]); catatan antrian selalu manual, jadi cuma filter jenis yang berlaku.
          const typeFilter = (functionName === 'getRecentStockMovements' && (args[2] === 'Masuk' || args[2] === 'Keluar')) ? args[2] : '';
          const pad = (n) => String(n).padStart(2, '0');
          const mine = pending
            .filter(item => item.functionName === 'recordStockMovement')
            .filter(item => {
              const branchId = item.args[6];
              if (branchFilter && branchId !== branchFilter) return false;
              if (typeFilter && item.args[1] !== typeFilter) return false;
              return true;
            })
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); // terbaru dulu
          return Promise.all(mine.map(item => {
            const [ingredientId, type, qty, reason, reference, unitType, branchId, customCost] = item.args;
            return lookupCachedIngredient(branchId, ingredientId).then(ing => {
              // Tampilkan seperti yang NANTI tercatat server: jumlah dalam satuan resep
              // + catatan konversi kalau diinput pakai satuan beli (mis. "Botol").
              const conv = convertPendingMovement(item, ing);
              const when = new Date(item.createdAt || Date.now());
              const whenStr = pad(when.getDate()) + '/' + pad(when.getMonth() + 1) + '/' + String(when.getFullYear()).slice(-2) + ' ' + pad(when.getHours()) + ':' + pad(when.getMinutes());
              return {
                ID: 'MV-PENDING-' + item.id, Date: whenStr, Ingredient_ID: ingredientId,
                Type: type, Qty: conv.qtyNum, Reason: (reason || '-') + conv.note, Reference: reference,
                Branch_ID: branchId, Custom_Cost: customCost || '', _pendingSync: true
              };
            });
          })).then(extra => extra.concat(result || [])); // catatan offline di paling atas
        }

        return result;
      }).catch(() => result); // gagal baca antrian bukan alasan gagalkan tampilan, kembalikan hasil asli
    }

    // ==========================================
    // BACA DATA DENGAN SIMPANAN OFFLINE
    // - Data acuan yang jarang berubah (cabang, produk, kategori, bahan, pengaturan):
    //   kalau ada simpanan, tampil INSTAN; server memperbarui di belakang layar.
    // - TAPI begitu ada perubahan yang memengaruhinya (mis. Owner mengedit produk),
    //   pembacaan berikutnya mengambil data SEGAR dari server (simpanan lama hanya
    //   dipakai kalau server gagal), supaya daftar tidak menampilkan versi lama.
    // - Riwayat (transaksi, absensi, pergerakan stok): selalu utamakan data terbaru;
    //   simpanan hanya cadangan kalau server gagal atau terlalu lama menjawab.
    // ==========================================
    const SWR_FUNCTIONS = ['getBranches', 'getProducts', 'getCategories', 'getIngredients', 'getSettings'];
    const NETWORK_FIRST_TIMEOUT_MS = 12000;

    // Perubahan apa memengaruhi hasil baca apa.
    const MUTATION_AFFECTS = {
      manageProduct: ['getProducts'],
      copyProductPricing: ['getProducts'],
      syncAllProductCostPrices: ['getProducts'],
      manageRecipe: ['getProducts'],
      manageCategory: ['getCategories', 'getProducts'],
      manageIngredient: ['getIngredients', 'getProducts'],
      recalculateIngredientCost: ['getIngredients', 'getProducts'],
      copyRecipeData: ['getIngredients'],
      produceBatch: ['getIngredients'],
      recordStockMovement: ['getIngredients'],
      deductStockForSale: ['getIngredients'],
      manageBranch: ['getBranches'],
      saveSetting: ['getSettings']
    };

    const readVersion = {};   // nama fungsi baca -> penghitung (naik tiap ada perubahan data)
    const readFetchedAt = {}; // kunci simpanan -> versi saat terakhir diambil dari server

    function markReadsDirty(functionName) {
      (MUTATION_AFFECTS[functionName] || []).forEach(function (readFn) {
        readVersion[readFn] = (readVersion[readFn] || 0) + 1;
      });
    }

    // Dari mana hasil baca terakhir untuk suatu kunci berasal: 'server' atau 'cache'.
    // Dipakai layar laporan untuk jujur soal "diperbarui pukul berapa".
    const readSource = {};
    function getReadSource(functionName, args) { return readSource[functionName + ':' + JSON.stringify(args)]; }

    // forceFresh = true: abaikan jalan pintas "tampil instan dari simpanan"; utamakan server.
    function cachedRead(functionName, args, forceFresh) {
      const cacheKey = functionName + ':' + JSON.stringify(args);
      const versionAtRequest = readVersion[functionName] || 0;
      const isDirty = (readFetchedAt[cacheKey] || 0) < versionAtRequest;

      const fromServer = runGoogleScriptRaw(functionName, ...args).then(function (result) {
        offlineCacheSet(cacheKey, result); // perbarui simpanan untuk lain kali
        try {
          if (functionName === 'getProducts' && Array.isArray(result)) prefetchImages(result.map(function (x) { return x && x.Image_URL; }));
          if (functionName === 'getSettings' && result && result.QRIS_Type === 'Static') prefetchImages([result.QRIS_Image_URL]);
        } catch (e) {}
        readFetchedAt[cacheKey] = Math.max(readFetchedAt[cacheKey] || 0, versionAtRequest);
        readSource[cacheKey] = 'server';
        return result;
      });
      // Tandai "sudah ditangani" supaya kegagalan di latar belakang tidak jadi galat
      // "promise tidak ditangani". Pemanggil tetap menerima kegagalannya lewat fromServer.
      fromServer.catch(function () {});

      // Data acuan & tidak sedang "kotor" -> pakai simpanan langsung (instan).
      if (!forceFresh && SWR_FUNCTIONS.indexOf(functionName) !== -1 && !isDirty) {
        return offlineCacheGet(cacheKey).then(function (cached) {
          if (cached !== undefined) { readSource[cacheKey] = 'cache'; return cached; }
          return fromServer;
        });
      }

      // Selain itu: utamakan server; simpanan jadi cadangan kalau gagal/terlalu lama.
      let timer;
      const timeout = new Promise(function (_, reject) {
        // Riwayat transaksi lengkap bisa besar, beri waktu lebih lama dibanding data acuan.
        timer = setTimeout(function () { reject(new Error('Server terlalu lama merespons')); }, functionName === 'getTransactions' ? 60000 : NETWORK_FIRST_TIMEOUT_MS);
      });
      timeout.catch(function () {});
      return Promise.race([fromServer, timeout]).then(
        function (result) { clearTimeout(timer); return result; },
        function (err) {
          clearTimeout(timer);
          return offlineCacheGet(cacheKey).then(function (cached) {
            if (cached !== undefined) { readSource[cacheKey] = 'cache'; return cached; }
            throw err;
          });
        }
      );
    }

    // Seperti runGoogleScript untuk data yang bisa dicache, tapi UTAMAKAN data terbaru dari
    // server (simpanan lokal hanya cadangan kalau server gagal/terlalu lama).
    // Hanya untuk fungsi di OFFLINE_CACHEABLE_FUNCTIONS.
    const runGoogleScriptFresh = (functionName, ...args) => cachedRead(functionName, args, true);

    // Versi yang BENAR-BENAR dipakai di seluruh aplikasi (semua pemanggilan
    // runGoogleScript(...) yang sudah ada otomatis lewat sini, tidak perlu diubah
    // satu-satu di tempat lain).
    const runGoogleScript = (functionName, ...args) => {
      // Transaksi & absensi & stok masuk: kalau gagal (kemungkinan besar offline),
      // simpan ke antrian lokal dan kembalikan hasil "seolah berhasil" supaya alur
      // aplikasi (cetak struk, dst) tetap berjalan seperti biasa.
      if (OFFLINE_QUEUEABLE_FUNCTIONS.indexOf(functionName) !== -1) {
        // Kunci dibuat SEKALI di sini; kalau percobaan pertama gagal dan masuk antrian,
        // kunci yang sama ikut tersimpan dan dipakai lagi saat dikirim ulang.
        const keyedArgs = withRequestId(functionName, args);
        return runGoogleScriptRaw(functionName, ...keyedArgs).then((res) => {
          if (res && res.success !== false) markReadsDirty(functionName);
          return res;
        }).catch((err) => {
          const optimistic = buildOptimisticResult(functionName);
          // Transaksi offline: ikutkan nomor & jam yang SUDAH tercetak di struk, supaya
          // server mencatat persis yang sama (bukan nomor/jam saat sinkron).
          const queuedArgs = functionName === 'saveTransaction' ? keyedArgs.concat([optimistic.trxId, optimistic.date]) : keyedArgs;
          return queueAddWrite({ functionName, args: queuedArgs, optimistic, createdAt: Date.now() }).then(() => {
            console.warn('[Offline] ' + functionName + ' disimpan ke antrian lokal, akan otomatis dikirim begitu online.');
            return Object.assign({}, optimistic, { offlineQueued: true });
          });
        });
      }

      let resultPromise;
      if (OFFLINE_CACHEABLE_FUNCTIONS.indexOf(functionName) !== -1) {
        resultPromise = cachedRead(functionName, args);
      } else {
        // Fungsi lain (login, tambah/edit/hapus, dst): langsung ke server. Kalau
        // berhasil mengubah data, tandai hasil baca yang terkait sebagai "kotor"
        // supaya pembacaan berikutnya mengambil data segar, bukan simpanan lama.
        resultPromise = runGoogleScriptRaw(functionName, ...args).then((res) => {
          if (res && res.success !== false) markReadsDirty(functionName);
          return res;
        });
      }

      if (MERGE_WITH_QUEUE_FUNCTIONS.indexOf(functionName) !== -1) {
        return resultPromise.then((result) => mergeQueuedIntoResult(functionName, args, result));
      }

      return resultPromise;
    };

    // ==========================================
    // CACHE RINGAN: mempercepat pindah menu.
    // Data hasil fetch disimpan sebentar di memori, jadi kalau menu yang sama
    // dibuka lagi dalam beberapa detik, tidak perlu tunggu Google Sheets lagi.
    // Begitu ada tambah/edit/hapus data, cache terkait langsung dihapus (invalidateCache)
    // supaya data yang ditampilkan berikutnya selalu segar/akurat.
    // ==========================================
    const _dataCache = {};
    const CACHE_TTL_MS = 45000; // 45 detik

    const cachedFetch = (key, fetchFn) => {
      const cached = _dataCache[key];
      const now = Date.now();
      if (cached && (now - cached.time) < CACHE_TTL_MS) {
        return Promise.resolve(cached.data);
      }
      return fetchFn().then(data => {
        _dataCache[key] = { data, time: Date.now() };
        return data;
      });
    };

    const invalidateCache = (...keys) => {
      keys.forEach(k => { delete _dataCache[k]; });
    };

    const invalidateAllCache = () => {
      Object.keys(_dataCache).forEach(k => { delete _dataCache[k]; });
    };

    // size opsional: minta ukuran thumbnail lebih kecil ke Google Drive untuk grid
    // produk (foto kecil di kartu tidak perlu resolusi besar), supaya lebih cepat
    // diunduh & ditampilkan. Konteks lain (modal, tabel) tetap pakai ukuran normal.
    const formatImageUrl = (url, size) => {
      if (!url) return '';
      const sz = size || 500;
      const fileMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileMatch) return `https://drive.google.com/thumbnail?id=${fileMatch[1]}&sz=w${sz}`;
      const ucMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (url.includes('drive.google.com') && ucMatch) return `https://drive.google.com/thumbnail?id=${ucMatch[1]}&sz=w${sz}`;
      return url;
    };

    // ==========================================
    // FOTO OFFLINE: foto produk/QRIS ada di Google Drive (situs lain), dan Service
    // Worker tidak bisa menyimpan gambar lintas-situs. Jadi setelah data produk
    // berhasil dimuat ONLINE, fotonya diunduh sekali lewat server (sebagai teks Base64
    // kecil) dan disimpan di IndexedDB. Saat offline, <CachedImg> memakai simpanan itu.
    // ==========================================
    const _imgMem = {};
    const _imgFailed = {};
    let _imgPrefetching = false;
    const imageDriveId = (url) => {
      if (!url) return null;
      const m = String(url).match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || (String(url).includes('drive.google.com') ? String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/) : null);
      return m ? m[1] : null;
    };
    const imageKeyOf = (url) => 'img:' + (imageDriveId(url) || String(url));

    const prefetchImages = async (urls) => {
      if (_imgPrefetching || (typeof navigator !== 'undefined' && navigator.onLine === false)) return;
      _imgPrefetching = true;
      try {
        const seen = {};
        const todo = [];
        for (const u of (urls || [])) {
          if (!u || typeof u !== 'string') continue;
          const k = imageKeyOf(u);
          if (seen[k] || _imgMem[k] || _imgFailed[k]) continue;
          seen[k] = true;
          const have = await offlineCacheGet(k);
          if (have) { _imgMem[k] = have; continue; }
          todo.push({ u, k, id: imageDriveId(u) });
        }
        const drive = todo.filter(t => t.id);
        const other = todo.filter(t => !t.id);
        let useFallback = false;
        for (let i = 0; i < drive.length && !useFallback; i += 6) {
          const chunk = drive.slice(i, i + 6);
          try {
            const res = await runGoogleScript('getImageThumbnails', chunk.map(t => t.id));
            if (res && res.success && res.items) {
              for (const t of chunk) {
                const d = res.items[t.id];
                if (d) { _imgMem[t.k] = d; await offlineCacheSet(t.k, d); } else { _imgFailed[t.k] = true; }
              }
            } else { useFallback = true; }
          } catch (err) {
            if (String(err && (err.message || err)).indexOf('tidak diizinkan') !== -1) { useFallback = true; } else { return; }
          }
        }
        // Server belum diperbarui (fungsi baru belum ada)? pakai fungsi lama satu per satu.
        const single = (useFallback ? drive : []).concat(other);
        for (const t of single) {
          try {
            const res = await runGoogleScript('getImageAsBase64', t.id ? formatImageUrl(t.u) : t.u);
            if (res && res.success && res.dataUri) { _imgMem[t.k] = res.dataUri; await offlineCacheSet(t.k, res.dataUri); } else { _imgFailed[t.k] = true; }
          } catch (err) { return; }
        }
      } catch (e) {
        /* foto offline hanya pelengkap; gagal tidak boleh mengganggu aplikasi */
      } finally { _imgPrefetching = false; }
    };

    // Pengganti <img> untuk foto dari Drive: normal saat online; kalau gagal dimuat
    // (offline), pakai simpanan IndexedDB; kalau tidak ada juga, tampilkan ikon.
    function CachedImg({ url, size, className, alt, fallbackIcon }) {
      const [stage, setStage] = useState(0);
      const [src, setSrc] = useState(() => {
        const k = imageKeyOf(url);
        if (_imgMem[k] && typeof navigator !== 'undefined' && navigator.onLine === false) return _imgMem[k];
        return formatImageUrl(url, size);
      });
      useEffect(() => {
        setStage(0);
        const k = imageKeyOf(url);
        setSrc((_imgMem[k] && navigator.onLine === false) ? _imgMem[k] : formatImageUrl(url, size));
      }, [url, size]);
      const handleError = () => {
        if (stage !== 0) { setStage(2); return; }
        const k = imageKeyOf(url);
        const useData = (d) => { if (d) { _imgMem[k] = d; setStage(1); setSrc(d); } else { setStage(2); } };
        if (_imgMem[k]) useData(_imgMem[k]); else offlineCacheGet(k).then(useData).catch(() => setStage(2));
      };
      if (!url || stage === 2) return <i className={'fa-solid ' + (fallbackIcon || 'fa-mug-hot') + ' text-slate-300 text-3xl'}></i>;
      return <img src={src} alt={alt || ''} className={className} loading="lazy" decoding="async" onError={handleError} />;
    }

    const parseIndoDate = (dateVal) => {
      if (!dateVal) return new Date();
      if (dateVal instanceof Date || (typeof dateVal === 'object' && typeof dateVal.getMonth === 'function')) {
        return dateVal;
      }
      try {
        const dateString = String(dateVal);
        const parts = dateString.match(/(\d+)/g);
        if (parts && parts.length >= 3) {
          let year, month, day;
          if (parts[0].length === 4) {
            // Format lama: yyyy-mm-dd
            year = Number(parts[0]);
            month = Number(parts[1]);
            day = Number(parts[2]);
          } else {
            // Format dd/mm/yyyy ATAU dd/mm/yy
            day = Number(parts[0]);
            month = Number(parts[1]);
            year = Number(parts[2]);
            if (parts[2].length <= 2) year += 2000; // "26" -> 2026, bukan 1926
          }
          return new Date(
            year,
            month - 1,
            day,
            Number(parts[3] || 0),
            Number(parts[4] || 0),
            Number(parts[5] || 0)
          );
        }
        const d = new Date(dateString);
        return isNaN(d.getTime()) ? new Date() : d;
      } catch (err) {
        console.error("Kesalahan parsing tanggal:", err);
        return new Date();
      }
    };

    // --- LOGIKA CETAK PRINTER BLUETOOTH / THERMAL (OPTIMASI BEBAS JEDA INSTAN) ---
    // ==========================================
    // CETAK LANGSUNG LEWAT RawBT (printer thermal Bluetooth, tanpa dialog cetak Android).
    // Struk dibuat sebagai perintah ESC/POS (teks, bukan gambar) lalu diserahkan ke
    // aplikasi RawBT lewat Android intent. Pilihan metode disimpan PER TABLET.
    // Metode "dialog" (cara lama) tetap ada sebagai cadangan.
    // ==========================================
    const PRINT_PREFS_KEY = 'qasir_print_prefs';
    function getPrintPrefs() {
      try {
        const p = JSON.parse(localStorage.getItem(PRINT_PREFS_KEY) || '{}');
        return { method: p.method === 'rawbt' ? 'rawbt' : 'dialog', auto: !!p.auto, logo: p.logo !== false };
      } catch (e) { return { method: 'dialog', auto: false, logo: true }; }
    }
    function savePrintPrefs(prefs) {
      try { localStorage.setItem(PRINT_PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
    }

    // Printer thermal hanya menerima ASCII dengan andal: buang aksen, ganti tanda baca khusus.
    function escposAscii(str) {
      return String(str == null ? '' : str)
        .normalize('NFKD').replace(/[̀-ͯ]/g, '')
        .replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-')
        .replace(/[^\x20-\x7e]/gu, '?');
    }

    function escposWrap(text, width) {
      const out = [];
      String(text).split('\n').forEach(function (para) {
        let line = '';
        para.split(' ').forEach(function (word) {
          while (word.length > width) {
            if (line) { out.push(line); line = ''; }
            out.push(word.slice(0, width)); word = word.slice(width);
          }
          if (!line) line = word;
          else if ((line + ' ' + word).length <= width) line += ' ' + word;
          else { out.push(line); line = word; }
        });
        out.push(line);
      });
      return out;
    }

    function createEscPos(width) {
      const bytes = [];
      const api = {
        raw: function () { for (let i = 0; i < arguments.length; i++) bytes.push(arguments[i]); return api; },
        init: function () { return api.raw(0x1b, 0x40); },
        align: function (n) { return api.raw(0x1b, 0x61, n); },   // 0 kiri, 1 tengah, 2 kanan
        bold: function (on) { return api.raw(0x1b, 0x45, on ? 1 : 0); },
        feed: function (n) { return api.raw(0x1b, 0x64, n); },
        line: function (text) {
          const t = escposAscii(text);
          for (let i = 0; i < t.length; i++) bytes.push(t.charCodeAt(i));
          bytes.push(0x0a); return api;
        },
        wrapped: function (text) { escposWrap(String(text == null ? '' : text), width).forEach(function (l) { api.line(l); }); return api; },
        center: function (text) { api.align(1); api.wrapped(text); api.align(0); return api; },
        right: function (text) { api.align(2); api.wrapped(text); api.align(0); return api; },
        divider: function (ch) { return api.line(new Array(width + 1).join(ch || '-')); },
        // kiri & kanan satu baris; kalau tidak muat, kiri dibungkus lalu kanan di baris sendiri
        lr: function (left, right) {
          const l = escposAscii(left), r = escposAscii(right);
          if (l.length + r.length + 1 <= width) {
            return api.line(l + new Array(width - l.length - r.length + 1).join(' ') + r);
          }
          api.wrapped(l); return api.right(r);
        },
        bytes: function (arr) { for (let i = 0; i < arr.length; i++) bytes.push(arr[i]); return api; },
        build: function () { return new Uint8Array(bytes); }
      };
      return api;
    }

    // ---- Logo untuk struk RawBT: gambar diubah jadi titik hitam-putih (raster) ----
    // RGBA -> perintah ESC/POS "GS v 0". Lebar harus kelipatan 8. Memakai dithering
    // Floyd-Steinberg supaya logo berwarna/abu-abu tetap terbaca di printer thermal.
    function rasterizeRGBA(data, w, h) {
      const g = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const a = data[i * 4 + 3] / 255;
        g[i] = (0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2]) * a + 255 * (1 - a);
      }
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = y * w + x;
          const old = g[i];
          const nw = old < 128 ? 0 : 255;
          const err = old - nw;
          g[i] = nw;
          if (x + 1 < w) g[i + 1] += err * 7 / 16;
          if (y + 1 < h) {
            if (x > 0) g[i + w - 1] += err * 3 / 16;
            g[i + w] += err * 5 / 16;
            if (x + 1 < w) g[i + w + 1] += err * 1 / 16;
          }
        }
      }
      const rowBytes = w / 8;
      const out = new Uint8Array(8 + rowBytes * h);
      out.set([0x1d, 0x76, 0x30, 0x00, rowBytes & 255, rowBytes >> 8, h & 255, h >> 8], 0);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (g[y * w + x] < 128) out[8 + y * rowBytes + (x >> 3)] |= (0x80 >> (x & 7));
        }
      }
      return out;
    }

    function loadLogoRaster(dataUri, maxW, maxH) {
      return new Promise(function (resolve, reject) {
        const img = new Image();
        img.onload = function () {
          try {
            const scale = Math.min(maxW / img.width, maxH / img.height);
            const w = Math.max(8, Math.floor((img.width * scale) / 8) * 8);
            const h = Math.max(8, Math.round(img.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            resolve(rasterizeRGBA(ctx.getImageData(0, 0, w, h).data, w, h));
          } catch (e) { reject(e); }
        };
        img.onerror = function () { reject(new Error('Logo tidak bisa dibaca')); };
        img.src = dataUri;
      });
    }

    // Hanya logo yang sudah tertanam (data:) yang bisa dicetak lewat RawBT.
    const _logoRasterCache = {};
    function logoRasterInfo(settings) {
      const st = settings || {};
      const uri = st.STORE_LOGO_URL;
      if (!uri || String(uri).indexOf('data:') !== 0) return null;
      const maxW = st.PAPER_SIZE === '80mm' ? 576 : 384;
      const maxH = Math.min(160, Math.max(48, (Number(st.RECEIPT_LOGO_SIZE) || 50) * 2));
      return { uri: uri, maxW: maxW, maxH: maxH, key: uri.length + '|' + uri.slice(-40) + '|' + maxW + 'x' + maxH };
    }
    // Siapkan di depan (saat pengaturan dimuat) supaya saat tombol cetak ditekan tidak
    // ada jeda dan intent langsung terkirim di dalam sentuhan kasir.
    function prepareLogoRaster(settings) {
      const info = logoRasterInfo(settings);
      if (!info || _logoRasterCache[info.key] !== undefined) return;
      loadLogoRaster(info.uri, info.maxW, info.maxH)
        .then(function (r) { _logoRasterCache[info.key] = r; })
        .catch(function () { _logoRasterCache[info.key] = null; });
    }

    function buildEscPosReceipt(trx, settings, logoRaster) {
      const st = settings || {};
      const width = (st.PAPER_SIZE === '80mm') ? 48 : 32;
      const p = createEscPos(width);
      const money = function (n) { return Number(n || 0).toLocaleString('id-ID'); };
      const itemName = function (name) { return String(name).replace(' (Medium)', ' - Medium').replace(' (Jumbo)', ' - Jumbo'); };
      const totalQty = trx.items.reduce(function (sum, i) { return sum + Number(i.qty || 0); }, 0);

      p.init();
      if (logoRaster) { p.align(1); p.bytes(logoRaster); p.align(0); }
      p.align(1); p.bold(true); p.wrapped(st.STORE_NAME || 'MINUM.ES'); p.bold(false);
      p.wrapped(st.STORE_SLOGAN || 'Segarnya Alami Tanpa Batas'); p.align(0);
      p.line('');
      p.lr(String(trx.id), String(trx.date));
      p.right(String(trx.paymentMethod || ''));
      const mid = ' LUNAS ';
      const side = Math.max(0, Math.floor((width - mid.length) / 2));
      p.line(new Array(side + 1).join('-') + mid + new Array(width - side - mid.length + 1).join('-'));
      trx.items.forEach(function (item) {
        const qty = Number(item.qty || 0);
        const discount = Number(item.Discount || 0);
        p.bold(true); p.wrapped(itemName(item.Name)); p.bold(false);
        p.lr('x' + qty + ' @' + money(item.Price), money(item.Price * qty - discount));
        if (discount > 0) p.lr('Diskon', '-' + money(discount));
      });
      p.divider('-');
      p.bold(true); p.lr('Total (' + totalQty + ')', money(trx.total)); p.bold(false);
      p.lr('Bayar', money(trx.cashReceived));
      p.bold(true); p.lr('Kembali', money(trx.change)); p.bold(false);
      p.line('');
      p.center(st.STORE_FOOTER || 'Terima Kasih\nSilakan Datang Kembali!');
      p.feed(4);
      return p.build();
    }

    function buildEscPosOrderTicket(trx, settings) {
      const width = (settings && settings.PAPER_SIZE === '80mm') ? 48 : 32;
      const p = createEscPos(width);
      const totalQty = trx.items.reduce(function (sum, i) { return sum + Number(i.qty || 0); }, 0);
      p.init();
      p.align(1); p.bold(true); p.line('PESANAN'); p.bold(false); p.line(String(trx.date)); p.align(0);
      p.divider('-');
      trx.items.forEach(function (item) {
        const nameOnly = String(item.Name).replace(' (Medium)', ' - Medium').replace(' (Jumbo)', ' - Jumbo');
        p.bold(true); p.wrapped(item.qty + 'x ' + nameOnly); p.bold(false);
      });
      p.divider('-');
      p.right('Total Item: ' + totalQty);
      p.feed(4);
      return p.build();
    }

    // Serahkan byte ESC/POS ke aplikasi RawBT (harus terpasang di tablet Android).
    function sendToRawBT(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      window.__skipUnloadWarn = true;
      setTimeout(function () { window.__skipUnloadWarn = false; }, 4000);
      window.location.href = 'intent:base64,' + btoa(bin) + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
    }

    const printReceipt = (trx, settings) => {
      if (getPrintPrefs().method === 'rawbt') {
        const info = getPrintPrefs().logo ? logoRasterInfo(settings) : null;
        if (!info || _logoRasterCache[info.key] !== undefined) {
          sendToRawBT(buildEscPosReceipt(trx, settings, info ? _logoRasterCache[info.key] : null));
        } else {
          // Logo belum sempat disiapkan: siapkan sekarang (cepat), lalu cetak.
          loadLogoRaster(info.uri, info.maxW, info.maxH)
            .then(function (r) { _logoRasterCache[info.key] = r; sendToRawBT(buildEscPosReceipt(trx, settings, r)); })
            .catch(function () { _logoRasterCache[info.key] = null; sendToRawBT(buildEscPosReceipt(trx, settings, null)); });
        }
        return;
      }
      let iframe = document.getElementById('receipt-print-iframe');
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.id = 'receipt-print-iframe';
        iframe.style.position = 'fixed';
        iframe.style.right = '0';
        iframe.style.bottom = '0';
        iframe.style.width = '0';
        iframe.style.height = '0';
        iframe.style.border = '0';
        document.body.appendChild(iframe);
      }

      // Teks dari pengaturan/produk disisipkan ke HTML struk; amankan karakter khusus
      // (misal "&" atau "<" di nama produk) supaya tidak merusak tampilan struk.
      const esc = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const storeName = esc(settings.STORE_NAME || "MINUM.ES");
      const storeSlogan = esc(settings.STORE_SLOGAN || "Segarnya Alami Tanpa Batas");
      const storeAddress = esc(settings.STORE_ADDRESS || "Cabang Utama Ruko Pahlawan");
      const paperSize = settings.PAPER_SIZE || "58mm";
      const footerMsg = esc(settings.STORE_FOOTER || "Terima Kasih\nSilakan Datang Kembali!");
      const logoUrl = settings.STORE_LOGO_URL ? formatImageUrl(settings.STORE_LOGO_URL) : "";
      const isEmbeddedLogo = logoUrl.startsWith('data:');

      const fontSizeSetting = settings.RECEIPT_FONT_SIZE || "10";
      const logoSizeSetting = Number(settings.RECEIPT_LOGO_SIZE) || 50;
      const spacingSetting = settings.RECEIPT_LINE_HEIGHT || "normal";

      const bodyWidth = paperSize === "80mm" ? "70mm" : "48mm";
      
      let baseFontSize = 10;
      if (!isNaN(fontSizeSetting)) {
        baseFontSize = Number(fontSizeSetting);
      } else {
        const defaultBaseSize = paperSize === "80mm" ? 12 : 10;
        baseFontSize = defaultBaseSize;
        if (fontSizeSetting === "small") baseFontSize -= 1;
        if (fontSizeSetting === "large") baseFontSize += 2;
        if (fontSizeSetting === "xlarge") baseFontSize += 4;
      }
      const fontSizeCss = `${baseFontSize}px`;

      let lineHeightCss = "1.15";
      if (spacingSetting === "tight") lineHeightCss = "1.0";
      if (spacingSetting === "loose") lineHeightCss = "1.4";

      // Ubah "Nama Produk (Medium)" menjadi "Nama Produk - Medium" khusus untuk tampilan struk
      const formatReceiptItemName = (name) => {
        return String(name).replace(' (Medium)', ' - Medium').replace(' (Jumbo)', ' - Jumbo');
      };

      const totalQtyAllItems = trx.items.reduce((sum, item) => sum + Number(item.qty || 0), 0);

      const itemsHtml = trx.items.map(item => {
        const qty = item.qty;
        const price = Number(item.Price).toLocaleString('id-ID');
        const discount = Number(item.Discount || 0);
        const sub = ((item.Price * qty) - discount).toLocaleString('id-ID');
        return `
          <div style="margin-bottom: 5px;">
            <div style="font-weight: 800;">${esc(formatReceiptItemName(item.Name))}</div>
            <div style="display:flex; justify-content:space-between;">
              <span style="font-weight: 700;">x${qty} @${price}</span>
              <span style="font-weight: 800;">${sub}</span>
            </div>
            ${discount > 0 ? `<div style="display:flex; justify-content:space-between;"><span style="font-weight: 700;">Diskon</span><span style="font-weight: 700;">-${discount.toLocaleString('id-ID')}</span></div>` : ''}
          </div>
        `;
      }).join('');

      // FUNGSI INJEKSI STRUK: Mengirim dokumen ke printer secara instan.
      // Jika logoUrl ada, ia dimuat dengan event onload yang aman tanpa menahan alur pencetakan teks.
      const docContent = `
        <html>
        <head>
          <title>Struk Pembayaran</title>
          <style>
            @page { 
              size: auto; 
              margin: 0mm !important; 
            }
            html, body {
              margin: 0 !important;
              padding: 0 !important;
              height: auto !important;
              min-height: 0 !important;
              background: #fff;
              overflow: hidden;
            }
            body {
              font-family: 'Arial', 'Helvetica', 'Segoe UI', sans-serif;
              width: ${bodyWidth};
              padding: 0px 4px 10px 4px !important;
              font-size: ${fontSizeCss};
              color: #000;
              line-height: ${lineHeightCss};
              box-sizing: border-box;
              font-weight: 700;
              -webkit-font-smoothing: none;
              font-smooth: never;
              text-rendering: optimizeLegibility;
            }
            .receipt-container {
              width: 100%;
              overflow: hidden;
              display: block;
            }
            .center { text-align: center; }
            .right { text-align: right; }
            .bold { font-weight: 800; }
            .divider { border-top: 2px dashed #000; margin: 6px 0; }
            .header-title { font-size: ${baseFontSize + 3}px; font-weight: 900; margin-bottom: 2px; }
            .item-list { margin: 6px 0; }
            .logo-img { 
              max-height: ${logoSizeSetting}px; 
              width: auto; 
              margin-bottom: 6px; 
              border-radius: 50%;
              image-rendering: -webkit-optimize-contrast;
              image-rendering: pixelated;
            }
          </style>
        </head>
        <body>
          <div class="receipt-container">
            <div class="center">
              ${logoUrl ? `<img id="store-logo" src="${logoUrl}" class="logo-img" style="${isEmbeddedLogo ? '' : 'display:none;'}" onload="this.style.display='inline-block'" /><br/>` : ''}
              <span class="header-title">${storeName}</span><br/>
              <span style="font-size: ${baseFontSize - 1}px; font-weight: 700;">${storeSlogan}</span>
            </div>

            <div style="margin-top: 8px; display:flex; justify-content:space-between; align-items:baseline; font-size: ${Math.max(baseFontSize - 2, 7)}px; white-space: nowrap; gap: 6px;">
              <span>Struk: ${esc(trx.id)}</span>
              <span>${esc(trx.date)}</span>
            </div>
            <div style="text-align:right; font-size: ${Math.max(baseFontSize - 2, 7)}px;">${esc(trx.paymentMethod)}</div>

            <div style="display:flex; align-items:center; margin: 8px 0;">
              <div style="flex:1; border-top: 1px dashed #000;"></div>
              <span style="padding: 0 6px; font-weight: 900;">LUNAS</span>
              <div style="flex:1; border-top: 1px dashed #000;"></div>
            </div>

            <div class="item-list">
              ${itemsHtml}
            </div>

            <div class="divider"></div>

            <div style="display:flex; justify-content:space-between; font-weight: 900;">
              <span>Total (${totalQtyAllItems})</span>
              <span>${Number(trx.total).toLocaleString('id-ID')}</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top: 2px; font-weight: 700;">
              <span>Bayar</span>
              <span>${Number(trx.cashReceived).toLocaleString('id-ID')}</span>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top: 2px; font-weight: 900;">
              <span>Kembali</span>
              <span>${Number(trx.change).toLocaleString('id-ID')}</span>
            </div>

            <div class="center" style="margin-top: 12px; margin-bottom: 12px; white-space: pre-line; font-weight: 700; font-size: ${baseFontSize - 1}px;">
              <span>${footerMsg}</span>
            </div>
          </div>
        </body>
        </html>
      `;

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(docContent);
      doc.close();

      // PEMICU CETAK DIPINDAH KE LUAR document.write() supaya Google Apps Script
      // tidak perlu memproses tag <script> di dalam konten yang ditulis (ini yang
      // ternyata bisa bikin sistem keamanan Google salah baca, khususnya kalau ada
      // logo base64 yang sangat panjang tertanam di dalamnya).
      const triggerPrint = () => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      };

      if (isEmbeddedLogo) {
        requestAnimationFrame(() => {
          requestAnimationFrame(triggerPrint);
        });
      } else {
        const logoImg = doc.getElementById('store-logo');
        if (logoImg) {
          let printed = false;
          logoImg.onload = () => { if (!printed) { printed = true; triggerPrint(); } };
          setTimeout(() => { if (!printed) { printed = true; triggerPrint(); } }, 600);
        } else {
          triggerPrint();
        }
      }
    };

    // Cetak "Pesanan" (tanpa harga) — buat dikasihkan ke bagian racik/dapur, bukan
    // untuk pelanggan. Mengikuti pola aman yang sama seperti printReceipt: pemicu

    function ImageCropperModal({ imageSrc, onCancel, onCropComplete }) {
      const imageElement = useRef(null);
      const cropperInstance = useRef(null);

      useEffect(() => {
        if (imageElement.current) {
          cropperInstance.current = new window.Cropper(imageElement.current, {
            aspectRatio: 1, 
            viewMode: 1,
            autoCropArea: 1,
            background: false,
            dragMode: 'move'
          });
        }
        return () => {
          if (cropperInstance.current) cropperInstance.current.destroy();
        };
      }, [imageSrc]);

      const handleCrop = () => {
        if (cropperInstance.current) {
          // Foto produk cuma ditampilkan kecil (kartu grid, tabel, modal), jadi
          // langsung dipotong & disimpan di ukuran 200x200 sejak awal upload —
          // supaya ukuran berkasnya kecil dan lebih cepat dimuat di mana pun dipakai,
          // tidak perlu lagi minta Google Drive resize ulang tiap kali ditampilkan.
          const canvas = cropperInstance.current.getCroppedCanvas({ width: 200, height: 200 });
          const base64Image = canvas.toDataURL('image/jpeg', 0.85);
          onCropComplete(base64Image);
        }
      };

      return (
        <div className="fixed inset-0 bg-slate-900/90 z-[60] flex flex-col items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white p-4 rounded-3xl w-full max-w-md shadow-2xl flex flex-col h-[75vh]">
            <h3 className="font-bold text-xl mb-4 text-center text-gray-800">Sesuaikan Ukuran Foto</h3>
            <p className="text-center text-sm text-gray-500 mb-4 -mt-3">Geser atau cubit untuk menyesuaikan gambar.</p>
            <div className="flex-1 bg-black rounded-2xl overflow-hidden relative min-h-0 border-2 border-gray-100 shadow-inner">
              <img ref={imageElement} src={imageSrc} className="max-w-full block" alt="Crop preview" />
            </div>
            <div className="grid grid-cols-2 gap-3 mt-6 shrink-0">
              <button type="button" onClick={onCancel} className="bg-gray-100 hover:bg-gray-200 text-gray-700 py-3.5 rounded-xl font-bold transition-colors">Batal</button>
              <button type="button" onClick={handleCrop} className="bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold shadow-md transition-colors">Selesai Potong</button>
            </div>
          </div>
        </div>
      );

    function CustomNotificationModal({ config, onClose }) {

                <div className="bg-emerald-100 text-emerald-600 w-16 h-16 rounded-full flex items-center justify-center shadow-lg shadow-emerald-100">

                  <i className="fa-solid fa-circle-info text-2xl"></i>

              )}
              {isConfirm && (
                <div className="bg-amber-100 text-amber-600 w-16 h-16 rounded-full flex items-center justify-center shadow-lg shadow-amber-100">

            <h3 className="font-bold text-lg text-slate-800 mb-2">{config.title}</h3>
            <p className="text-sm text-slate-500 whitespace-pre-line leading-relaxed mb-6">{config.message}</p>

            <div className="flex gap-3 justify-center">
              {isConfirm ? (
                <>

                  <button onClick={() => { config.onConfirm(); onClose(); }} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-sm font-bold shadow-md shadow-indigo-100 transition-colors">Ya, Lanjutkan</button>
                </>
              ) : (
                <button onClick={onClose} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl text-sm font-bold shadow-md shadow-indigo-100 transition-colors">OK</button>
